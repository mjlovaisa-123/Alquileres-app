                            <span>{nombreItem(l.item_id)} — {describirLinea(l)}{(() => { const it = r.items.find((i) => i.id === l.item_id); const pd = it && l.mes_desde ? it.periodos[l.mes_desde - 1] : null; const ph = it && l.mes_desde ? it.periodos[(l.mes_hasta || l.mes_desde) - 1] : null; return pd && ph && pd.desde ? ` (${fmtDate(pd.desde)} al ${fmtDate(ph.hasta)})` : ""; })()}</span>
                            <span>{fmtMon(l.monto_moneda, g.moneda)}</span>
                          </div>
                        ))}
                        {fa.observaciones && <div style={{ ...ocMini, marginTop: 4 }}>{fa.observaciones}</div>}
                      </td></tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </>
  );
}

// =================================================================
// OTRAS CONTRATACIONES — pendientes
// =================================================================
function OCPendientesView({ resumenes, onAbrir }) {
  const [corte, setCorte] = useState(hoyISO());
  const corteD = corte ? parseDateLocal(corte) : new Date();
  const titulo = (r) => [r.g.numero_interno, r.g.objeto, r.g.proveedor].filter(Boolean).join(" · ") || "Gestión";

  const meses = [];
  resumenes.forEach((r) => r.items.forEach((it) => {
    if (it.modalidad !== "mensual") return;
    it.avance.pendientes.forEach((m) => {
      const p = it.periodos[m - 1];
      if (p && p.desde && p.hasta <= corteD) meses.push({ r, it, m, rg: { desde: p.desde, hasta: p.hasta }, monto: p.monto });
    });
  }));
  const totUSD = round2(meses.filter((x) => x.r.g.moneda === "USD").reduce((s, x) => s + x.monto, 0));
  const totARS = round2(meses.filter((x) => x.r.g.moneda !== "USD").reduce((s, x) => s + x.monto, 0));
  const otros = [];
  resumenes.forEach((r) => r.items.forEach((it) => {
    if (it.modalidad === "hitos" && it.avance.pendientesHitos.length) otros.push({ r, it, detalle: it.avance.pendientesHitos.map((h) => h.descripcion || `Hito ${h.numero}`).join(", ") });
    if (it.modalidad === "cantidad" && it.avance.pendienteCant > 0) otros.push({ r, it, detalle: `${fmtCant(it.avance.pendienteCant)} ${it.unidad || ""} sin consumir` });
    if (it.modalidad === "mensual" && !r.g.fecha_inicio && (it.avance.pendientes.length || it.avance.sinInicio)) otros.push({ r, it, detalle: it.avance.sinInicio ? "Proporcional: falta la fecha de inicio" : `${it.avance.pendientes.length} meses sin devengar (falta fecha de inicio)` });
  }));
  const facturas = [];
  resumenes.forEach((r) => r.facturas.forEach((f) => { if (!f.numero_devengado || !f.fecha_pago || f.imputaciones.length === 0 || f.descuadre) facturas.push({ r, f }); }));
  const insuf = resumenes.filter((r) => r.insuficiente);
  const filaClick = (r) => ({ onClick: () => onAbrir(r.g.id), style: { cursor: "pointer" } });

  return (
    <>
      <header style={{ marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 10 }}>
        <div>
          <h1 className="serif" style={{ fontSize: 24, margin: 0, fontWeight: 600 }}>Pendientes — otras contrataciones</h1>
          <p style={{ fontSize: 13, color: "#8A8578", margin: "5px 0 0" }}>Qué falta devengar, imputar o pagar a una fecha</p>
        </div>
        <Campo label="Al día"><input type="date" value={corte} onChange={(e) => setCorte(e.target.value)} style={{ ...inputStyle, width: 170 }} /></Campo>
      </header>

      {insuf.length > 0 && (
        <div style={{ ...ocCard, background: "#FBEBE7", border: "1px solid #E4B8AF" }}>
          <div style={{ ...ocH2, color: "#9C3F2E" }}>Preventivo insuficiente ({insuf.length})</div>
          {insuf.map((r) => (
            <div key={r.g.id} {...filaClick(r)} style={{ fontSize: 13, marginBottom: 4, cursor: "pointer" }}>
              <b>{titulo(r)}</b> — falta devengar ≈ {fmtMoney(r.pendientePesosEst)} y quedan {fmtMoney(r.saldoPreventivos)} en preventivos
            </div>
          ))}
        </div>
      )}

      <div style={ocCard}>
        <div style={ocH2}>Meses y períodos cumplidos sin devengar ({meses.length})</div>
        {meses.length === 0 ? <div style={{ fontSize: 13, color: "#8A8578" }}>No hay meses vencidos sin factura a esta fecha.</div> : (
          <div style={{ overflowX: "auto" }}>
            <table>
              <thead><tr><th>Gestión</th><th>Ítem</th><th>Mes</th><th>Período</th><th style={{ textAlign: "right" }}>Monto</th></tr></thead>
              <tbody>
                {meses.map((x) => (
                  <tr key={`${x.it.id}-${x.m}`} {...filaClick(x.r)}>
                    <td>{titulo(x.r)}</td><td>{x.it.descripcion}</td><td>{x.m}</td>
                    <td>{fmtDate(x.rg.desde)} al {fmtDate(x.rg.hasta)}</td>
                    <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>{fmtMon(x.monto, x.r.g.moneda)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{ textAlign: "right", fontSize: 13.5, marginTop: 10 }}>
              {totARS > 0 && <span style={{ marginLeft: 16 }}>Total $: <b>{fmtMoney(totARS)}</b></span>}
              {totUSD > 0 && <span style={{ marginLeft: 16 }}>Total USD: <b>{fmtNum(totUSD)}</b></span>}
            </div>
          </div>
        )}
      </div>

      <div style={ocCard}>
        <div style={ocH2}>Hitos y cantidades sin devengar ({otros.length})</div>
        {otros.length === 0 ? <div style={{ fontSize: 13, color: "#8A8578" }}>Nada pendiente.</div> : (
          <table>
            <thead><tr><th>Gestión</th><th>Ítem</th><th>Pendiente</th><th style={{ textAlign: "right" }}>Saldo del ítem</th></tr></thead>
            <tbody>
              {otros.map((x, n) => (
                <tr key={n} {...filaClick(x.r)}>
                  <td>{titulo(x.r)}</td><td>{x.it.descripcion}</td><td>{x.detalle}</td>
                  <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>{fmtMon(x.it.saldo, x.r.g.moneda)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      <div style={ocCard}>
        <div style={ocH2}>Facturas con datos pendientes ({facturas.length})</div>
        {facturas.length === 0 ? <div style={{ fontSize: 13, color: "#8A8578" }}>Todas las facturas tienen devengado, imputación y pago.</div> : (
          <table>
            <thead><tr><th>Gestión</th><th>Factura</th><th style={{ textAlign: "right" }}>$</th><th>Falta</th></tr></thead>
            <tbody>
              {facturas.map(({ r, f }) => (
                <tr key={f.id} {...filaClick(r)}>
                  <td>{titulo(r)}</td>
                  <td>{f.numero_factura}<div style={ocMini}>{fmtDate(f.fecha_factura)}</div></td>
                  <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>{fmtMoney(f.totalPesos)}</td>
                  <td style={{ fontSize: 12.5 }}>
                    {[f.imputaciones.length === 0 && "imputación", f.descuadre && f.imputaciones.length > 0 && "imputación no cuadra", !f.numero_devengado && "N° devengado", !f.fecha_pago && "fecha de pago"].filter(Boolean).join(" · ")}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </>
  );
}

// =================================================================
// TIPO DE CAMBIO BNA (tabla compartida)
// =================================================================
function TCView({ tcs, onCambio }) {
  const [texto, setTexto] = useState("");
  const [mensaje, setMensaje] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [nuevo, setNuevo] = useState({ fecha: hoyISO(), valor: "" });

  const parsearFecha = (s) => {
    s = s.trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (!m) return null;
    const y = m[3].length === 2 ? "20" + m[3] : m[3];
    return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  };
  const guardarFilas = async (filas) => {
    const unicas = Object.values(filas.reduce((acc, f) => { acc[f.fecha] = f; return acc; }, {}));
    const { error } = await db.from("tc_bna").upsert(unicas, { onConflict: "fecha" });
    if (error) throw error;
    return unicas.length;
  };
  const importar = async () => {
    setGuardando(true); setMensaje("");
    try {
      const malas = [];
      const filas = texto.trim().split("\n").map((linea) => {
        if (!linea.trim()) return null;
        const partes = linea.split(/\t|;/).map((s) => s.trim()).filter(Boolean);
        const fecha = partes[0] ? parsearFecha(partes[0]) : null;
        const valor = partes.length > 1 ? ocNum(partes[partes.length - 1]) : 0;
        if (!fecha || !(valor > 0)) { malas.push(linea); return null; }
        return { fecha, vendedor: valor };
      }).filter(Boolean);
      if (filas.length === 0) { setMensaje("Error: no se pudo interpretar ninguna fila. Formato: fecha [tab o ;] valor, una por línea."); return; }
      const n = await guardarFilas(filas);
      setMensaje(`Se cargaron o actualizaron ${n} valores.${malas.length ? ` ${malas.length} línea(s) no se pudieron leer.` : ""}`);
      setTexto("");
      onCambio();
    } catch (e) { setMensaje("Error: " + e.message); }
    finally { setGuardando(false); }
  };
  const agregarUno = async () => {
    if (!nuevo.fecha || !(ocNum(nuevo.valor) > 0)) return;
    try { await guardarFilas([{ fecha: nuevo.fecha, vendedor: ocNum(nuevo.valor) }]); setNuevo({ ...nuevo, valor: "" }); onCambio(); }
    catch (e) { alert("Error: " + e.message); }
  };
  const eliminar = async (t) => {
    if (!confirm(`¿Eliminar el TC del ${fmtDate(t.fecha)}?`)) return;
    const { error } = await db.from("tc_bna").delete().eq("fecha", t.fecha);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };

  return (
    <>
      <h1 className="serif" style={{ fontSize: 24, margin: "0 0 6px", fontWeight: 600 }}>Tipo de cambio BNA</h1>
      <p style={{ fontSize: 13, color: "#8A8578", margin: "0 0 18px" }}>Dólar billete, tipo vendedor. Pegá una tabla desde Excel (fecha y valor) o cargá un día. Si una fecha ya existe, se actualiza.</p>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 20 }}>
        <div>
          <div style={ocCard}>
            <label style={{ fontSize: 11, fontWeight: 600, color: "#8A8578", textTransform: "uppercase" }}>Cargar un día</label>
            <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
              <input type="date" value={nuevo.fecha} onChange={(e) => setNuevo({ ...nuevo, fecha: e.target.value })} style={{ ...inputStyle, width: 160 }} />
              <input value={nuevo.valor} onChange={(e) => setNuevo({ ...nuevo, valor: e.target.value })} placeholder="1.385,50" style={{ ...ocNumInput, width: 130 }} />
              <button onClick={agregarUno} style={ocBtn2}>+ Agregar</button>
            </div>
          </div>
          <div style={ocCard}>
            <label style={{ fontSize: 11, fontWeight: 600, color: "#8A8578", textTransform: "uppercase" }}>Pegar tabla (fecha [tab o ;] valor, una por línea)</label>
            <textarea value={texto} onChange={(e) => setTexto(e.target.value)} rows={8} placeholder={"01/09/2026\t1.385,50\n02/09/2026\t1.390,00"}
              style={{ width: "100%", marginTop: 6, padding: 10, borderRadius: 7, border: "1px solid #E4E1D8", fontSize: 13, fontFamily: "monospace", boxSizing: "border-box" }} />
            {mensaje && <div style={{ marginTop: 10, fontSize: 12.5, color: mensaje.startsWith("Error") ? "#B54B3A" : "#4A7856" }}>{mensaje}</div>}
            <button onClick={importar} disabled={guardando || !texto.trim()} style={{ ...ocBtn, marginTop: 12 }}>{guardando ? "Cargando…" : "Importar tabla"}</button>
          </div>
        </div>
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, overflow: "hidden", maxHeight: 460, overflowY: "auto" }}>
          <table>
            <thead><tr><th>Fecha</th><th style={{ textAlign: "right" }}>Vendedor</th><th></th></tr></thead>
            <tbody>
              {[...tcs].reverse().slice(0, 500).map((t) => (
                <tr key={t.fecha}><td>{fmtDate(t.fecha)}</td><td style={{ textAlign: "right", fontWeight: 600 }}>{fmtNum(t.vendedor)}</td><td style={{ width: 30 }}><button onClick={() => eliminar(t)} style={ocBtnX}>×</button></td></tr>
              ))}
              {tcs.length === 0 && <tr><td colSpan={3} style={{ textAlign: "center", color: "#8A8578" }}>Sin valores cargados todavía</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}


// =================================================================
// APP
// =================================================================
function App() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    db.auth.getSession().then(({ data: { session } }) => setSession(session));
    const { data: listener } = db.auth.onAuthStateChange((_e, session) => setSession(session));
    return () => listener.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", fontFamily: "Inter, sans-serif", color: "#8A8578" }}>Cargando…</div>;
  return session ? <Dashboard /> : <Login />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
