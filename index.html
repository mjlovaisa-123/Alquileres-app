      dependencia_id: ant.dependencia_id != null ? String(ant.dependencia_id) : "", moneda: ant.moneda || "ARS", regla_tc: ant.regla_tc || "dia_anterior",
    }));
    setAviso("Se copiaron proveedor, objeto, jurisdicción, dependencia y moneda de la gestión anterior. Revisalos antes de guardar.");
  };

  const totalItem = (it) => {
    if (it.modalidad === "mensual") return round2(it.tramos.reduce((s, t) => s + Math.max(0, (parseInt(t.hasta, 10) || 0) - (parseInt(t.desde, 10) || 0) + 1) * ocNum(t.valor), 0));
    if (it.modalidad === "cantidad") return round2(ocNum(it.cantidad) * ocNum(it.precio_unitario));
    return round2(ocNum(it.total));
  };
  const totalGestion = round2(items.reduce((s, it) => s + totalItem(it), 0));

  const nuevoItem = () => setItems((xs) => [...xs, {
    key: ocKey(), id: null, renglon: "", item: "", descripcion: "", modalidad: "mensual", proporcional: false, cantidad: "", unidad: "", precio_unitario: "", total: "",
    tramos: [{ key: ocKey(), desde: "1", hasta: c.plazo_meses || "12", valor: "" }], hitos: [],
  }]);
  const cambiarModalidad = (it, modalidad) => {
    const patch = { modalidad };
    if (modalidad === "mensual" && it.tramos.length === 0) patch.tramos = [{ key: ocKey(), desde: "1", hasta: c.plazo_meses || "12", valor: "" }];
    if (modalidad === "hitos" && it.hitos.length === 0) patch.hitos = [{ key: ocKey(), id: null, descripcion: "", porcentaje: "", monto: "" }];
    setItem(it.key, patch);
  };
  const setTramo = (it, key, patch) => setItem(it.key, { tramos: it.tramos.map((t) => (t.key === key ? { ...t, ...patch } : t)) });
  const agregarTramo = (it) => {
    const ultimo = it.tramos[it.tramos.length - 1];
    const desde = ultimo ? (parseInt(ultimo.hasta, 10) || 0) + 1 : 1;
    setItem(it.key, { tramos: [...it.tramos, { key: ocKey(), desde: String(desde), hasta: String(desde + 5), valor: "" }] });
  };
  const setHito = (it, key, campo, valor) => {
    const total = ocNum(it.total);
    setItem(it.key, {
      hitos: it.hitos.map((h) => {
        if (h.key !== key) return h;
        if (campo === "porcentaje") return { ...h, porcentaje: valor, monto: total > 0 && valor.trim() ? aInput(round2(total * ocNum(valor) / 100)) : h.monto };
        if (campo === "monto") return { ...h, monto: valor, porcentaje: total > 0 && valor.trim() ? aInput(Math.round(ocNum(valor) / total * 1000000) / 10000) : h.porcentaje };
        return { ...h, [campo]: valor };
      }),
    });
  };
  const cambiarTotalHitos = (it, valor) => {
    const total = ocNum(valor);
    setItem(it.key, { total: valor, hitos: it.hitos.map((h) => (h.porcentaje.trim() ? { ...h, monto: aInput(round2(total * ocNum(h.porcentaje) / 100)) } : h)) });
  };

  const guardar = async () => {
    setAviso("");
    if (!c.objeto.trim() && !c.proveedor.trim()) { setAviso("Completá al menos el objeto o el proveedor."); return; }
    for (const it of items) {
      const nombre = it.descripcion.trim() || "(sin descripción)";
      if (!it.descripcion.trim()) { setAviso("Todos los ítems necesitan una descripción."); return; }
      if (it.modalidad === "mensual") {
        if (it.tramos.length === 0) { setAviso(`El ítem "${nombre}" necesita al menos un tramo mensual.`); return; }
        const ts = it.tramos.map((t) => ({ d: parseInt(t.desde, 10), h: parseInt(t.hasta, 10), v: ocNum(t.valor) })).sort((a, b) => a.d - b.d);
        for (let k = 0; k < ts.length; k++) {
          if (!(ts[k].d >= 1) || !(ts[k].h >= ts[k].d)) { setAviso(`Revisá los meses de los tramos de "${nombre}".`); return; }
          if (!(ts[k].v > 0)) { setAviso(`Falta el valor mensual en un tramo de "${nombre}".`); return; }
          if (k > 0 && ts[k].d <= ts[k - 1].h) { setAviso(`Los tramos de "${nombre}" se superponen.`); return; }
        }
      } else if (it.modalidad === "cantidad") {
        if (!(ocNum(it.cantidad) > 0) || !(ocNum(it.precio_unitario) > 0)) { setAviso(`Completá cantidad y precio unitario de "${nombre}".`); return; }
      } else {
        if (!(ocNum(it.total) > 0)) { setAviso(`Completá el monto total de "${nombre}".`); return; }
        if (it.hitos.length === 0) { setAviso(`Agregá al menos un hito a "${nombre}".`); return; }
      }
    }
    // Controles sobre ítems que ya tienen facturas cargadas
    const originales = gestion ? data.items.filter((i) => i.gestion_id === gestion.id) : [];
    const idsOrig = new Set(originales.map((i) => i.id));
    const lineasG = data.lineas.filter((l) => idsOrig.has(l.item_id));
    const itemsConLineas = new Set(lineasG.map((l) => l.item_id));
    const hitosConLineas = new Set(lineasG.map((l) => l.hito_id).filter(Boolean));
    for (const o of originales) {
      const actual = items.find((i) => i.id === o.id);
      if (!actual && itemsConLineas.has(o.id)) { setAviso(`El ítem "${o.descripcion}" ya tiene facturas cargadas: no se puede eliminar.`); return; }
      if (actual && actual.modalidad !== o.modalidad && itemsConLineas.has(o.id)) { setAviso(`El ítem "${o.descripcion}" ya tiene facturas cargadas: no se puede cambiar su modalidad.`); return; }
      if (actual && actual.modalidad === "mensual" && !!actual.proporcional !== !!o.proporcional && itemsConLineas.has(o.id)) { setAviso(`El ítem "${o.descripcion}" ya tiene facturas cargadas: no se puede cambiar el cálculo proporcional.`); return; }
      if (actual && o.proporcional && itemsConLineas.has(o.id) && (c.fecha_inicio || "") !== (gestion.fecha_inicio || "")) { setAviso(`No se puede cambiar la fecha de inicio: el ítem proporcional "${o.descripcion}" ya tiene facturas y sus períodos dependen de esa fecha.`); return; }
      if (o.modalidad === "hitos") {
        const quedan = new Set(actual && actual.modalidad === "hitos" ? actual.hitos.filter((h) => h.id).map((h) => h.id) : []);
        const borrados = data.hitos.filter((h) => h.item_id === o.id && !quedan.has(h.id) && hitosConLineas.has(h.id));
        if (borrados.length) { setAviso(`El hito "${borrados[0].descripcion || borrados[0].numero}" ya tiene una factura: no se puede eliminar.`); return; }
      }
    }

    setGuardando(true);
    try {
      const jur = jurisdicciones.find((j) => String(j.codigo) === c.jurisdiccion_codigo);
      const dep = dependencias.find((d) => String(d.id) === c.dependencia_id);
      const txt = (v) => (v.trim() ? v.trim() : null);
      const payload = {
        numero_interno: txt(c.numero_interno), expediente: txt(c.expediente), norma_legal: txt(c.norma_legal), tipo_contratacion: c.tipo_contratacion || null,
        jurisdiccion_codigo: jur ? jur.codigo : null, dependencia_id: dep ? dep.id : null,
        proveedor: txt(c.proveedor), cuit: txt(c.cuit), objeto: txt(c.objeto), moneda: c.moneda, regla_tc: c.regla_tc,
        fecha_inicio: c.fecha_inicio || null, plazo_meses: c.plazo_meses ? parseInt(c.plazo_meses, 10) : null,
        monto_norma: c.monto_norma.trim() ? ocNum(c.monto_norma) : null, estado_tramite: c.estado_tramite || null,
        gestion_anterior_id: c.gestion_anterior_id ? Number(c.gestion_anterior_id) : null, observaciones: txt(c.observaciones),
        rubro: c.rubro || null,
      };
      let gid;
      if (esEdicion) {
        const { error } = await db.from("oc_gestiones").update(payload).eq("id", gestion.id);
        if (error) throw error;
        gid = gestion.id;
      } else {
        const { data: fila, error } = await db.from("oc_gestiones").insert(payload).select().single();
        if (error) throw error;
        gid = fila.id;
      }
      // Ítems eliminados
      const quedanIds = new Set(items.filter((i) => i.id).map((i) => i.id));
      const borrarItems = originales.filter((o) => !quedanIds.has(o.id)).map((o) => o.id);
      if (borrarItems.length) { const { error } = await db.from("oc_items").delete().in("id", borrarItems); if (error) throw error; }
      // Ítems nuevos o modificados
      for (let k = 0; k < items.length; k++) {
        const it = items[k];
        const fila = {
          gestion_id: gid, renglon: txt(it.renglon), item: txt(it.item), descripcion: it.descripcion.trim(), modalidad: it.modalidad, orden: k,
          proporcional: it.modalidad === "mensual" && !!it.proporcional,
          cantidad: it.modalidad === "cantidad" ? ocNum(it.cantidad) : it.modalidad === "hitos" ? 1 : null,
          unidad: it.modalidad === "cantidad" ? txt(it.unidad) : null,
          precio_unitario: it.modalidad === "cantidad" ? ocNum(it.precio_unitario) : it.modalidad === "hitos" ? round2(ocNum(it.total)) : null,
        };
        let itemId = it.id;
        if (itemId) {
          const { error } = await db.from("oc_items").update(fila).eq("id", itemId);
          if (error) throw error;
        } else {
          const { data: nuevo, error } = await db.from("oc_items").insert(fila).select().single();
          if (error) throw error;
          itemId = nuevo.id;
        }
        const { error: et } = await db.from("oc_item_tramos").delete().eq("item_id", itemId);
        if (et) throw et;
        if (it.modalidad === "mensual") {
          const { error } = await db.from("oc_item_tramos").insert(it.tramos.map((t) => ({
            item_id: itemId, desde_mes: parseInt(t.desde, 10), hasta_mes: parseInt(t.hasta, 10), valor_mensual: round2(ocNum(t.valor)),
          })));
          if (error) throw error;
        }
        const hitosOrig = it.id ? data.hitos.filter((h) => h.item_id === it.id) : [];
        if (it.modalidad === "hitos") {
          const quedan = new Set(it.hitos.filter((h) => h.id).map((h) => h.id));
          const borrar = hitosOrig.filter((h) => !quedan.has(h.id)).map((h) => h.id);
          if (borrar.length) { const { error } = await db.from("oc_item_hitos").delete().in("id", borrar); if (error) throw error; }
          for (let n = 0; n < it.hitos.length; n++) {
            const h = it.hitos[n];
            const filaH = { item_id: itemId, numero: n + 1, descripcion: txt(h.descripcion), porcentaje: h.porcentaje.trim() ? ocNum(h.porcentaje) : null, monto: round2(ocNum(h.monto)) };
            const { error } = h.id ? await db.from("oc_item_hitos").update(filaH).eq("id", h.id) : await db.from("oc_item_hitos").insert(filaH);
            if (error) throw error;
          }
        } else if (hitosOrig.length) {
          const { error } = await db.from("oc_item_hitos").delete().eq("item_id", itemId);
          if (error) throw error;
        }
      }
      // Preventivos iniciales (solo en el alta)
      const prevsValidos = prevs.filter((p) => ocNum(p.monto) > 0);
      if (prevsValidos.length) {
        const { error } = await db.from("oc_preventivos").insert(prevsValidos.map((p) => ({
          gestion_id: gid, anio: p.anio ? parseInt(p.anio, 10) : null, fuente: txt(p.fuente), numero: txt(p.numero), monto: round2(ocNum(p.monto)),
        })));
        if (error) throw error;
      }
      // Documentos (solo en el alta; después se agregan desde el detalle)
      for (const d of docs) await ocSubirDocumento(gid, d.file, d.tipo);
      await onGuardado(gid);
    } catch (e) {
      setAviso("Error al guardar: " + (e.message || e));
      setGuardando(false);
    }
  };

  const renderItem = (it, idx) => {
    const total = totalItem(it);
    const sumaPct = it.hitos.reduce((s, h) => s + ocNum(h.porcentaje), 0);
    const sumaHitos = round2(it.hitos.reduce((s, h) => s + ocNum(h.monto), 0));
    return (
      <div key={it.key} style={{ border: "1px solid #E4E1D8", borderRadius: 9, padding: 14, marginTop: 12, background: "#FDFCFA" }}>
        <div style={{ display: "grid", gridTemplateColumns: "80px 80px 1fr 170px 30px", gap: 8, alignItems: "end" }}>
          <Campo label="Renglón"><input value={it.renglon} onChange={(e) => setItem(it.key, { renglon: e.target.value })} style={inputStyle} /></Campo>
          <Campo label="Ítem"><input value={it.item} onChange={(e) => setItem(it.key, { item: e.target.value })} style={inputStyle} /></Campo>
          <Campo label="Descripción"><input value={it.descripcion} onChange={(e) => setItem(it.key, { descripcion: e.target.value })} style={inputStyle} /></Campo>
          <Campo label="Modalidad">
            <select value={it.modalidad} onChange={(e) => cambiarModalidad(it, e.target.value)} style={inputStyle}>
              {Object.entries(OC_MODALIDADES).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
            </select>
          </Campo>
          <button title="Quitar ítem" onClick={() => setItems((xs) => xs.filter((x) => x.key !== it.key))} style={{ ...ocBtnX, paddingBottom: 8 }}>×</button>
        </div>

        {it.modalidad === "mensual" && (
          <div style={{ marginTop: 10 }}>
            <table>
              <thead><tr><th>Desde mes</th><th>Hasta mes</th><th style={{ textAlign: "right" }}>Valor mensual</th><th style={{ textAlign: "right" }}>Subtotal</th><th></th></tr></thead>
              <tbody>
                {it.tramos.map((t) => {
                  const meses = Math.max(0, (parseInt(t.hasta, 10) || 0) - (parseInt(t.desde, 10) || 0) + 1);
                  return (
                    <tr key={t.key}>
                      <td><input value={t.desde} onChange={(e) => setTramo(it, t.key, { desde: e.target.value.replace(/\D/g, "") })} style={{ ...inputStyle, width: 70 }} /></td>
                      <td><input value={t.hasta} onChange={(e) => setTramo(it, t.key, { hasta: e.target.value.replace(/\D/g, "") })} style={{ ...inputStyle, width: 70 }} /></td>
                      <td><input value={t.valor} onChange={(e) => setTramo(it, t.key, { valor: e.target.value })} placeholder="0,00" style={ocNumInput} /></td>
                      <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>{fmtMon(meses * ocNum(t.valor), c.moneda)}</td>
                      <td>{it.tramos.length > 1 && <button onClick={() => setItem(it.key, { tramos: it.tramos.filter((x) => x.key !== t.key) })} style={ocBtnX}>×</button>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8, flexWrap: "wrap", gap: 8 }}>
              <button onClick={() => agregarTramo(it)} style={ocBtn2}>+ Tramo con otro valor</button>
              <span style={{ fontSize: 13 }}>Total adjudicado del ítem: <b>{fmtMon(total, c.moneda)}</b></span>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "end", marginTop: 10, flexWrap: "wrap" }}>
              <div style={{ minWidth: 260 }}>
                <Campo label="Cálculo del mes">
                  <select value={it.proporcional ? "si" : "no"} onChange={(e) => setItem(it.key, { proporcional: e.target.value === "si" })} style={inputStyle}>
                    <option value="no">Sin proporcional (mes de contrato completo)</option>
                    <option value="si">Proporcional por días reales (mes calendario)</option>
                  </select>
                </Campo>
              </div>
              {it.proporcional && c.fecha_inicio && (
                <button onClick={() => setVerPeriodos((v) => ({ ...v, [it.key]: !v[it.key] }))} style={ocBtn2}>{verPeriodos[it.key] ? "Ocultar períodos" : "Ver períodos"}</button>
              )}
            </div>
            {it.proporcional && !c.fecha_inicio && <div style={{ fontSize: 12, color: "#9A6B1E", marginTop: 6 }}>Para calcular los períodos proporcionales hace falta la fecha de inicio. Podés guardar igual y cargarla después.</div>}
            {it.proporcional && c.fecha_inicio && verPeriodos[it.key] && (() => {
              const pr = ocPeriodosItem({ fecha_inicio: c.fecha_inicio }, {
                proporcional: true,
                tramos: it.tramos.map((t) => ({ desde_mes: parseInt(t.desde, 10) || 0, hasta_mes: parseInt(t.hasta, 10) || 0, valor_mensual: ocNum(t.valor) })).filter((t) => t.desde_mes > 0 && t.hasta_mes >= t.desde_mes),
              });
              return (
                <div style={{ marginTop: 8, overflowX: "auto" }}>
                  <table>
                    <thead><tr><th>Per.</th><th>Período</th><th>Detalle</th><th style={{ textAlign: "right" }}>Monto</th></tr></thead>
                    <tbody>
                      {pr.periodos.map((p) => (
                        <tr key={p.n} style={{ background: p.completo ? "transparent" : "#FBF6EC" }}>
                          <td>{p.n}</td><td style={{ whiteSpace: "nowrap" }}>{fmtDate(p.desde)} al {fmtDate(p.hasta)}</td>
                          <td style={{ fontSize: 12 }}>{ocDetallePeriodo(p, c.moneda)}</td>
                          <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>{fmtMon(p.monto, c.moneda)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div style={{ textAlign: "right", fontSize: 12.5, marginTop: 6 }}>
                    Total a pagar: <b>{fmtMon(pr.total, c.moneda)}</b>
                    {Math.abs(pr.total - pr.nominal) > 0.01 && <span style={{ color: "#8A8578" }}> (adjudicado {fmtMon(pr.nominal, c.moneda)}; diferencia {fmtMon(pr.total - pr.nominal, c.moneda)})</span>}
                  </div>
                </div>
              );
            })()}
          </div>
        )}

        {it.modalidad === "cantidad" && (
          <div style={{ ...ocGrid, marginTop: 10 }}>
            <Campo label="Cantidad"><input value={it.cantidad} onChange={(e) => setItem(it.key, { cantidad: e.target.value })} style={ocNumInput} /></Campo>
            <Campo label="Unidad"><input value={it.unidad} onChange={(e) => setItem(it.key, { unidad: e.target.value })} placeholder="h/h" style={inputStyle} /></Campo>
            <Campo label="Precio unitario"><input value={it.precio_unitario} onChange={(e) => setItem(it.key, { precio_unitario: e.target.value })} placeholder="0,00" style={ocNumInput} /></Campo>
            <Campo label="Total del ítem"><div style={{ padding: "8px 0", fontWeight: 600 }}>{fmtMon(total, c.moneda)}</div></Campo>
          </div>
        )}

        {it.modalidad === "hitos" && (
          <div style={{ marginTop: 10 }}>
            <div style={{ maxWidth: 240 }}>
              <Campo label="Monto total del ítem"><input value={it.total} onChange={(e) => cambiarTotalHitos(it, e.target.value)} placeholder="0,00" style={ocNumInput} /></Campo>
            </div>
            <table style={{ marginTop: 8 }}>
              <thead><tr><th>Hito</th><th>Descripción</th><th style={{ textAlign: "right" }}>%</th><th style={{ textAlign: "right" }}>Monto</th><th></th></tr></thead>
              <tbody>
                {it.hitos.map((h, n) => (
                  <tr key={h.key}>
                    <td style={{ color: "#8A8578" }}>{n + 1}</td>
                    <td><input value={h.descripcion} onChange={(e) => setHito(it, h.key, "descripcion", e.target.value)} style={inputStyle} /></td>
                    <td><input value={h.porcentaje} onChange={(e) => setHito(it, h.key, "porcentaje", e.target.value)} style={{ ...ocNumInput, width: 80 }} /></td>
                    <td><input value={h.monto} onChange={(e) => setHito(it, h.key, "monto", e.target.value)} style={ocNumInput} /></td>
                    <td><button onClick={() => setItem(it.key, { hitos: it.hitos.filter((x) => x.key !== h.key) })} style={ocBtnX}>×</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8, flexWrap: "wrap", gap: 8 }}>
              <button onClick={() => setItem(it.key, { hitos: [...it.hitos, { key: ocKey(), id: null, descripcion: "", porcentaje: "", monto: "" }] })} style={ocBtn2}>+ Hito</button>
              <span style={{ fontSize: 12.5, color: Math.abs(sumaHitos - total) > 0.01 ? "#9C3F2E" : "#4A7856" }}>
                Hitos: {fmtNum(sumaPct)}% · {fmtMon(sumaHitos, c.moneda)} {Math.abs(sumaHitos - total) > 0.01 ? "— no coincide con el total del ítem" : "✓"}
              </span>
            </div>
            <div style={{ ...ocMini, marginTop: 4 }}>Podés cargar el % o el monto de cada hito; el otro se calcula solo.</div>
          </div>
        )}
      </div>
    );
  };

  const montoNorma = c.monto_norma.trim() ? ocNum(c.monto_norma) : null;
  return (
    <>
      <header style={{ marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 10 }}>
        <div>
          {esEdicion && <button onClick={onCancelar} style={{ ...ocBtn2, marginBottom: 10 }}>← Volver a la gestión</button>}
          <h1 className="serif" style={{ fontSize: 24, margin: 0, fontWeight: 600 }}>{esEdicion ? "Editar gestión" : "Nueva gestión"}</h1>
        </div>
      </header>

      {!esEdicion && (
        <div style={{ ...ocCard, border: "1px dashed #B7C1D6", background: "#F8F9FC" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
            <div>
              <div style={{ ...ocH2, margin: 0 }}>Precargar desde PDF</div>
              <div style={{ ...ocMini, marginTop: 3 }}>Subí el decreto o resolución de adjudicación (y el contrato, si lo tenés). Te muestro lo que encontré y elegís qué usar.</div>
            </div>
            <label style={ocBtn}>
              {pdfLeyendo ? "Leyendo…" : "📄 Elegir PDF"}
              <input type="file" accept="application/pdf" multiple style={{ display: "none" }} disabled={pdfLeyendo} onChange={(e) => { const fs = [...e.target.files]; e.target.value = ""; leerPDFs(fs); }} />
            </label>
          </div>
          {pdfMsg && <div style={{ fontSize: 12.5, color: "#9A6B1E", marginTop: 10 }}>{pdfMsg}</div>}
          {pdfProp && (
            <div style={{ marginTop: 12 }}>
              <div style={ocMini}>Leídos: {pdfProp.documentos.map((d) => d.nombre + (d.escaneado ? " (escaneado, sin texto)" : "")).join(" · ")}</div>
              <table style={{ marginTop: 8 }}>
                <thead><tr><th style={{ width: 30 }}></th><th>Dato</th><th>Valor detectado</th></tr></thead>
                <tbody>
                  {pdfProp.campos.map((x) => (
                    <tr key={x.key}>
                      <td><input type="checkbox" checked={x.aceptar} disabled={!x.mostrar} onChange={() => togglePdfCampo(x.key)} /></td>
                      <td style={{ fontSize: 12.5 }}>{x.label}</td>
                      <td style={{ fontSize: 12.5, color: x.mostrar ? "inherit" : "#9A6B1E" }}>{x.mostrar || "No encontrado"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={{ fontSize: 13, fontWeight: 600, margin: "14px 0 4px" }}>Renglones detectados ({pdfProp.renglones.length})</div>
              {pdfProp.renglones.length === 0 ? (
                <div style={{ fontSize: 12.5, color: "#9A6B1E" }}>No pude leer los renglones de este documento: cargalos a mano en "Renglones e ítems".</div>
              ) : (
                <table>
                  <thead><tr><th style={{ width: 30 }}></th><th>Ítem</th><th>Descripción</th><th>Modalidad</th><th style={{ textAlign: "right" }}>Total</th></tr></thead>
                  <tbody>
                    {pdfProp.renglones.map((r) => (
                      <tr key={r.key}>
                        <td><input type="checkbox" checked={r.aceptar} onChange={() => togglePdfRenglon(r.key)} /></td>
                        <td style={{ fontSize: 12.5 }}>{[r.renglon && `R ${r.renglon}`, r.item && `Í ${r.item}`].filter(Boolean).join(" · ") || "—"}</td>
                        <td style={{ fontSize: 12.5 }}>{r.descripcion}</td>
                        <td style={{ fontSize: 12 }}>{r.modalidad === "cantidad" ? `${fmtCant(r.cantidad)} ${r.unidad} × ${fmtNum(r.precio_unitario)}` : r.tramos.map((t) => `m${t.desde}–${t.hasta}: ${fmtNum(t.valor)}`).join(" · ")}</td>
                        <td style={{ textAlign: "right", fontSize: 12.5, whiteSpace: "nowrap" }}>{fmtNum(r.total)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
              {(() => {
                const mn = pdfProp.campos.find((x) => x.key === "monto_norma");
                const suma = round2(pdfProp.renglones.filter((r) => r.aceptar).reduce((s, r) => s + r.total, 0));
                if (!mn || !mn.valor || !pdfProp.renglones.length) return null;
                const ok = Math.abs(suma - mn.valor) <= 0.01;
                return <div style={{ fontSize: 12.5, marginTop: 8, color: ok ? "#4A7856" : "#9A6B1E" }}>{ok ? "La suma de los renglones coincide con el monto de la norma ✓" : `La suma de los renglones (${fmtNum(suma)}) no coincide con el monto de la norma (${fmtNum(mn.valor)}): revisá si falta algún ítem.`}</div>;
              })()}
              <label style={{ display: "flex", gap: 6, alignItems: "center", fontSize: 12.5, marginTop: 10 }}>
                <input type="checkbox" checked={pdfAdjuntar} onChange={(e) => setPdfAdjuntar(e.target.checked)} /> Adjuntar estos PDF a la gestión como norma legal
              </label>
              <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 10 }}>
                <button onClick={() => setPdfProp(null)} style={ocBtn2}>Descartar</button>
                <button onClick={aplicarPDF} style={ocBtn}>Aplicar al formulario</button>
              </div>
            </div>
          )}
        </div>
      )}

      <div style={{ ...ocCard, background: "#F6F5F2" }}>
        <div style={ocH2}>¿Continúa una gestión anterior?</div>
        <div style={{ maxWidth: 520 }}>
          <select value={c.gestion_anterior_id} onChange={(e) => elegirAnterior(e.target.value)} style={inputStyle}>
            <option value="">No, es nueva</option>
            {otras.map((g) => <option key={g.id} value={String(g.id)}>{[g.numero_interno, g.objeto, g.proveedor, g.norma_legal].filter(Boolean).join(" · ")}</option>)}
          </select>
        </div>
        <div style={{ ...ocMini, marginTop: 6 }}>Si elegís una, queda encadenada en la historia{esEdicion ? "" : " y se copian proveedor, objeto, jurisdicción, dependencia y moneda"}.</div>
      </div>

      <div style={ocCard}>
        <div style={ocH2}>Datos generales</div>
        <div style={ocGrid}>
          <Campo label="N° interno"><input value={c.numero_interno} onChange={(e) => set("numero_interno", e.target.value)} style={inputStyle} /></Campo>
          <Campo label="Expediente"><input value={c.expediente} onChange={(e) => set("expediente", e.target.value)} style={inputStyle} /></Campo>
          <Campo label="Norma legal"><input value={c.norma_legal} onChange={(e) => set("norma_legal", e.target.value)} placeholder="Dec. 1854/26" style={inputStyle} /></Campo>
          <Campo label="Tipo de contratación">
            <select value={c.tipo_contratacion} onChange={(e) => set("tipo_contratacion", e.target.value)} style={inputStyle}>
              <option value="">Sin definir</option>
              {OC_TIPOS_CONTRATACION.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
          </Campo>
          <Campo label="Jurisdicción">
            <select value={c.jurisdiccion_codigo} onChange={(e) => setC((x) => ({ ...x, jurisdiccion_codigo: e.target.value, dependencia_id: "" }))} style={inputStyle}>
              <option value="">Elegir…</option>
              {jurisdicciones.map((j) => <option key={j.codigo} value={String(j.codigo)}>Jur. {j.codigo} — {j.nombre}</option>)}
            </select>
          </Campo>
          <Campo label="Dependencia">
            <select value={c.dependencia_id} onChange={(e) => set("dependencia_id", e.target.value)} style={inputStyle}>
              <option value="">Elegir…</option>
              {depsJur.map((d) => <option key={d.id} value={String(d.id)}>{d.nombre}</option>)}
            </select>
          </Campo>
          <Campo label="Proveedor"><input value={c.proveedor} onChange={(e) => set("proveedor", e.target.value)} style={inputStyle} /></Campo>
          <Campo label="CUIT"><input value={c.cuit} onChange={(e) => set("cuit", e.target.value)} style={inputStyle} /></Campo>
          <Campo label="Rubro">
            <select value={c.rubro} onChange={(e) => set("rubro", e.target.value)} style={inputStyle}>
              <option value="">Sin definir</option>
              {rubros.map((r) => <option key={r.id} value={r.nombre}>{r.nombre}</option>)}
              {c.rubro && !rubros.some((r) => r.nombre === c.rubro) && <option value={c.rubro}>{c.rubro}</option>}
            </select>
          </Campo>
          <Campo label="Estado de trámite">
            <select value={c.estado_tramite} onChange={(e) => set("estado_tramite", e.target.value)} style={inputStyle}>
              <option value="">Sin definir</option>
              {estadosTramite.map((e) => <option key={e.id} value={e.nombre}>{e.nombre}</option>)}
            </select>
          </Campo>
        </div>
        <div style={{ marginTop: 12 }}>
          <Campo label="Objeto"><input value={c.objeto} onChange={(e) => set("objeto", e.target.value)} style={inputStyle} /></Campo>
        </div>
        {!esEdicion && (
          <div style={{ marginTop: 14 }}>
            <label style={{ fontSize: 11, fontWeight: 600, color: "#8A8578", textTransform: "uppercase" }}>Documentos (PDF)</label>
            <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 4, flexWrap: "wrap" }}>
              <select value={docTipo} onChange={(e) => setDocTipo(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
                {Object.entries(OC_TIPOS_DOC).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
              </select>
              <label style={ocBtn2}>
                📎 Adjuntar archivo
                <input type="file" accept="application/pdf" style={{ display: "none" }} onChange={(e) => { const f = e.target.files[0]; if (f) setDocs((ds) => [...ds, { key: ocKey(), tipo: docTipo, file: f }]); e.target.value = ""; }} />
              </label>
            </div>
            {docs.map((d) => (
              <div key={d.key} style={{ fontSize: 12.5, marginTop: 6 }}>
                {OC_TIPOS_DOC[d.tipo]}: {d.file.name} <button onClick={() => setDocs((ds) => ds.filter((x) => x.key !== d.key))} style={ocBtnX}>×</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={ocCard}>
        <div style={ocH2}>Moneda y plazo</div>
        <div style={ocGrid}>
          <Campo label="Moneda">
            <select value={c.moneda} onChange={(e) => set("moneda", e.target.value)} style={inputStyle}>
              <option value="ARS">$ (pesos)</option><option value="USD">USD (dólares)</option>
            </select>
          </Campo>
          {c.moneda === "USD" && (
            <Campo label="Tipo de cambio">
              <select value={c.regla_tc} onChange={(e) => set("regla_tc", e.target.value)} style={inputStyle}>
                {Object.entries(OC_REGLAS_TC).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
              </select>
            </Campo>
          )}
          <Campo label="Fecha de inicio"><input type="date" value={c.fecha_inicio} onChange={(e) => set("fecha_inicio", e.target.value)} style={inputStyle} /></Campo>
          <Campo label="Plazo (meses)"><input value={c.plazo_meses} onChange={(e) => set("plazo_meses", e.target.value.replace(/\D/g, ""))} style={inputStyle} /></Campo>
          <Campo label="Monto de la norma (control)"><input value={c.monto_norma} onChange={(e) => set("monto_norma", e.target.value)} placeholder="opcional" style={ocNumInput} /></Campo>
        </div>
        <div style={{ ...ocMini, marginTop: 8 }}>Si la fecha de inicio todavía no se conoce (por ej. depende de una aceptación operacional), dejala vacía: los meses se numeran igual y las fechas aparecen cuando la cargues.</div>
      </div>

      <div style={ocCard}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ ...ocH2, margin: 0 }}>Renglones e ítems</div>
          <button onClick={nuevoItem} style={ocBtn2}>+ Agregar ítem</button>
        </div>
        {items.length === 0 && <div style={{ fontSize: 13, color: "#8A8578", marginTop: 12 }}>Todavía no agregaste ítems.</div>}
        {items.map(renderItem)}
        <div style={{ textAlign: "right", marginTop: 14, fontSize: 14 }}>
          Total de la gestión: <b>{fmtMon(totalGestion, c.moneda)}</b>
          {montoNorma !== null && Math.abs(montoNorma - totalGestion) > 0.01 && (
            <div style={{ fontSize: 12.5, color: "#9C3F2E", marginTop: 4 }}>No coincide con el monto de la norma ({fmtMon(montoNorma, c.moneda)}): diferencia {fmtMon(montoNorma - totalGestion, c.moneda)}</div>
          )}
          {montoNorma !== null && Math.abs(montoNorma - totalGestion) <= 0.01 && <div style={{ fontSize: 12.5, color: "#4A7856", marginTop: 4 }}>Coincide con el monto de la norma ✓</div>}
        </div>
      </div>

      {!esEdicion && (
        <div style={ocCard}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ ...ocH2, margin: 0 }}>Preventivos iniciales</div>
            <button onClick={() => setPrevs((ps) => [...ps, { key: ocKey(), anio: String(new Date().getFullYear()), fuente: "111", numero: "", monto: "" }])} style={ocBtn2}>+ Preventivo</button>
          </div>
          {prevs.length === 0 && <div style={{ ...ocMini, marginTop: 10 }}>Opcional: también se pueden agregar después desde el detalle de la gestión.</div>}
          {prevs.length > 0 && (
            <table style={{ marginTop: 10 }}>
              <thead><tr><th>Año</th><th>Fuente</th><th>N° preventivo</th><th style={{ textAlign: "right" }}>Monto $</th><th></th></tr></thead>
              <tbody>
                {prevs.map((p) => {
                  const setP = (campo, v) => setPrevs((ps) => ps.map((x) => (x.key === p.key ? { ...x, [campo]: v } : x)));
                  return (
                    <tr key={p.key}>
                      <td><input value={p.anio} onChange={(e) => setP("anio", e.target.value.replace(/\D/g, ""))} style={{ ...inputStyle, width: 80 }} /></td>
                      <td><input value={p.fuente} onChange={(e) => setP("fuente", e.target.value)} style={{ ...inputStyle, width: 80 }} /></td>
                      <td><input value={p.numero} onChange={(e) => setP("numero", e.target.value)} style={inputStyle} /></td>
                      <td><input value={p.monto} onChange={(e) => setP("monto", e.target.value)} placeholder="0,00" style={ocNumInput} /></td>
                      <td><button onClick={() => setPrevs((ps) => ps.filter((x) => x.key !== p.key))} style={ocBtnX}>×</button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      )}

      <div style={ocCard}>
        <Campo label="Observaciones"><textarea value={c.observaciones} onChange={(e) => set("observaciones", e.target.value)} rows={2} style={{ ...inputStyle, fontFamily: "Inter, sans-serif" }} /></Campo>
      </div>

      {aviso && (() => { const ok = aviso.startsWith("Se copiaron") || aviso.startsWith("Se precargaron"); return <div style={{ background: ok ? "#EEF3EC" : "#FBEBE7", color: ok ? "#4A7856" : "#9C3F2E", padding: "10px 14px", borderRadius: 8, fontSize: 13, marginBottom: 12 }}>{aviso}</div>; })()}
      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
        <button onClick={onCancelar} style={ocBtn2}>Cancelar</button>
        <button onClick={guardar} disabled={guardando} style={ocBtn}>{guardando ? "Guardando…" : "Guardar gestión"}</button>
      </div>
    </>
  );
}

// =================================================================
// OTRAS CONTRATACIONES — carga / edición de factura (devengado)
// =================================================================
function OCFacturaForm({ gestion, resumen, tcs, factura, onListo, onCancelar }) {
  const esUSD = gestion.moneda === "USD";
  const items = resumen.items;
  const [f, setF] = useState(() => ({
    numero_factura: factura?.numero_factura || "", fecha_factura: factura?.fecha_factura || "",
    tc: aInput(factura?.tc), fecha_tc: factura?.fecha_tc || "", tcManual: !!factura,
    numero_ee: factura?.numero_ee || "", numero_devengado: factura?.numero_devengado || "", fecha_pago: factura?.fecha_pago || "",
    observaciones: factura?.observaciones || "",
  }));
  const [lineas, setLineas] = useState(() => factura ? factura.lineas.map((l) => ({
    key: ocKey(), item_id: String(l.item_id), mes_desde: l.mes_desde ? String(l.mes_desde) : "", mes_hasta: l.mes_hasta ? String(l.mes_hasta) : "",
    hito_id: l.hito_id ? String(l.hito_id) : "", cantidad: aInput(l.cantidad), monto: aInput(l.monto_moneda), manual: true,
  })) : []);
  const prevOpciones = resumen.preventivos.map((p) => {
    const propio = factura ? factura.imputaciones.filter((i) => i.preventivo_id === p.id).reduce((s, i) => s + Number(i.monto_pesos || 0), 0) : 0;
    return { ...p, saldoDisp: round2(p.saldo + propio) };
  });
  const [imps, setImps] = useState(() => {
    if (factura) return factura.imputaciones.map((i) => ({ key: ocKey(), preventivo_id: String(i.preventivo_id), monto: aInput(i.monto_pesos), manual: true }));
    if (!prevOpciones.length) return [];
    const anio = new Date().getFullYear();
    const mejor = prevOpciones.find((p) => p.anio === anio && p.saldoDisp > 0) || prevOpciones.find((p) => p.saldoDisp > 0) || prevOpciones[prevOpciones.length - 1];
    return [{ key: ocKey(), preventivo_id: String(mejor.id), monto: "", manual: false }];
  });
  const [aviso, setAviso] = useState("");
  const [guardando, setGuardando] = useState(false);
  const setCampo = (k, v) => setF((x) => ({ ...x, [k]: v }));

  useEffect(() => {
    if (!esUSD || f.tcManual || !f.fecha_factura) return;
    const t = ocBuscarTC(tcs, f.fecha_factura, gestion.regla_tc);
    setF((x) => ({ ...x, tc: t ? aInput(t.vendedor) : "", fecha_tc: t ? t.fecha : "" }));
  }, [f.fecha_factura, f.tcManual]);

  const itemDe = (l) => items.find((i) => String(i.id) === l.item_id);
  const lineasOtras = (it) => it.lineas.filter((l) => !factura || l.factura_id !== factura.id);
  const mesesUsados = (it, ls, exceptoKey) => {
    const s = new Set();
    lineasOtras(it).forEach((l) => { if (l.mes_desde) for (let m = l.mes_desde; m <= (l.mes_hasta || l.mes_desde); m++) s.add(m); });
    ls.filter((l) => l.key !== exceptoKey && l.item_id === String(it.id)).forEach((l) => {
      const d = parseInt(l.mes_desde, 10), h = parseInt(l.mes_hasta, 10) || d;
      if (d) for (let m = d; m <= h; m++) s.add(m);
    });
    return s;
  };
  const hitosUsados = (it, ls, exceptoKey) => {
    const s = new Set(lineasOtras(it).map((l) => l.hito_id).filter(Boolean));
    ls.filter((l) => l.key !== exceptoKey && l.item_id === String(it.id) && l.hito_id).forEach((l) => s.add(Number(l.hito_id)));
    return s;
  };
  const lineaDefault = (it, ls, key) => {
    const base = { key: key || ocKey(), item_id: String(it.id), mes_desde: "", mes_hasta: "", hito_id: "", cantidad: "", monto: "", manual: false };
    if (it.modalidad === "mensual") {
      const usados = mesesUsados(it, ls, key);
      const meses = it.periodos.length;
      let m = 1;
      while (m <= meses && usados.has(m)) m++;
      if (m > meses) m = Math.max(1, meses);
      base.mes_desde = base.mes_hasta = String(m);
    }
    if (it.modalidad === "hitos") {
      const usados = hitosUsados(it, ls, key);
      const h = it.hitos.find((x) => !usados.has(x.id)) || it.hitos[0];
      base.hito_id = h ? String(h.id) : "";
    }
    return base;
  };
  const agregarLinea = () => {
    const it = items.find((i) => i.saldo > 0.01) || items[0];
    if (!it) return;
    setLineas((ls) => [...ls, lineaDefault(it, ls)]);
  };
  const setLinea = (key, patch) => setLineas((ls) => ls.map((l) => (l.key === key ? { ...l, ...patch } : l)));
  const cambiarItemLinea = (l, itemId) => {
    const it = items.find((i) => String(i.id) === itemId);
    setLineas((ls) => ls.map((x) => (x.key === l.key ? lineaDefault(it, ls, l.key) : x)));
  };
  const montoAuto = (l) => {
    const it = itemDe(l);
    if (!it) return 0;
    if (it.modalidad === "mensual") {
      const d = parseInt(l.mes_desde, 10) || 0, h = parseInt(l.mes_hasta, 10) || d;
      let s = 0;
      for (let m = d; m <= h && d > 0; m++) { const p = it.periodos[m - 1]; if (p) s += p.monto; }
      return round2(s);
    }
    if (it.modalidad === "cantidad") return round2(ocNum(l.cantidad) * Number(it.precio_unitario || 0));
    const hi = it.hitos.find((x) => String(x.id) === l.hito_id);
    return hi ? round2(Number(hi.monto || 0)) : 0;
  };
  const montoLinea = (l) => (l.manual ? round2(ocNum(l.monto)) : montoAuto(l));
  const avisoLinea = (l) => {
    const it = itemDe(l);
    if (!it) return "";
    if (it.modalidad === "mensual") {
      if (it.avance.sinInicio) return "Este ítem es proporcional y la gestión no tiene fecha de inicio: cargala con \"Editar\" para poder facturarlo.";
      const d = parseInt(l.mes_desde, 10), h = parseInt(l.mes_hasta, 10) || d;
      const meses = it.periodos.length;
      if (!d || h < d) return "Revisá los períodos.";
      if (h > meses) return `El ítem tiene ${meses} ${it.proporcional ? "períodos" : "meses"}.`;
      const otrosMeses = new Set();
      lineasOtras(it).forEach((x) => { if (x.mes_desde) for (let m = x.mes_desde; m <= (x.mes_hasta || x.mes_desde); m++) otrosMeses.add(m); });
      const rep = [];
      for (let m = d; m <= h; m++) if (otrosMeses.has(m)) rep.push(m);
      if (rep.length) return `Ojo: ${rep.length === 1 ? "el mes" : "los meses"} ${ocRangos(rep)} ya ${rep.length === 1 ? "tiene" : "tienen"} factura.`;
    }
    if (it.modalidad === "cantidad") {
      const otras = lineasOtras(it).reduce((s, x) => s + Number(x.cantidad || 0), 0);
      const pend = Number(it.cantidad || 0) - otras;
      if (ocNum(l.cantidad) > pend + 0.0001) return `Supera lo pendiente (${fmtCant(pend)} ${it.unidad || ""}).`;
    }
    if (it.modalidad === "hitos" && l.hito_id && lineasOtras(it).some((x) => String(x.hito_id) === l.hito_id)) return "Ojo: este hito ya tiene factura.";
    if (l.manual && Math.abs(round2(ocNum(l.monto)) - montoAuto(l)) > 0.01) return `Monto modificado a mano (el calculado es ${fmtMon(montoAuto(l), gestion.moneda)}).`;
    return "";
  };

  // Tope: lo ya devengado en otras facturas + lo de esta factura no puede superar el total del ítem
  const excesos = items.map((it) => {
    const otras = round2(lineasOtras(it).reduce((s, x) => s + Number(x.monto_moneda || 0), 0));
    const esta = round2(lineas.filter((l) => l.item_id === String(it.id)).reduce((s, l) => s + montoLinea(l), 0));
    const disponible = round2(it.total - otras);
    return { it, esta, disponible, exceso: round2(esta - disponible) };
  }).filter((x) => x.esta > 0 && x.exceso > 0.01);
  const totalMoneda = round2(lineas.reduce((s, l) => s + montoLinea(l), 0));
  const tcNum = ocNum(f.tc);
  const totalPesos = esUSD ? round2(totalMoneda * tcNum) : totalMoneda;
  const impsCalc = (() => {
    let restante = round2(totalPesos - imps.filter((i) => i.manual).reduce((s, i) => s + round2(ocNum(i.monto)), 0));
    let usado = false;
    return imps.map((i) => {
      if (i.manual) return round2(ocNum(i.monto));
      if (!usado) { usado = true; return Math.max(0, restante); }
      return 0;
    });
  })();
  const sumImp = round2(impsCalc.reduce((s, v) => s + v, 0));
  const dif = round2(totalPesos - sumImp);
  const tcEsperado = (() => {
    if (!f.fecha_factura) return "";
    const d = parseDateLocal(f.fecha_factura);
    return gestion.regla_tc === "dia_factura" ? isoLocal(d) : isoLocal(addDays(d, -1));
  })();

  const guardar = async () => {
    setAviso("");
    if (!f.numero_factura.trim() || !f.fecha_factura) { setAviso("Completá número y fecha de la factura."); return; }
    if (lineas.length === 0) { setAviso("Agregá al menos un ítem facturado."); return; }
    if (esUSD && !(tcNum > 0)) { setAviso("Falta el tipo de cambio."); return; }
    for (const l of lineas) {
      const it = itemDe(l);
      if (!it) { setAviso("Hay una línea sin ítem."); return; }
      if (it.modalidad === "mensual" && it.avance.sinInicio) { setAviso(`"${it.descripcion}" es proporcional y falta la fecha de inicio de la gestión.`); return; }
      if (it.modalidad === "mensual" && !(parseInt(l.mes_desde, 10) >= 1 && (parseInt(l.mes_hasta, 10) || 0) >= parseInt(l.mes_desde, 10) && parseInt(l.mes_hasta, 10) <= it.periodos.length)) { setAviso(`Revisá los períodos de "${it.descripcion}".`); return; }
      if (it.modalidad === "cantidad" && !(ocNum(l.cantidad) > 0)) { setAviso(`Falta la cantidad de "${it.descripcion}".`); return; }
      if (it.modalidad === "hitos" && !l.hito_id) { setAviso(`Elegí el hito de "${it.descripcion}".`); return; }
    }
    if (excesos.length) { const x = excesos[0]; setAviso(`No se puede superar el total adjudicado de "${x.it.descripcion}": saldo disponible ${fmtMon(x.disponible, gestion.moneda)}, esta factura lo excede en ${fmtMon(x.exceso, gestion.moneda)}.`); return; }
    if (imps.length && Math.abs(dif) > 0.01) { setAviso(`La imputación (${fmtMoney(sumImp)}) no coincide con el total en pesos (${fmtMoney(totalPesos)}).`); return; }
    setGuardando(true);
    try {
      const txt = (v) => (v.trim() ? v.trim() : null);
      const fila = {
        gestion_id: gestion.id, numero_factura: f.numero_factura.trim(), fecha_factura: f.fecha_factura,
        tc: esUSD ? tcNum : null, fecha_tc: esUSD ? (f.fecha_tc || null) : null,
        numero_ee: txt(f.numero_ee), numero_devengado: txt(f.numero_devengado), fecha_pago: f.fecha_pago || null, observaciones: txt(f.observaciones),
      };
      let fid;
      if (factura) {
        const { error } = await db.from("oc_facturas").update(fila).eq("id", factura.id);
        if (error) throw error;
        fid = factura.id;
        const r1 = await db.from("oc_factura_lineas").delete().eq("factura_id", fid); if (r1.error) throw r1.error;
        const r2 = await db.from("oc_imputaciones").delete().eq("factura_id", fid); if (r2.error) throw r2.error;
      } else {
        const { data: nueva, error } = await db.from("oc_facturas").insert(fila).select().single();
        if (error) throw error;
        fid = nueva.id;
      }
      const filasL = lineas.map((l) => {
        const it = itemDe(l);
        return {
          factura_id: fid, item_id: it.id,
          mes_desde: it.modalidad === "mensual" ? parseInt(l.mes_desde, 10) : null,
          mes_hasta: it.modalidad === "mensual" ? (parseInt(l.mes_hasta, 10) || parseInt(l.mes_desde, 10)) : null,
          hito_id: it.modalidad === "hitos" ? Number(l.hito_id) : null,
          cantidad: it.modalidad === "cantidad" ? ocNum(l.cantidad) : null,
          monto_moneda: montoLinea(l),
        };
      });
      const { error: el } = await db.from("oc_factura_lineas").insert(filasL);
      if (el) throw el;
      const filasI = imps.map((i, n) => ({ factura_id: fid, preventivo_id: Number(i.preventivo_id), monto_pesos: impsCalc[n] })).filter((x) => x.monto_pesos > 0);
      if (filasI.length) {
        const { error: ei } = await db.from("oc_imputaciones").insert(filasI);
        if (ei) throw ei;
      }
      await onListo();
    } catch (e) {
      setAviso("Error al guardar: " + (e.message || e));
      setGuardando(false);
    }
  };

  return (
    <div style={{ ...ocCard, border: "2px solid #1B2A4A" }}>
      <div style={ocH2}>{factura ? "Editar factura" : "Cargar factura"}</div>
      <div style={ocGrid}>
        <Campo label="N° de factura"><input value={f.numero_factura} onChange={(e) => setCampo("numero_factura", e.target.value)} style={inputStyle} /></Campo>
        <Campo label="Fecha de factura"><input type="date" value={f.fecha_factura} onChange={(e) => setCampo("fecha_factura", e.target.value)} style={inputStyle} /></Campo>
        {esUSD && (
          <Campo label="TC vendedor BNA">
            <input value={f.tc} onChange={(e) => setF((x) => ({ ...x, tc: e.target.value, tcManual: true }))} style={ocNumInput} />
          </Campo>
        )}
        {esUSD && (
          <Campo label="Fecha del TC">
            <input type="date" value={f.fecha_tc} onChange={(e) => setF((x) => ({ ...x, fecha_tc: e.target.value, tcManual: true }))} style={inputStyle} />
          </Campo>
        )}
      </div>
      {esUSD && f.fecha_factura && (
        <div style={{ ...ocMini, marginTop: 6 }}>
          Regla: {OC_REGLAS_TC[gestion.regla_tc]}.{" "}
          {!f.tc && !f.tcManual && <span style={{ color: "#9C3F2E" }}>No hay TC cargado para esa fecha: cargalo en "Tipo de cambio BNA" o escribilo a mano. </span>}
          {f.fecha_tc && f.fecha_tc !== tcEsperado && !f.tcManual && <span style={{ color: "#9A6B1E" }}>No hay valor del {fmtDate(tcEsperado)}; se tomó el último anterior ({fmtDate(f.fecha_tc)}). </span>}
          {f.tcManual && <button onClick={() => setCampo("tcManual", false)} style={{ ...ocBtnX, fontSize: 11.5, color: "#1B2A4A", textDecoration: "underline" }}>Buscar en la tabla de TC</button>}
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 600 }}>Qué cubre la factura</div>
        <button onClick={agregarLinea} style={ocBtn2}>+ Ítem facturado</button>
      </div>
      {lineas.length === 0 && <div style={{ ...ocMini, marginTop: 8 }}>Agregá cada ítem que incluye la factura (una factura puede cubrir varios ítems).</div>}
      {lineas.map((l) => {
        const it = itemDe(l);
        const av = avisoLinea(l);
        return (
          <div key={l.key} style={{ border: "1px solid #E4E1D8", borderRadius: 8, padding: 10, marginTop: 8 }}>
            <div style={{ display: "grid", gridTemplateColumns: "minmax(180px, 2fr) minmax(200px, 2fr) minmax(140px, 1fr) 28px", gap: 8, alignItems: "end" }}>
              <Campo label="Ítem">
                <select value={l.item_id} onChange={(e) => cambiarItemLinea(l, e.target.value)} style={inputStyle}>
                  {items.map((i) => <option key={i.id} value={String(i.id)}>{[i.renglon && `R ${i.renglon}`, i.item && `Í ${i.item}`, i.descripcion].filter(Boolean).join(" · ")}</option>)}
                </select>
              </Campo>
              {it?.modalidad === "mensual" && (
                <div style={{ display: "flex", gap: 6 }}>
                  <Campo label={it.proporcional ? "Período desde" : "Mes desde"}><input value={l.mes_desde} onChange={(e) => setLinea(l.key, { mes_desde: e.target.value.replace(/\D/g, ""), mes_hasta: (parseInt(l.mes_hasta, 10) || 0) < (parseInt(e.target.value, 10) || 0) ? e.target.value.replace(/\D/g, "") : l.mes_hasta })} style={{ ...inputStyle, width: 70 }} /></Campo>
                  <Campo label={it.proporcional ? "Período hasta" : "Mes hasta"}><input value={l.mes_hasta} onChange={(e) => setLinea(l.key, { mes_hasta: e.target.value.replace(/\D/g, "") })} style={{ ...inputStyle, width: 70 }} /></Campo>
                </div>
              )}
              {it?.modalidad === "cantidad" && (
                <Campo label={`Cantidad (${it.unidad || "unidades"})`}><input value={l.cantidad} onChange={(e) => setLinea(l.key, { cantidad: e.target.value })} style={ocNumInput} /></Campo>
              )}
              {it?.modalidad === "hitos" && (
                <Campo label="Hito">
                  <select value={l.hito_id} onChange={(e) => setLinea(l.key, { hito_id: e.target.value })} style={inputStyle}>
                    {it.hitos.map((h) => <option key={h.id} value={String(h.id)}>{h.numero}. {h.descripcion || "Hito"} ({fmtNum(h.porcentaje)}%)</option>)}
                  </select>
                </Campo>
              )}
              <Campo label={`Monto ${esUSD ? "USD" : "$"}`}>
                <div style={{ display: "flex", gap: 4 }}>
                  <input value={l.manual ? l.monto : aInput(montoAuto(l))} onChange={(e) => setLinea(l.key, { monto: e.target.value, manual: true })} style={ocNumInput} />
                  {l.manual && <button title="Volver al monto calculado" onClick={() => setLinea(l.key, { manual: false })} style={ocBtnX}>↺</button>}
                </div>
              </Campo>
              <button onClick={() => setLineas((ls) => ls.filter((x) => x.key !== l.key))} style={{ ...ocBtnX, paddingBottom: 8 }}>×</button>
            </div>
            {it?.modalidad === "mensual" && (() => {
              const pd = it.periodos[(parseInt(l.mes_desde, 10) || 0) - 1];
              const ph = it.periodos[(parseInt(l.mes_hasta, 10) || parseInt(l.mes_desde, 10) || 0) - 1];
              if (!pd || !ph || !pd.desde) return null;
              const rango = [];
              for (let n = pd.n; n <= ph.n; n++) rango.push(it.periodos[n - 1]);
              return (
                <div style={{ ...ocMini, marginTop: 4 }}>
                  Período: {fmtDate(pd.desde)} al {fmtDate(ph.hasta)}
                  {it.proporcional && rango.filter((p) => !p.completo).map((p) => <div key={p.n}>Per. {p.n}: {ocDetallePeriodo(p, gestion.moneda)} = {fmtMon(p.monto, gestion.moneda)}</div>)}
                </div>
              );
            })()}
            {av && <div style={{ fontSize: 11.5, color: "#9A6B1E", marginTop: 4 }}>{av}</div>}
          </div>
        );
      })}

      {excesos.map((x) => (
        <div key={x.it.id} style={{ fontSize: 12.5, color: "#9C3F2E", background: "#FBEBE7", padding: "8px 12px", borderRadius: 7, marginTop: 8 }}>
          "{x.it.descripcion}": esta factura suma {fmtMon(x.esta, gestion.moneda)} y el saldo adjudicado disponible es {fmtMon(x.disponible, gestion.moneda)}. Excede en {fmtMon(x.exceso, gestion.moneda)}.
        </div>
      ))}
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 20, marginTop: 12, fontSize: 13.5, flexWrap: "wrap" }}>
        {esUSD && <span>Total USD: <b>{fmtNum(totalMoneda)}</b></span>}
        <span>Total en $: <b>{fmtMoney(totalPesos)}</b></span>
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 16 }}>
        <div style={{ fontSize: 13, fontWeight: 600 }}>Imputación a preventivos</div>
        {prevOpciones.length > 0 && <button onClick={() => setImps((xs) => [...xs, { key: ocKey(), preventivo_id: String(prevOpciones[0].id), monto: "", manual: false }])} style={ocBtn2}>+ Otra fuente / preventivo</button>}
      </div>
      {prevOpciones.length === 0 && <div style={{ fontSize: 12, color: "#9A6B1E", marginTop: 6 }}>La gestión no tiene preventivos cargados: la factura se guarda sin imputar. Podés agregar preventivos en el detalle y editar la factura después.</div>}
      {imps.map((i, n) => {
        const p = prevOpciones.find((x) => String(x.id) === i.preventivo_id);
        const excede = p && impsCalc[n] > p.saldoDisp + 0.01;
        return (
          <div key={i.key} style={{ display: "grid", gridTemplateColumns: "minmax(220px, 2fr) minmax(140px, 1fr) 28px", gap: 8, alignItems: "end", marginTop: 8 }}>
            <Campo label="Preventivo">
              <select value={i.preventivo_id} onChange={(e) => setImps((xs) => xs.map((x) => (x.key === i.key ? { ...x, preventivo_id: e.target.value } : x)))} style={inputStyle}>
                {prevOpciones.map((p2) => <option key={p2.id} value={String(p2.id)}>{p2.anio} · Fte. {p2.fuente || "—"} · N° {p2.numero || "—"} · saldo {fmtMoney(p2.saldoDisp)}</option>)}
              </select>
            </Campo>
            <Campo label="Monto $">
              <input value={i.manual ? i.monto : aInput(impsCalc[n])} onChange={(e) => setImps((xs) => xs.map((x) => (x.key === i.key ? { ...x, monto: e.target.value, manual: true } : x)))} style={{ ...ocNumInput, borderColor: excede ? "#E4B8AF" : "#E4E1D8" }} />
            </Campo>
            <button onClick={() => setImps((xs) => xs.filter((x) => x.key !== i.key))} style={{ ...ocBtnX, paddingBottom: 8 }}>×</button>
            {excede && <div style={{ gridColumn: "1 / -1", fontSize: 11.5, color: "#9C3F2E" }}>Supera el saldo del preventivo ({fmtMoney(p.saldoDisp)}).</div>}
          </div>
        );
      })}
      {imps.length > 0 && Math.abs(dif) > 0.01 && <div style={{ fontSize: 12, color: "#9C3F2E", marginTop: 6 }}>{dif > 0 ? `Falta imputar ${fmtMoney(dif)}` : `Imputaste ${fmtMoney(-dif)} de más`}</div>}

      <div style={{ ...ocGrid, marginTop: 16 }}>
        <Campo label="N° EE"><input value={f.numero_ee} onChange={(e) => setCampo("numero_ee", e.target.value)} style={inputStyle} /></Campo>
        <Campo label="N° devengado"><input value={f.numero_devengado} onChange={(e) => setCampo("numero_devengado", e.target.value)} style={inputStyle} /></Campo>
        <Campo label="Fecha de pago"><input type="date" value={f.fecha_pago} onChange={(e) => setCampo("fecha_pago", e.target.value)} style={inputStyle} /></Campo>
        <Campo label="Observaciones"><input value={f.observaciones} onChange={(e) => setCampo("observaciones", e.target.value)} style={inputStyle} /></Campo>
      </div>

      {aviso && <div style={{ background: "#FBEBE7", color: "#9C3F2E", padding: "10px 14px", borderRadius: 8, fontSize: 13, marginTop: 12 }}>{aviso}</div>}
      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 14 }}>
        <button onClick={onCancelar} style={ocBtn2}>Cancelar</button>
        <button onClick={guardar} disabled={guardando} style={ocBtn}>{guardando ? "Guardando…" : "Guardar factura"}</button>
      </div>
    </div>
  );
}

// =================================================================
// OTRAS CONTRATACIONES — detalle de gestión
// =================================================================
function OCDetalleView({ resumen: r, data, jurisdicciones, dependencias, onVolver, onEditar, onAbrirOtra, onCambio }) {
  const g = r.g;
  const esUSD = g.moneda === "USD";
  const [facturaForm, setFacturaForm] = useState(null); // null | "nueva" | factura
  const [nuevoPrev, setNuevoPrev] = useState({ anio: String(new Date().getFullYear()), fuente: "111", numero: "", monto: "" });
  const [docTipo, setDocTipo] = useState("norma");
  const [subiendo, setSubiendo] = useState(false);
  const [abierta, setAbierta] = useState(null);
  const [periodosAbiertos, setPeriodosAbiertos] = useState({});
  const dep = dependencias.find((d) => d.id === g.dependencia_id);
  const jur = jurisdicciones.find((j) => j.codigo === g.jurisdiccion_codigo);

  // Historia encadenada
  const anteriores = [];
  let cur = g;
  const vistos = new Set([g.id]);
  while (cur && cur.gestion_anterior_id && !vistos.has(cur.gestion_anterior_id)) {
    const ant = data.gestiones.find((x) => x.id === cur.gestion_anterior_id);
    if (!ant) break;
    anteriores.push(ant); vistos.add(ant.id); cur = ant;
  }
  const posteriores = data.gestiones.filter((x) => x.gestion_anterior_id === g.id);

  const agregarPrev = async () => {
    if (!(ocNum(nuevoPrev.monto) > 0)) { alert("Cargá el monto del preventivo."); return; }
    const { error } = await db.from("oc_preventivos").insert({
      gestion_id: g.id, anio: nuevoPrev.anio ? parseInt(nuevoPrev.anio, 10) : null, fuente: nuevoPrev.fuente.trim() || null,
      numero: nuevoPrev.numero.trim() || null, monto: round2(ocNum(nuevoPrev.monto)),
    });
    if (error) { alert("Error: " + error.message); return; }
    setNuevoPrev({ ...nuevoPrev, numero: "", monto: "" });
    onCambio();
  };
  const eliminarPrev = async (p) => {
    if (p.devengado > 0) { alert("Este preventivo ya tiene facturas imputadas: primero cambiá la imputación de esas facturas."); return; }
    if (!confirm(`¿Eliminar el preventivo ${p.numero || ""} (${p.anio})?`)) return;
    const { error } = await db.from("oc_preventivos").delete().eq("id", p.id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };
  const eliminarFactura = async (fa) => {
    if (!confirm(`¿Eliminar la factura ${fa.numero_factura}? Se borran también sus ítems e imputaciones.`)) return;
    const { error } = await db.from("oc_facturas").delete().eq("id", fa.id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };
  const verDoc = async (d) => {
    const w = window.open("", "_blank");
    const { data: s, error } = await db.storage.from("documentos").createSignedUrl(d.ruta, 300);
    if (error) { if (w) w.close(); alert("No se pudo abrir el archivo: " + error.message); return; }
    if (w) w.location = s.signedUrl; else window.location.href = s.signedUrl;
  };
  const eliminarDoc = async (d) => {
    if (!confirm(`¿Eliminar el documento "${d.nombre}"?`)) return;
    await db.storage.from("documentos").remove([d.ruta]);
    const { error } = await db.from("oc_documentos").delete().eq("id", d.id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };
  const subirDoc = async (file) => {
    setSubiendo(true);
    try { await ocSubirDocumento(g.id, file, docTipo); await onCambio(); }
    catch (e) { alert("Error al subir: " + (e.message || e)); }
    finally { setSubiendo(false); }
  };
  const eliminarGestion = async () => {
    if (!confirm(`¿Eliminar la gestión "${g.objeto || g.numero_interno || ""}" con todos sus ítems, facturas, preventivos y documentos? No se puede deshacer.`)) return;
    try {
      if (r.documentos.length) await db.storage.from("documentos").remove(r.documentos.map((d) => d.ruta));
      const facIds = r.facturas.map((f) => f.id);
      if (facIds.length) { const { error } = await db.from("oc_imputaciones").delete().in("factura_id", facIds); if (error) throw error; }
      const { error } = await db.from("oc_gestiones").delete().eq("id", g.id);
      if (error) throw error;
      onVolver();
      onCambio();
    } catch (e) { alert("Error al eliminar: " + (e.message || e)); }
  };

  const nombreItem = (id) => {
    const it = r.items.find((i) => i.id === id);
    return it ? [it.renglon && `R ${it.renglon}`, it.item && `Í ${it.item}`, it.descripcion].filter(Boolean).join(" · ") : "—";
  };
  const describirLinea = (l) => {
    const it = r.items.find((i) => i.id === l.item_id);
    if (!it) return "—";
    const pal = it.proporcional ? ["per.", "per."] : ["mes", "meses"];
    if (it.modalidad === "mensual") return l.mes_hasta && l.mes_hasta !== l.mes_desde ? `${pal[1]} ${l.mes_desde}–${l.mes_hasta}` : `${pal[0]} ${l.mes_desde}`;
    if (it.modalidad === "cantidad") return `${fmtCant(l.cantidad)} ${it.unidad || ""}`;
    const h = it.hitos.find((x) => x.id === l.hito_id);
    return h ? `hito ${h.numero}` : "hito";
  };
  const detallePendiente = (it) => {
    if (it.modalidad === "mensual") {
      if (it.avance.sinInicio) return "Falta la fecha de inicio para armar los períodos proporcionales";
      const pal = it.proporcional ? "períodos" : "meses";
      return it.avance.pendientes.length ? `Sin devengar: ${pal} ${ocRangos(it.avance.pendientes)}` : `Todos los ${pal} devengados`;
    }
    if (it.modalidad === "cantidad") return it.avance.pendienteCant > 0 ? `Pendiente: ${fmtCant(it.avance.pendienteCant)} ${it.unidad || ""}` : "Cantidad completa";
    return it.avance.pendientesHitos.length ? `Pendientes: ${it.avance.pendientesHitos.map((h) => h.descripcion || `hito ${h.numero}`).join(", ")}` : "Todos los hitos devengados";
  };

  return (
    <>
      <button onClick={onVolver} style={{ ...ocBtn2, marginBottom: 14 }}>← Volver a gestiones</button>

      <div style={ocCard}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, flexWrap: "wrap" }}>
          <div>
            <h1 className="serif" style={{ fontSize: 22, margin: 0, fontWeight: 600 }}>{g.objeto || "Gestión sin objeto"}</h1>
            <div style={{ fontSize: 13, color: "#8A8578", marginTop: 4 }}>
              {[g.proveedor, g.cuit && `CUIT ${g.cuit}`, g.norma_legal, g.expediente && `Exp. ${g.expediente}`].filter(Boolean).join(" · ")}
            </div>
            <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
              <Badge tone={r.estado.tone}>{r.estado.label}</Badge>
              <Badge tone="navy">{esUSD ? `USD · ${g.regla_tc === "dia_factura" ? "TC día de la factura" : "TC día anterior"}` : "Pesos"}</Badge>
              {g.rubro && <Badge tone="navy">{g.rubro}</Badge>}
              {g.tipo_contratacion && <Badge tone="navy">{g.tipo_contratacion}</Badge>}
              {g.estado_tramite && <Badge tone="navy">Trámite: {g.estado_tramite}</Badge>}
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={onEditar} style={ocBtn2}>✎ Editar</button>
            <button onClick={eliminarGestion} style={{ ...ocBtn2, color: "#9C3F2E" }}>Eliminar</button>
          </div>
        </div>
        <div style={{ ...ocGrid, marginTop: 16 }}>
          <Dato label="N° interno" value={g.numero_interno} />
          <Dato label="Jurisdicción" value={g.jurisdiccion_codigo != null ? `${g.jurisdiccion_codigo}${jur ? " — " + jur.nombre : ""}` : ""} />
          <Dato label="Dependencia" value={dep?.nombre} />
          <Dato label="Inicio" value={g.fecha_inicio ? fmtDate(g.fecha_inicio) : "A definir"} />
          <Dato label="Plazo" value={g.plazo_meses ? `${g.plazo_meses} meses` : ""} />
          <Dato label="Finaliza" value={r.fin ? fmtDate(r.fin) : ""} />
          {g.monto_norma != null && <Dato label="Monto de la norma" value={fmtMon(g.monto_norma, g.moneda)} />}
        </div>
        {g.monto_norma != null && Math.abs(Number(g.monto_norma) - r.adjudicado) > 0.01 && (
          <div style={{ fontSize: 12.5, color: "#9C3F2E", marginTop: 10 }}>La suma de los ítems ({fmtMon(r.adjudicado, g.moneda)}) no coincide con el monto de la norma.</div>
        )}
        {g.observaciones && <div style={{ fontSize: 13, marginTop: 12, color: "#5C5848" }}>{g.observaciones}</div>}

        <div style={{ borderTop: "1px solid #EDEBE3", marginTop: 14, paddingTop: 12 }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: "#8A8578", textTransform: "uppercase", marginBottom: 6 }}>Documentos</div>
          {r.documentos.length === 0 && <div style={{ fontSize: 12.5, color: "#8A8578" }}>Sin documentos adjuntos.</div>}
          {r.documentos.map((d) => (
            <div key={d.id} style={{ fontSize: 13, display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
              <span style={{ color: "#8A8578", minWidth: 90 }}>{OC_TIPOS_DOC[d.tipo] || d.tipo}</span>
              <button onClick={() => verDoc(d)} style={{ border: "none", background: "none", color: "#1B2A4A", textDecoration: "underline", cursor: "pointer", fontSize: 13, padding: 0 }}>{d.nombre}</button>
              <button onClick={() => eliminarDoc(d)} style={ocBtnX}>×</button>
            </div>
          ))}
          <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8 }}>
            <select value={docTipo} onChange={(e) => setDocTipo(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
              {Object.entries(OC_TIPOS_DOC).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
            </select>
            <label style={ocBtn2}>
              {subiendo ? "Subiendo…" : "📎 Adjuntar PDF"}
              <input type="file" accept="application/pdf" style={{ display: "none" }} disabled={subiendo} onChange={(e) => { const f = e.target.files[0]; if (f) subirDoc(f); e.target.value = ""; }} />
            </label>
          </div>
        </div>

        {(anteriores.length > 0 || posteriores.length > 0) && (
          <div style={{ borderTop: "1px solid #EDEBE3", marginTop: 14, paddingTop: 12 }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: "#8A8578", textTransform: "uppercase", marginBottom: 6 }}>Historia</div>
            {[...anteriores].reverse().map((a) => (
              <div key={a.id} style={{ fontSize: 13, marginBottom: 3 }}>
                ↑ Anterior: <button onClick={() => onAbrirOtra(a.id)} style={{ border: "none", background: "none", color: "#1B2A4A", textDecoration: "underline", cursor: "pointer", fontSize: 13, padding: 0 }}>{[a.numero_interno, a.objeto, a.proveedor, a.norma_legal].filter(Boolean).join(" · ")}</button>
              </div>
            ))}
            <div style={{ fontSize: 13, marginBottom: 3, fontWeight: 600 }}>● Esta gestión</div>
            {posteriores.map((p) => (
              <div key={p.id} style={{ fontSize: 13, marginBottom: 3 }}>
                ↓ Continúa en: <button onClick={() => onAbrirOtra(p.id)} style={{ border: "none", background: "none", color: "#1B2A4A", textDecoration: "underline", cursor: "pointer", fontSize: 13, padding: 0 }}>{[p.numero_interno, p.objeto, p.proveedor, p.norma_legal].filter(Boolean).join(" · ")}</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 12, marginBottom: 16 }}>
        {ocMetrica("Adjudicado", fmtMon(r.adjudicado, g.moneda), Math.abs(r.adjudicado - r.contratado) > 0.01 ? `A pagar con proporcional: ${fmtMon(r.contratado, g.moneda)}` : null)}
        {ocMetrica("Devengado", fmtMon(r.devengado, g.moneda), `${Math.round(r.pct * 100)}% ejecutado${esUSD ? ` · ${fmtMoney(r.devengadoPesos)}` : ""}`)}
        {ocMetrica("Saldo a devengar", fmtMon(r.saldo, g.moneda),
          esUSD ? (r.pendientePesosEst !== null ? `≈ ${fmtMoney(r.pendientePesosEst)} al TC ${fmtNum(r.ultimoTC.vendedor)} (${fmtDate(r.ultimoTC.fecha)})` : "Sin TC cargado para estimar en $") : null)}
        {ocMetrica("Saldo preventivos", fmtMoney(r.saldoPreventivos), r.insuficiente ? "No alcanza para lo que falta devengar" : `de ${fmtMoney(r.totalPreventivos)}`, r.insuficiente)}
      </div>

      <div style={ocCard}>
        <div style={ocH2}>Renglones e ítems</div>
        {r.items.length === 0 ? <div style={{ fontSize: 13, color: "#8A8578" }}>Sin ítems. Agregalos desde "Editar".</div> : (
          <div style={{ overflowX: "auto" }}>
            <table>
              <thead><tr><th>Ítem</th><th>Modalidad</th><th style={{ textAlign: "right" }}>Contratado</th><th style={{ textAlign: "right" }}>Devengado</th><th style={{ minWidth: 200 }}>Avance</th></tr></thead>
              <tbody>
                {r.items.map((it) => [(
                  <tr key={it.id}>
                    <td>
                      <div style={{ fontWeight: 600 }}>{it.descripcion}</div>
                      <div style={ocMini}>{[it.renglon && `Renglón ${it.renglon}`, it.item && `Ítem ${it.item}`].filter(Boolean).join(" · ")}</div>
                    </td>
                    <td>
                      {OC_MODALIDADES[it.modalidad]}
                      {it.modalidad === "mensual" && <div style={ocMini}>{it.tramos.map((t) => `m${t.desde_mes}–${t.hasta_mes}: ${fmtMon(t.valor_mensual, g.moneda)}`).join(" · ")}</div>}
                      {it.modalidad === "mensual" && it.proporcional && <div style={{ ...ocMini, color: "#1B2A4A" }}>Proporcional por días reales</div>}
                      {it.modalidad === "mensual" && it.periodos.length > 0 && (
                        <button onClick={() => setPeriodosAbiertos((v) => ({ ...v, [it.id]: !v[it.id] }))} style={{ border: "none", background: "none", color: "#1B2A4A", textDecoration: "underline", cursor: "pointer", fontSize: 11.5, padding: 0, marginTop: 3 }}>
                          {periodosAbiertos[it.id] ? "Ocultar períodos" : "Ver períodos"}
                        </button>
                      )}
                      {it.modalidad === "cantidad" && <div style={ocMini}>{fmtCant(it.cantidad)} {it.unidad} × {fmtMon(it.precio_unitario, g.moneda)}</div>}
                    </td>
                    <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>{fmtMon(it.total, g.moneda)}</td>
                    <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>{fmtMon(it.devengado, g.moneda)}</td>
                    <td>
                      {ocBarra(it.pct)}
                      <div style={{ fontSize: 12, marginTop: 3 }}>{it.avance.texto}</div>
                      <div style={ocMini}>{detallePendiente(it)}</div>
                    </td>
                  </tr>
                )].concat(it.modalidad === "mensual" && periodosAbiertos[it.id] ? [(
                  <tr key={it.id + "-per"}><td colSpan={5} style={{ background: "#FBFAF7" }}>
                    <table>
                      <thead><tr><th>Per.</th><th>Período</th><th>Detalle</th><th style={{ textAlign: "right" }}>Monto</th><th>Estado</th></tr></thead>
                      <tbody>
                        {it.periodos.map((p) => {
                          const dev = !it.avance.pendientes.includes(p.n);
                          return (
                            <tr key={p.n}>
                              <td>{p.n}</td>
                              <td style={{ whiteSpace: "nowrap" }}>{p.desde ? `${fmtDate(p.desde)} al ${fmtDate(p.hasta)}` : "Sin fecha de inicio"}</td>
                              <td style={{ fontSize: 12 }}>{ocDetallePeriodo(p, g.moneda)}</td>
                              <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>{fmtMon(p.monto, g.moneda)}</td>
                              <td>{dev ? <Badge tone="ok">Devengado</Badge> : <Badge tone="navy">Pendiente</Badge>}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </td></tr>
                )] : []))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <div style={ocCard}>
        <div style={ocH2}>Preventivos</div>
        <div style={{ overflowX: "auto" }}>
          <table>
            <thead><tr><th>Año</th><th>Fuente</th><th>N°</th><th style={{ textAlign: "right" }}>Monto</th><th style={{ textAlign: "right" }}>Devengado</th><th style={{ textAlign: "right" }}>Saldo</th><th></th></tr></thead>
            <tbody>
              {r.preventivos.map((p) => (
                <tr key={p.id}>
                  <td>{p.anio || "—"}</td><td>{p.fuente || "—"}</td><td>{p.numero || "—"}</td>
                  <td style={{ textAlign: "right" }}>{fmtMoney(p.monto)}</td>
                  <td style={{ textAlign: "right" }}>{fmtMoney(p.devengado)}</td>
                  <td style={{ textAlign: "right", fontWeight: 600, color: p.saldo < -0.01 ? "#9C3F2E" : "inherit" }}>{fmtMoney(p.saldo)}</td>
                  <td><button onClick={() => eliminarPrev(p)} style={ocBtnX}>×</button></td>
                </tr>
              ))}
              {r.preventivos.length === 0 && <tr><td colSpan={7} style={{ color: "#8A8578", textAlign: "center" }}>Sin preventivos cargados</td></tr>}
              <tr>
                <td><input value={nuevoPrev.anio} onChange={(e) => setNuevoPrev({ ...nuevoPrev, anio: e.target.value.replace(/\D/g, "") })} style={{ ...inputStyle, width: 70 }} /></td>
                <td><input value={nuevoPrev.fuente} onChange={(e) => setNuevoPrev({ ...nuevoPrev, fuente: e.target.value })} style={{ ...inputStyle, width: 70 }} /></td>
                <td><input value={nuevoPrev.numero} onChange={(e) => setNuevoPrev({ ...nuevoPrev, numero: e.target.value })} placeholder="N°" style={{ ...inputStyle, width: 110 }} /></td>
                <td><input value={nuevoPrev.monto} onChange={(e) => setNuevoPrev({ ...nuevoPrev, monto: e.target.value })} placeholder="0,00" style={ocNumInput} /></td>
                <td colSpan={3}><button onClick={agregarPrev} style={ocBtn2}>+ Agregar</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div style={ocCard}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ ...ocH2, margin: 0 }}>Facturas y devengados</div>
          {!facturaForm && r.items.length > 0 && <button onClick={() => setFacturaForm("nueva")} style={ocBtn}>+ Cargar factura</button>}
        </div>
        {facturaForm && (
          <OCFacturaForm key={facturaForm === "nueva" ? "nueva" : facturaForm.id} gestion={g} resumen={r} tcs={data.tc}
            factura={facturaForm === "nueva" ? null : facturaForm}
            onListo={async () => { await onCambio(); setFacturaForm(null); }} onCancelar={() => setFacturaForm(null)} />
        )}
        {r.facturas.length === 0 ? <div style={{ fontSize: 13, color: "#8A8578" }}>Todavía no hay facturas cargadas.</div> : (
          <div style={{ overflowX: "auto" }}>
            <table>
              <thead><tr><th>Factura</th><th>Cubre</th>{esUSD && <th style={{ textAlign: "right" }}>USD</th>}{esUSD && <th style={{ textAlign: "right" }}>TC (fecha)</th>}<th style={{ textAlign: "right" }}>$</th><th>Imputación</th><th>EE / Dev.</th><th>Pago</th><th></th></tr></thead>
              <tbody>
                {r.facturas.map((fa) => (
                  <React.Fragment key={fa.id}>
                    <tr onClick={() => setAbierta(abierta === fa.id ? null : fa.id)} style={{ cursor: "pointer" }}>
                      <td><div style={{ fontWeight: 600 }}>{fa.numero_factura}</div><div style={ocMini}>{fmtDate(fa.fecha_factura)}</div></td>
                      <td style={{ fontSize: 12.5 }}>{fa.lineas.map((l) => describirLinea(l)).join(" · ")}{fa.lineas.length > 1 && <div style={ocMini}>{fa.lineas.length} ítems</div>}</td>
                      {esUSD && <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>{fmtNum(fa.totalMoneda)}</td>}
                      {esUSD && <td style={{ textAlign: "right", whiteSpace: "nowrap" }}>{fmtNum(fa.tc)}<div style={ocMini}>{fmtDate(fa.fecha_tc)}</div></td>}
                      <td style={{ textAlign: "right", whiteSpace: "nowrap", fontWeight: 600 }}>{fmtMoney(fa.totalPesos)}</td>
                      <td style={{ fontSize: 12 }}>
                        {fa.imputaciones.map((i) => { const p = r.preventivos.find((x) => x.id === i.preventivo_id); return <div key={i.id}>{p ? `${p.anio} · Fte. ${p.fuente || "—"}` : "—"}{fa.imputaciones.length > 1 ? `: ${fmtMoney(i.monto_pesos)}` : ""}</div>; })}
                        {fa.imputaciones.length === 0 && <span style={{ color: "#9A6B1E" }}>Sin imputar</span>}
                        {fa.imputaciones.length > 0 && fa.descuadre && <div style={{ color: "#9C3F2E" }}>No cuadra con el total</div>}
                      </td>
                      <td style={{ fontSize: 12 }}>{fa.numero_ee || "—"}<div style={ocMini}>Dev. {fa.numero_devengado || "—"}</div></td>
                      <td style={{ fontSize: 12 }}>{fa.fecha_pago ? fmtDate(fa.fecha_pago) : <span style={{ color: "#9A6B1E" }}>Pendiente</span>}</td>
                      <td style={{ whiteSpace: "nowrap" }} onClick={(e) => e.stopPropagation()}>
                        <button onClick={() => setFacturaForm(fa)} title="Editar" style={{ ...ocBtnX, color: "#8A8578", fontSize: 13 }}>✎</button>
                        <button onClick={() => eliminarFactura(fa)} title="Eliminar" style={ocBtnX}>×</button>
                      </td>
                    </tr>
                    {abierta === fa.id && (
                      <tr><td colSpan={esUSD ? 9 : 7} style={{ background: "#FBFAF7" }}>
                        {fa.lineas.map((l) => (
                          <div key={l.id} style={{ fontSize: 12.5, display: "flex", justifyContent: "space-between", gap: 10, padding: "2px 0" }}>
