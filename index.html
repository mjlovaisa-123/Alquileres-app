          <h1 className="serif" style={{ fontSize: 24, margin: 0, fontWeight: 600 }}>Períodos pendientes</h1>
          <p style={{ fontSize: 13, color: "#8A8578", margin: "5px 0 0" }}>Agrupado por contrato — tocá uno para ver los períodos pendientes individuales</p>
        </div>
        <button onClick={exportarExcel} style={{ padding: "9px 16px", borderRadius: 8, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>⬇ Descargar Excel</button>
      </header>
      <div style={{ marginBottom: 16 }}>
        <label style={{ fontSize: 12, fontWeight: 600, color: "#5C5748", marginRight: 8 }}>Hasta la fecha:</label>
        <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} style={{ ...inputStyle, width: "auto", display: "inline-block" }} />
      </div>

      {porContrato.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12, marginBottom: 18 }}>
          <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 9, padding: "13px 15px" }}>
            <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>Contratos con pendientes</div>
            <div style={{ fontSize: 18, fontWeight: 700, marginTop: 4 }}>{porContrato.length}</div>
          </div>
          <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 9, padding: "13px 15px" }}>
            <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>Total pendiente</div>
            <div style={{ fontSize: 18, fontWeight: 700, marginTop: 4, color: "#1B2A4A" }}>{fmtMoney(totalGeneral)}</div>
          </div>
        </div>
      )}

      {porContrato.length === 0 ? (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 30, textAlign: "center", color: "#8A8578" }}>No hay períodos pendientes hasta esa fecha.</div>
      ) : (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, overflow: "hidden" }}>
          <table>
            <thead><tr><th>N°</th><th>Dependencia / inmueble</th><th>Períodos pendientes</th><th>Total pendiente</th><th></th></tr></thead>
            <tbody>
              {porContrato.map((g) => (
                <React.Fragment key={g.contrato.id}>
                  <tr onClick={() => toggleExpandido(g.contrato.id)} style={{ cursor: "pointer" }}>
                    <td style={{ color: "#8A8578" }}>{g.contrato.numero_contrato || "—"}</td>
                    <td><div style={{ fontWeight: 600 }}>{g.contrato.dependencias?.nombre}</div><div style={{ fontSize: 12, color: "#8A8578" }}>{g.contrato.inmueble}</div></td>
                    <td>{g.items.length}</td>
                    <td style={{ fontWeight: 700 }}>{fmtMoney(g.total)}</td>
                    <td style={{ color: "#8A8578", fontSize: 11 }}>{expandidos[g.contrato.id] ? "▲ ocultar" : "▼ ver detalle"}</td>
                  </tr>
                  {expandidos[g.contrato.id] && (
                    <tr>
                      <td colSpan={5} style={{ background: "#FBFAF7", padding: "12px 16px" }}>
                        <table>
                          <thead><tr><th>Período</th><th>Monto teórico</th><th>N° Factura cargado</th><th>Monto cargado</th></tr></thead>
                          <tbody>
                            {g.items.map((f, i) => (
                              <tr key={i}>
                                <td>{fmtDate(f.periodo.desde)} al {fmtDate(f.periodo.hasta)}</td>
                                <td style={{ fontWeight: 700 }}>{fmtMoney(f.periodo.canon)}</td>
                                <td>{f.guardado?.numero_factura || "—"}</td>
                                <td>{f.guardado?.monto_cargado ? fmtMoney(f.guardado.monto_cargado) : "—"}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

// =================================================================
// PROYECCIÓN — estimado de canon por rango de meses (usa último índice conocido para el futuro)
// =================================================================
function ProyeccionView({ contratos, indices, jurisdicciones }) {
  const MESES_NOMBRE = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
  const hoy = new Date();
  const [desdeMes, setDesdeMes] = useState(hoy.getMonth());
  const [desdeAnio, setDesdeAnio] = useState(hoy.getFullYear());
  const [hastaMes, setHastaMes] = useState(() => (hoy.getMonth() + 5) % 12);
  const [hastaAnio, setHastaAnio] = useState(() => hoy.getFullYear() + Math.floor((hoy.getMonth() + 5) / 12));
  const [fJur, setFJur] = useState("Todas");
  const [expandidos, setExpandidos] = useState({});
  const toggleExpandido = (id) => setExpandidos((e) => ({ ...e, [id]: !e[id] }));

  const AÑOS = [hoy.getFullYear() - 1, hoy.getFullYear(), hoy.getFullYear() + 1, hoy.getFullYear() + 2, hoy.getFullYear() + 3];
  const desde = new Date(desdeAnio, desdeMes, 1);
  const hasta = new Date(hastaAnio, hastaMes + 1, 0);

  const filas = useMemo(() => {
    return contratos.filter((c) => fJur === "Todas" || c.jurisdiccion_codigo === fJur).map((c) => {
      const periodos = calcularPeriodos(c, indices, hasta);
      const enRango = periodos.filter((p) => p.hasta >= desde && p.desde <= hasta);
      const total = enRango.reduce((s, p) => s + p.canon, 0);
      return { contrato: c, meses: enRango.length, total, periodos: enRango };
    }).filter((f) => f.meses > 0);
  }, [contratos, indices, desde, hasta, fJur]);

  const totalGeneral = filas.reduce((s, f) => s + f.total, 0);

  const exportarExcel = () => {
    const data = [];
    filas.forEach((f) => {
      f.periodos.forEach((p) => {
        data.push({
          "N° contrato": f.contrato.numero_contrato || "", "Dependencia": f.contrato.dependencias?.nombre || "",
          "Inmueble": f.contrato.inmueble, "Desde": p.desde.toISOString().slice(0, 10), "Hasta": p.hasta.toISOString().slice(0, 10),
          "Etapa": p.etapa === "inicial" ? "Período inicial fijo" : (p.confirmado ? "Ajustado" : "Estimado, no confirmado"),
          "Índice ICL": p.indice, "Canon del período": p.canon,
        });
      });
      data.push({ "N° contrato": f.contrato.numero_contrato || "", "Dependencia": f.contrato.dependencias?.nombre || "", "Etapa": "Subtotal contrato", "Canon del período": f.total });
      data.push({});
    });
    data.push({ "N° contrato": "TOTAL GENERAL", "Canon del período": totalGeneral });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Proyección");
    XLSX.writeFile(wb, `proyeccion-${desdeAnio}${String(desdeMes+1).padStart(2,"0")}-a-${hastaAnio}${String(hastaMes+1).padStart(2,"0")}.xlsx`);
  };

  const selectStyle = { ...inputStyle, width: "auto" };

  return (
    <>
      <header style={{ marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 10 }}>
        <div>
          <h1 className="serif" style={{ fontSize: 24, margin: 0, fontWeight: 600 }}>Proyección de canon</h1>
          <p style={{ fontSize: 13, color: "#8A8578", margin: "5px 0 0" }}>Usa el índice ICL conocido; para meses futuros sin índice, toma el último publicado</p>
        </div>
        <button onClick={exportarExcel} style={{ padding: "9px 16px", borderRadius: 8, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>⬇ Descargar Excel</button>
      </header>

      <div style={{ display: "flex", gap: 10, marginBottom: 18, flexWrap: "wrap", alignItems: "center" }}>
        <label style={{ fontSize: 12.5, fontWeight: 600, color: "#5C5748" }}>Desde</label>
        <select value={desdeMes} onChange={(e) => setDesdeMes(Number(e.target.value))} style={selectStyle}>{MESES_NOMBRE.map((m, i) => <option key={m} value={i}>{m}</option>)}</select>
        <select value={desdeAnio} onChange={(e) => setDesdeAnio(Number(e.target.value))} style={selectStyle}>{AÑOS.map((a) => <option key={a} value={a}>{a}</option>)}</select>
        <label style={{ fontSize: 12.5, fontWeight: 600, color: "#5C5748" }}>Hasta</label>
        <select value={hastaMes} onChange={(e) => setHastaMes(Number(e.target.value))} style={selectStyle}>{MESES_NOMBRE.map((m, i) => <option key={m} value={i}>{m}</option>)}</select>
        <select value={hastaAnio} onChange={(e) => setHastaAnio(Number(e.target.value))} style={selectStyle}>{AÑOS.map((a) => <option key={a} value={a}>{a}</option>)}</select>
        <select value={fJur} onChange={(e) => setFJur(e.target.value)} style={selectStyle}>
          <option value="Todas">Toda jurisdicción</option>
          {jurisdicciones.map((j) => <option key={j.codigo} value={j.codigo}>Jur. {j.codigo}</option>)}
        </select>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 18 }}>
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 9, padding: "13px 15px" }}>
          <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>Contratos incluidos</div>
          <div style={{ fontSize: 18, fontWeight: 700, marginTop: 4 }}>{filas.length}</div>
        </div>
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 9, padding: "13px 15px" }}>
          <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>Período</div>
          <div style={{ fontSize: 14, fontWeight: 700, marginTop: 4 }}>{MESES_NOMBRE[desdeMes]} {desdeAnio} a {MESES_NOMBRE[hastaMes]} {hastaAnio}</div>
        </div>
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 9, padding: "13px 15px" }}>
          <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>Total proyectado</div>
          <div style={{ fontSize: 18, fontWeight: 700, marginTop: 4, color: "#1B2A4A" }}>{fmtMoney(totalGeneral)}</div>
        </div>
      </div>

      {filas.length === 0 ? (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 30, textAlign: "center", color: "#8A8578" }}>Ningún contrato tiene períodos en ese rango.</div>
      ) : (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, overflow: "hidden" }}>
          <table>
            <thead><tr><th>N°</th><th>Dependencia / inmueble</th><th>Meses</th><th>Total proyectado</th><th></th></tr></thead>
            <tbody>
              {filas.map((f) => (
                <React.Fragment key={f.contrato.id}>
                  <tr onClick={() => toggleExpandido(f.contrato.id)} style={{ cursor: "pointer" }}>
                    <td style={{ color: "#8A8578" }}>{f.contrato.numero_contrato || "—"}</td>
                    <td><div style={{ fontWeight: 600 }}>{f.contrato.dependencias?.nombre}</div><div style={{ fontSize: 12, color: "#8A8578" }}>{f.contrato.inmueble}</div></td>
                    <td>{f.meses}</td>
                    <td style={{ fontWeight: 700 }}>{fmtMoney(f.total)}</td>
                    <td style={{ color: "#8A8578", fontSize: 11 }}>{expandidos[f.contrato.id] ? "▲ ocultar cálculo" : "▼ ver cálculo"}</td>
                  </tr>
                  {expandidos[f.contrato.id] && (
                    <tr>
                      <td colSpan={5} style={{ background: "#FBFAF7", padding: "12px 16px" }}>
                        <table>
                          <thead><tr><th>Período</th><th>Etapa</th><th>Índice ICL</th><th>Canon</th></tr></thead>
                          <tbody>
                            {f.periodos.map((p, i) => (
                              <tr key={i}>
                                <td style={{ color: p.confirmado ? undefined : "#9C3F2E" }}>{fmtDate(p.desde)} al {fmtDate(p.hasta)}</td>
                                <td>
                                  {p.etapa === "inicial" ? <Badge tone="alerta">Inicial</Badge> : p.confirmado ? <Badge tone="ok">Ajustado</Badge> : <Badge tone="critico">Estimado, no confirmado</Badge>}
                                </td>
                                <td>{Number(p.indice).toFixed(4)}</td>
                                <td style={{ fontWeight: 700, color: p.confirmado ? undefined : "#9C3F2E" }}>{fmtMoney(p.canon)}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

// =================================================================
// ÍNDICES ICL (pegar tabla completa)
// =================================================================
function IndicesView({ indices, onCambio }) {
  const [texto, setTexto] = useState("");
  const [mensaje, setMensaje] = useState("");
  const [guardando, setGuardando] = useState(false);

  const importar = async () => {
    setGuardando(true); setMensaje("");
    try {
      const filas = texto.trim().split("\n").map((linea) => {
        const partes = linea.split(/\t|;/).map((s) => s.trim());
        if (partes.length < 2) return null;
        let [fecha, valor] = partes;
        if (fecha.includes("/")) {
          const [d, m, y] = fecha.split("/");
          fecha = `${y.length === 2 ? "20" + y : y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
        }
        valor = parseFloat(valor.replace(",", "."));
        if (!fecha || isNaN(valor)) return null;
        return { fecha, valor };
      }).filter(Boolean);

      if (filas.length === 0) { setMensaje("No se pudo interpretar ninguna fila. Formato esperado: fecha [tab/coma] valor, una por línea."); setGuardando(false); return; }

      const { error } = await db.from("indices_icl").insert(filas);
      if (error) throw error;
      setMensaje(`Se cargaron ${filas.length} valores correctamente.`);
      setTexto("");
      onCambio();
    } catch (e) { setMensaje("Error: " + e.message); }
    finally { setGuardando(false); }
  };

  return (
    <>
      <h1 className="serif" style={{ fontSize: 24, margin: "0 0 6px", fontWeight: 600 }}>Índices ICL</h1>
      <p style={{ fontSize: 13, color: "#8A8578", margin: "0 0 18px" }}>Pegá una tabla completa (fecha y valor, una fila por línea) copiada desde tu Excel, o cargá un valor a la vez.</p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 380px", gap: 20 }}>
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 18 }}>
          <label style={{ fontSize: 11, fontWeight: 600, color: "#8A8578", textTransform: "uppercase" }}>Pegar tabla (fecha [tab o coma] valor, una por línea)</label>
          <textarea value={texto} onChange={(e) => setTexto(e.target.value)} rows={8} placeholder={"2026-04-20\t185.12\n2026-05-20\t188.43"}
            style={{ width: "100%", marginTop: 6, padding: 10, borderRadius: 7, border: "1px solid #E4E1D8", fontSize: 13, fontFamily: "monospace", boxSizing: "border-box" }} />
          {mensaje && <div style={{ marginTop: 10, fontSize: 12.5, color: mensaje.startsWith("Error") ? "#B54B3A" : "#4A7856" }}>{mensaje}</div>}
          <button onClick={importar} disabled={guardando || !texto.trim()} style={{ marginTop: 12, padding: "9px 18px", borderRadius: 7, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            {guardando ? "Cargando…" : "Importar tabla"}
          </button>
        </div>

        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, overflow: "hidden", maxHeight: 340, overflowY: "auto" }}>
          <table>
            <thead><tr><th>Fecha</th><th>Índice</th></tr></thead>
            <tbody>
              {[...indices].reverse().map((i) => (
                <tr key={i.fecha}><td>{fmtDate(i.fecha)}</td><td style={{ fontWeight: 600 }}>{Number(i.valor).toFixed(4)}</td></tr>
              ))}
              {indices.length === 0 && <tr><td colSpan={2} style={{ textAlign: "center", color: "#8A8578" }}>Sin valores cargados todavía</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

// =================================================================
// DEPENDENCIAS
// =================================================================
function DependenciasView({ jurisdicciones, dependencias, contratos, estadosTramite, onCambio }) {
  const [nueva, setNueva] = useState({});
  const [nuevoEstado, setNuevoEstado] = useState("");
  const [guardandoEstado, setGuardandoEstado] = useState(false);
  const [depEditId, setDepEditId] = useState(null);
  const [depEditValor, setDepEditValor] = useState("");
  const [estEditId, setEstEditId] = useState(null);
  const [estEditValor, setEstEditValor] = useState("");

  const agregar = async (codigo) => {
    const nombre = (nueva[codigo] || "").trim();
    if (!nombre) return;
    const { error } = await db.from("dependencias").insert({ nombre, jurisdiccion_codigo: codigo });
    if (error) { alert("Error: " + error.message); return; }
    setNueva((n) => ({ ...n, [codigo]: "" }));
    onCambio();
  };
  const guardarDep = async (d) => {
    const nombre = depEditValor.trim();
    if (!nombre) return;
    const { error } = await db.from("dependencias").update({ nombre }).eq("id", d.id);
    if (error) { alert("Error: " + error.message); return; }
    setDepEditId(null);
    onCambio();
  };
  const eliminarDep = async (d) => {
    const count = contratos.filter((c) => c.dependencia_id === d.id).length;
    if (count > 0) { alert(`No se puede eliminar "${d.nombre}": tiene ${count} contrato(s) asociado(s). Reasigná esos contratos a otra dependencia primero.`); return; }
    if (!confirm(`¿Eliminar la dependencia "${d.nombre}"?`)) return;
    const { error } = await db.from("dependencias").delete().eq("id", d.id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };

  const agregarEstado = async () => {
    const nombre = nuevoEstado.trim();
    if (!nombre) return;
    setGuardandoEstado(true);
    const { error } = await db.from("estados_tramite").insert({ nombre });
    setGuardandoEstado(false);
    if (error) { alert("Error: " + error.message); return; }
    setNuevoEstado("");
    onCambio();
  };
  const guardarEstado = async (e) => {
    const nombreNuevo = estEditValor.trim();
    if (!nombreNuevo) return;
    if (nombreNuevo === e.nombre) { setEstEditId(null); return; }
    const { error } = await db.from("estados_tramite").update({ nombre: nombreNuevo }).eq("id", e.id);
    if (error) { alert("Error: " + error.message); return; }
    const afectados = contratos.filter((c) => c.estado_tramite === e.nombre);
    if (afectados.length > 0) {
      const { error: e2 } = await db.from("contratos").update({ estado_tramite: nombreNuevo }).eq("estado_tramite", e.nombre);
      if (e2) { alert("El estado se renombró, pero hubo un error actualizando los contratos que lo usaban: " + e2.message); }
    }
    setEstEditId(null);
    onCambio();
  };
  const eliminarEstado = async (e) => {
    const count = contratos.filter((c) => c.estado_tramite === e.nombre).length;
    const aviso = count > 0 ? `\n\n${count} contrato(s) tienen este estado cargado — van a conservar el texto "${e.nombre}", pero ya no vas a poder elegirlo de la lista.` : "";
    if (!confirm(`¿Eliminar el estado de trámite "${e.nombre}"?${aviso}`)) return;
    const { error } = await db.from("estados_tramite").delete().eq("id", e.id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };

  return (
    <>
      <h1 className="serif" style={{ fontSize: 24, margin: "0 0 18px", fontWeight: 600 }}>Jurisdicciones, dependencias y trámite</h1>

      <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 18, marginBottom: 20 }}>
        <div className="serif" style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>Estados de trámite</div>
        <p style={{ fontSize: 12, color: "#8A8578", marginBottom: 10 }}>Las etapas que podés asignar a un contrato mientras se gestiona (ej. "Solicitud enviada", "Dictamen legal", "Resolución en firma"). Se van agregando sobre la marcha.</p>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
          {estadosTramite.map((e) => {
            const count = contratos.filter((c) => c.estado_tramite === e.nombre).length;
            if (estEditId === e.id) {
              return (
                <span key={e.id} style={{ display: "flex", alignItems: "center", gap: 5, padding: "4px 6px 4px 10px", borderRadius: 999, background: "#fff", border: "1px solid #1B2A4A" }}>
                  <input autoFocus value={estEditValor} onChange={(ev) => setEstEditValor(ev.target.value)} style={{ border: "none", outline: "none", fontSize: 12.5, width: 140 }} />
                  <button onClick={() => guardarEstado(e)} style={{ border: "none", background: "#1B2A4A", color: "#fff", borderRadius: 999, width: 20, height: 20, fontSize: 11, cursor: "pointer" }}>✓</button>
                  <button onClick={() => setEstEditId(null)} style={{ border: "none", background: "none", color: "#B0AB9C", fontSize: 14, cursor: "pointer" }}>×</button>
                </span>
              );
            }
            return (
              <span key={e.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 8px 6px 12px", borderRadius: 999, background: "#F6F5F2", border: "1px solid #E4E1D8", fontSize: 12.5 }}>
                {e.nombre} <span style={{ color: "#8A8578" }}>({count})</span>
                <button onClick={() => { setEstEditId(e.id); setEstEditValor(e.nombre); }} title="Editar" style={{ border: "none", background: "none", color: "#8A8578", cursor: "pointer", fontSize: 12, padding: "0 2px" }}>✎</button>
                <button onClick={() => eliminarEstado(e)} title="Eliminar" style={{ border: "none", background: "none", color: "#B0AB9C", cursor: "pointer", fontSize: 14, padding: "0 2px" }}>×</button>
              </span>
            );
          })}
          {estadosTramite.length === 0 && <span style={{ fontSize: 12.5, color: "#8A8578" }}>Todavía no cargaste ningún estado.</span>}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <input placeholder="Agregar nuevo estado de trámite…" value={nuevoEstado} onChange={(e) => setNuevoEstado(e.target.value)} style={{ ...inputStyle, maxWidth: 280 }} />
          <button onClick={agregarEstado} disabled={guardandoEstado} style={{ padding: "8px 16px", borderRadius: 7, border: "1px solid #1B2A4A", background: "#fff", color: "#1B2A4A", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>+ Agregar</button>
        </div>
      </div>

      {jurisdicciones.map((j) => {
        const deps = dependencias.filter((d) => d.jurisdiccion_codigo === j.codigo);
        return (
          <div key={j.codigo} style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 18, marginBottom: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <span style={{ fontSize: 12, fontWeight: 700, background: "#1B2A4A", color: "#fff", padding: "3px 10px", borderRadius: 6 }}>Jur. {j.codigo}</span>
              <span className="serif" style={{ fontSize: 15, fontWeight: 600 }}>{j.nombre}</span>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
              {deps.map((d) => {
                const count = contratos.filter((c) => c.dependencia_id === d.id).length;
                if (depEditId === d.id) {
                  return (
                    <span key={d.id} style={{ display: "flex", alignItems: "center", gap: 5, padding: "4px 6px 4px 10px", borderRadius: 999, background: "#fff", border: "1px solid #1B2A4A" }}>
                      <input autoFocus value={depEditValor} onChange={(ev) => setDepEditValor(ev.target.value)} style={{ border: "none", outline: "none", fontSize: 12.5, width: 160 }} />
                      <button onClick={() => guardarDep(d)} style={{ border: "none", background: "#1B2A4A", color: "#fff", borderRadius: 999, width: 20, height: 20, fontSize: 11, cursor: "pointer" }}>✓</button>
                      <button onClick={() => setDepEditId(null)} style={{ border: "none", background: "none", color: "#B0AB9C", fontSize: 14, cursor: "pointer" }}>×</button>
                    </span>
                  );
                }
                return (
                  <span key={d.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 8px 6px 12px", borderRadius: 999, background: "#F6F5F2", border: "1px solid #E4E1D8", fontSize: 12.5 }}>
                    {d.nombre} <span style={{ color: "#8A8578" }}>({count})</span>
                    <button onClick={() => { setDepEditId(d.id); setDepEditValor(d.nombre); }} title="Editar" style={{ border: "none", background: "none", color: "#8A8578", cursor: "pointer", fontSize: 12, padding: "0 2px" }}>✎</button>
                    <button onClick={() => eliminarDep(d)} title="Eliminar" style={{ border: "none", background: "none", color: "#B0AB9C", cursor: "pointer", fontSize: 14, padding: "0 2px" }}>×</button>
                  </span>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <input placeholder="Agregar nueva dependencia…" value={nueva[j.codigo] || ""} onChange={(e) => setNueva((n) => ({ ...n, [j.codigo]: e.target.value }))} style={{ ...inputStyle, maxWidth: 280 }} />
              <button onClick={() => agregar(j.codigo)} style={{ padding: "8px 16px", borderRadius: 7, border: "1px solid #1B2A4A", background: "#fff", color: "#1B2A4A", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>+ Agregar</button>
            </div>
          </div>
        );
      })}
    </>
  );
}

// APP
// =================================================================
function App() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    db.auth.getSession().then(({ data: { session } }) => setSession(session));
    const { data: listener } = db.auth.onAuthStateChange((_e, session) => setSession(session));
    return () => listener.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", fontFamily: "Inter, sans-serif", color: "#8A8578" }}>Cargando…</div>;
  return session ? <Dashboard /> : <Login />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
