        {!modulo ? (
          <SelectorModulo perfil={perfil} contratos={contratos} ocResumenes={ocResumenes} ocError={ocError} onElegir={elegirModulo} />
        ) : modulo === "oc" ? renderOC() : contratoSel ? (
          <ContratoDetalleView
            contrato={contratoSel} indices={indices} contratos={contratos}
            locadores={locadores.filter((l) => l.contrato_id === contratoSel.id)}
            preventivos={preventivos.filter((p) => p.contrato_id === contratoSel.id)}
            periodosGuardados={periodosGuardados.filter((p) => p.contrato_id === contratoSel.id)}
            jurisdicciones={jurisdicciones} dependencias={dependencias} estadosTramite={estadosTramite}
            onVolver={() => setContratoSelId(null)} onCambio={cargarTodo}
          />
        ) : nav === "tablero" ? (
          renderTablero(null)
        ) : nav === "contratos" ? (
          <ContratosView contratos={contratos} jurisdicciones={jurisdicciones} estadosTramite={estadosTramite} onAbrir={irAFicha} />
        ) : nav === "importar" ? (
          <ImportarView jurisdicciones={jurisdicciones} dependencias={dependencias} contratos={contratos} locadores={locadores} perfil={perfil} estadosTramite={estadosTramite} onCreado={cargarTodo} setNav={setNav} />
        ) : nav === "pendientes" ? (
          <PendientesView contratos={contratos} indices={indices} periodosGuardados={periodosGuardados} />
        ) : nav === "proyeccion" ? (
          <ProyeccionView contratos={contratos} indices={indices} jurisdicciones={jurisdicciones} />
        ) : nav === "indices" ? (
          <IndicesView indices={indices} onCambio={cargarTodo} />
        ) : (
          <DependenciasView jurisdicciones={jurisdicciones} dependencias={dependencias} contratos={contratos} ocGestiones={ocData.gestiones} estadosTramite={estadosTramite} onCambio={() => { cargarTodo(); cargarOC(); }} />
        )}
      </main>
    </div>
  );
}

// =================================================================
// CONTRATOS (lista con filtros + semáforo)
// =================================================================
function ContratosView({ contratos, jurisdicciones, estadosTramite, onAbrir }) {
  const [fJur, setFJur] = useState("Todas");
  const [fDep, setFDep] = useState("Todas");
  const [fLocador, setFLocador] = useState("");
  const [fEstado, setFEstado] = useState("Todos");
  const [fTramite, setFTramite] = useState("Todos");
  const [fTipo, setFTipo] = useState("Todos");

  const dependenciasUnicas = useMemo(() => ["Todas", ...new Set(contratos.map((c) => c.dependencias?.nombre).filter(Boolean))], [contratos]);

  const filtrados = useMemo(() => contratos.filter((c) => {
    if (fJur !== "Todas" && c.jurisdiccion_codigo !== fJur) return false;
    if (fDep !== "Todas" && c.dependencias?.nombre !== fDep) return false;
    if (fLocador && !(c.locador || "").toLowerCase().includes(fLocador.toLowerCase())) return false;
    if (fEstado !== "Todos") {
      const est = estadoContrato(c);
      if (fEstado === "Renovación pendiente") {
        const tieneRenovacion = contratos.some((x) => x.contrato_anterior_id === c.id);
        if (!(est.dias <= 120 && !tieneRenovacion)) return false;
      } else if (est.label !== fEstado) return false;
    }
    if (fTramite !== "Todos" && (c.estado_tramite || "aprobado") !== fTramite) return false;
    if (fTipo !== "Todos" && (fTipo === "Sin definir" ? !!c.tipo_contratacion : c.tipo_contratacion !== fTipo)) return false;
    return true;
  }), [contratos, fJur, fDep, fLocador, fEstado, fTramite, fTipo]);

  const exportarExcel = () => {
    const data = filtrados.map((c) => {
      const est = estadoContrato(c);
      return {
        "N° contrato": c.numero_contrato || "", "Tipo de contratación": c.tipo_contratacion || "", "Jurisdicción": c.jurisdiccion_codigo, "Dependencia": c.dependencias?.nombre || "",
        "Inmueble": c.inmueble, "Locador": c.locador, "Expediente": c.expediente, "Resolución": c.resolucion || "",
        "Canon base": c.canon_base, "Periodicidad": c.periodicidad_ajuste,
        "Fecha inicio": c.fecha_inicio, "Plazo (meses)": c.plazo_meses,
        "Fecha vencimiento": fechaVencimiento(c).toISOString().slice(0, 10),
        "Estado": est.label, "Días para vencer": est.dias,
        "Estado trámite": estadoTramiteInfo(c.estado_tramite).label,
      };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Contratos");
    XLSX.writeFile(wb, `contratos-${new Date().toISOString().slice(0, 10)}.xlsx`);
  };

  return (
    <>
      <header style={{ marginBottom: 20, display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 10 }}>
        <div>
          <h1 className="serif" style={{ fontSize: 24, margin: 0, fontWeight: 600 }}>Contratos de locación</h1>
          <p style={{ fontSize: 13, color: "#8A8578", margin: "5px 0 0" }}>{filtrados.length} de {contratos.length} contratos</p>
        </div>
        <button onClick={exportarExcel} style={{ padding: "9px 16px", borderRadius: 8, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>⬇ Descargar Excel</button>
      </header>

      <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
        <select value={fJur} onChange={(e) => setFJur(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
          <option value="Todas">Toda jurisdicción</option>
          {jurisdicciones.map((j) => <option key={j.codigo} value={j.codigo}>Jur. {j.codigo}</option>)}
        </select>
        <select value={fDep} onChange={(e) => setFDep(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
          {dependenciasUnicas.map((d) => <option key={d} value={d}>{d === "Todas" ? "Toda dependencia" : d}</option>)}
        </select>
        <input placeholder="Buscar locador…" value={fLocador} onChange={(e) => setFLocador(e.target.value)} style={{ ...inputStyle, width: 180 }} />
        <select value={fEstado} onChange={(e) => setFEstado(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
          <option value="Todos">Todo estado</option>
          <option value="Vigente">Vigente</option>
          <option value="En plazo de preaviso">En plazo de preaviso (≤120 días)</option>
          <option value="Vencido">Vencido</option>
          <option value="Renovación pendiente">Renovación pendiente</option>
        </select>
        <select value={fTramite} onChange={(e) => setFTramite(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
          <option value="Todos">Todo trámite</option>
          {estadosTramite.map((o) => <option key={o.id} value={o.nombre}>{o.nombre}</option>)}
        </select>
        <select value={fTipo} onChange={(e) => setFTipo(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
          <option value="Todos">Todo tipo de contratación</option>
          {TIPOS_CONTRATACION.map((t) => <option key={t} value={t}>{t}</option>)}
          <option value="Sin definir">Sin tipo definido</option>
        </select>
      </div>

      {filtrados.length === 0 ? (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 40, textAlign: "center", color: "#8A8578" }}>
          {contratos.length === 0 ? "Todavía no hay contratos cargados." : "Ningún contrato coincide con estos filtros."}
        </div>
      ) : (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, overflow: "hidden" }}>
          <table>
            <thead><tr><th>N°</th><th>Dependencia / inmueble</th><th>Locador</th><th>Resolución</th><th>Canon base</th><th>Vencimiento</th><th>Estado</th><th>Trámite</th></tr></thead>
            <tbody>
              {filtrados.map((c) => {
                const est = estadoContrato(c);
                const tra = estadoTramiteInfo(c.estado_tramite);
                return (
                  <tr key={c.id} onClick={() => onAbrir(c)} style={{ cursor: "pointer" }}>
                    <td style={{ fontWeight: 600, color: "#8A8578" }}>
                      {c.numero_contrato || "—"}
                      {c.tipo_contratacion && <div style={{ marginTop: 4 }}><Badge tone="navy">{c.tipo_contratacion}</Badge></div>}
                    </td>
                    <td>
                      <div style={{ fontWeight: 600 }}>{c.dependencias?.nombre || "—"}</div>
                      <div style={{ fontSize: 12, color: "#8A8578" }}>{c.inmueble}</div>
                      <div style={{ fontSize: 11, color: "#B0AB9C" }}>Jur. {c.jurisdiccion_codigo} · Exp. {c.expediente}</div>
                    </td>
                    <td>{c.locador}</td>
                    <td>{c.resolucion || "—"}</td>
                    <td style={{ fontWeight: 600 }}>{fmtMoney(c.canon_base)}</td>
                    <td>{fmtDate(fechaVencimiento(c))}</td>
                    <td><Badge tone={est.tone}>{est.label}</Badge></td>
                    <td><Badge tone={tra.tone}>{tra.label}</Badge></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

// =================================================================
// FICHA DE CONTRATO — datos completos, edición, locadores, preventivos,
// renovación encadenada, y períodos con carga de factura/devengado
// =================================================================
function ContratoDetalleView({ contrato, indices, contratos, locadores, preventivos, periodosGuardados, jurisdicciones, dependencias, estadosTramite, onVolver, onCambio }) {
  const periodosHastaHoy = useMemo(() => calcularPeriodos(contrato, indices), [contrato, indices]);
  const periodos = useMemo(() => calcularPeriodos(contrato, indices, fechaVencimiento(contrato)), [contrato, indices]);
  const canonVigente = periodosHastaHoy.length > 0 ? periodosHastaHoy[periodosHastaHoy.length - 1].canon : contrato.canon_base;
  const est = estadoContrato(contrato);

  const [editando, setEditando] = useState(false);
  const [campo, setCampo] = useState(null);
  const [confirmandoBorrar, setConfirmandoBorrar] = useState(false);

  const [nuevoLocador, setNuevoLocador] = useState({ nombre: "", porcentaje: "" });
  const [nuevoPreventivo, setNuevoPreventivo] = useState({ numero: "", monto: "", anio: String(new Date().getFullYear()) });
  const [anioEditId, setAnioEditId] = useState(null);
  const [anioEditValor, setAnioEditValor] = useState("");
  const [editandoIcl, setEditandoIcl] = useState(false);
  const [iclPctTemp, setIclPctTemp] = useState("");

  const [periodoAbierto, setPeriodoAbierto] = useState(null);
  const [formPeriodo, setFormPeriodo] = useState({ numero_factura: "", monto_cargado: "", expediente_pago: "", numero_devengado: "", devengado_es_preventivo: false, anio: "" });

  const dependenciasFiltradas = dependencias.filter((d) => d.jurisdiccion_codigo === (campo?.jurisdiccion_codigo || contrato.jurisdiccion_codigo));

  const iniciarEdicion = () => {
    setCampo({
      jurisdiccion_codigo: contrato.jurisdiccion_codigo, dependencia_id: contrato.dependencia_id || "",
      inmueble: contrato.inmueble || "", locador: contrato.locador || "",
      expediente: contrato.expediente || "", resolucion: contrato.resolucion || "",
      canon_base: String(contrato.canon_base || ""), periodicidad_ajuste: contrato.periodicidad_ajuste || "Trimestral",
      meses_periodo_inicial: contrato.meses_periodo_inicial != null ? String(contrato.meses_periodo_inicial) : "",
      fecha_inicio: contrato.fecha_inicio || "", plazo_meses: String(contrato.plazo_meses || ""),
      fecha_notificacion_tcp: contrato.fecha_notificacion_tcp || "",
      numero_contrato: contrato.numero_contrato || "",
      es_renovacion: !!contrato.es_renovacion, contrato_anterior_id: contrato.contrato_anterior_id || "",
      estado_tramite: contrato.estado_tramite || "aprobado",
      tipo_contratacion: contrato.tipo_contratacion || "",
    });
    setEditando(true);
  };

  const guardarEdicion = async () => {
    const { error } = await db.from("contratos").update({
      jurisdiccion_codigo: campo.jurisdiccion_codigo, dependencia_id: campo.dependencia_id || null,
      inmueble: campo.inmueble, locador: campo.locador, expediente: campo.expediente, resolucion: campo.resolucion,
      canon_base: parseFloat(campo.canon_base) || 0, periodicidad_ajuste: campo.periodicidad_ajuste,
      meses_periodo_inicial: campo.meses_periodo_inicial ? parseInt(campo.meses_periodo_inicial, 10) : null,
      fecha_inicio: campo.fecha_inicio, plazo_meses: parseInt(campo.plazo_meses, 10) || 0,
      fecha_notificacion_tcp: campo.fecha_notificacion_tcp || null,
      numero_contrato: campo.numero_contrato || null,
      es_renovacion: campo.es_renovacion, contrato_anterior_id: campo.es_renovacion ? (campo.contrato_anterior_id || null) : null,
      estado_tramite: campo.estado_tramite || null,
      tipo_contratacion: campo.tipo_contratacion || null,
    }).eq("id", contrato.id);
    if (error) { alert("Error al guardar: " + error.message); return; }
    setEditando(false);
    onCambio();
  };

  const eliminarContrato = async () => {
    const { error } = await db.from("contratos").delete().eq("id", contrato.id);
    if (error) { alert("Error al eliminar: " + error.message); return; }
    onCambio();
    onVolver();
  };

  // ---- Locadores ----
  const agregarLocador = async () => {
    if (!nuevoLocador.nombre.trim()) return;
    const { error } = await db.from("contrato_locadores").insert({
      contrato_id: contrato.id, nombre: nuevoLocador.nombre.trim(),
      porcentaje: parseFloat(nuevoLocador.porcentaje) || 0,
    });
    if (error) { alert("Error: " + error.message); return; }
    setNuevoLocador({ nombre: "", porcentaje: "" });
    onCambio();
  };
  const eliminarLocador = async (id) => {
    const { error } = await db.from("contrato_locadores").delete().eq("id", id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };

  // ---- Preventivos ----
  const agregarPreventivo = async () => {
    if (!nuevoPreventivo.numero.trim() && !nuevoPreventivo.monto) return;
    const { error } = await db.from("contrato_preventivos").insert({
      contrato_id: contrato.id, numero: nuevoPreventivo.numero.trim(),
      monto: parseFloat(nuevoPreventivo.monto) || 0,
      anio: nuevoPreventivo.anio ? parseInt(nuevoPreventivo.anio, 10) : null,
    });
    if (error) { alert("Error: " + error.message); return; }
    setNuevoPreventivo({ numero: "", monto: "", anio: String(new Date().getFullYear()) });
    onCambio();
  };
  const eliminarPreventivo = async (id) => {
    const { error } = await db.from("contrato_preventivos").delete().eq("id", id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };
  const guardarAnioPreventivo = async (p) => {
    const anio = parseInt(anioEditValor, 10);
    if (!anio) return;
    const { error } = await db.from("contrato_preventivos").update({ anio }).eq("id", p.id);
    if (error) { alert("Error: " + error.message); return; }
    setAnioEditId(null);
    onCambio();
  };

  // Saldo por año: cada preventivo pertenece a un año, y el consumido se calcula según
  // el año del DEVENGADO en sí (ejercicio presupuestario), no el año del período del
  // contrato al que corresponde. Si un devengado está marcado "devengado_es_preventivo",
  // su monto suma a la vez como preventivo y como consumido de ese año (se autofinancia,
  // no resta saldo de otros preventivos).
  const resumenPorAnio = useMemo(() => {
    const anios = new Set();
    preventivos.forEach((p) => { if (p.anio) anios.add(p.anio); });
    periodosGuardados.forEach((pf) => { if (pf.numero_devengado && pf.anio) anios.add(pf.anio); });
    return [...anios].sort((a, b) => a - b).map((anio) => {
      const devengadosDelAnio = periodosGuardados.filter((pf) => pf.numero_devengado && pf.anio === anio);
      const autofinanciado = devengadosDelAnio.filter((pf) => pf.devengado_es_preventivo).reduce((s, pf) => s + Number(pf.monto_cargado || 0), 0);
      const preventivoDirecto = preventivos.filter((p) => p.anio === anio).reduce((s, p) => s + Number(p.monto || 0), 0);
      const totalPreventivo = preventivoDirecto + autofinanciado;
      const consumido = devengadosDelAnio.reduce((s, pf) => s + Number(pf.monto_cargado || 0), 0);
      return { anio, totalPreventivo, consumido, saldo: totalPreventivo - consumido };
    });
  }, [preventivos, periodosGuardados]);
  const preventivosSinAnio = preventivos.filter((p) => !p.anio);
  const devengadosSinAnio = periodosGuardados.filter((pf) => pf.numero_devengado && !pf.anio);


  // ---- Estimación presupuestaria con ICL ficticio ----
  const periodosFicticios = useMemo(() => calcularPeriodosFicticios(contrato, contrato.icl_ficticio_pct), [contrato]);
  const totalFicticio = periodosFicticios.reduce((s, p) => s + p.canon, 0);
  const guardarIclFicticio = async () => {
    const pct = iclPctTemp.trim() === "" ? null : parseFloat(iclPctTemp);
    const { error } = await db.from("contratos").update({ icl_ficticio_pct: pct }).eq("id", contrato.id);
    if (error) { alert("Error: " + error.message); return; }
    setEditandoIcl(false);
    onCambio();
  };

  // ---- Renovación: historial encadenado ----
  const contratoAnterior = contrato.contrato_anterior_id ? contratos.find((x) => x.id === contrato.contrato_anterior_id) : null;
  const renovadoPor = contratos.find((x) => x.contrato_anterior_id === contrato.id);
  const historialCompleto = useMemo(() => {
    const cadena = [];
    let actual = contratoAnterior;
    let salvaguarda = 0;
    while (actual && salvaguarda < 20) {
      cadena.push(actual);
      actual = actual.contrato_anterior_id ? contratos.find((x) => x.id === actual.contrato_anterior_id) : null;
      salvaguarda++;
    }
    return cadena;
  }, [contratoAnterior, contratos]);

  // ---- Períodos: matchear con lo guardado ----
  const periodosConDatos = periodos.map((p) => {
    const key = periodoKey(p.desde);
    const guardado = periodosGuardados.find((g) => g.periodo_desde && periodoKey(g.periodo_desde) === key);
    return { ...p, key, guardado };
  });

  const abrirPeriodo = (p) => {
    setPeriodoAbierto(p.key);
    setFormPeriodo({
      numero_factura: p.guardado?.numero_factura || "",
      monto_cargado: p.guardado?.monto_cargado != null ? String(p.guardado.monto_cargado) : "",
      expediente_pago: p.guardado?.expediente_pago || "",
      numero_devengado: p.guardado?.numero_devengado || "",
      devengado_es_preventivo: !!p.guardado?.devengado_es_preventivo,
      anio: p.guardado?.anio != null ? String(p.guardado.anio) : String(p.desde.getFullYear()),
    });
  };

  const guardarPeriodo = async (p) => {
    const datos = {
      contrato_id: contrato.id,
      locador: contrato.locador || "",
      periodo_desde: p.desde.toISOString().slice(0, 10),
      fecha_limite: p.hasta.toISOString().slice(0, 10),
      periodo: `${fmtDate(p.desde)} al ${fmtDate(p.hasta)}`,
      monto_teorico: p.canon,
      numero_factura: formPeriodo.numero_factura || null,
      monto_cargado: formPeriodo.monto_cargado ? parseFloat(formPeriodo.monto_cargado) : null,
      expediente_pago: formPeriodo.expediente_pago || null,
      numero_devengado: formPeriodo.numero_devengado || null,
      devengado_es_preventivo: formPeriodo.devengado_es_preventivo,
      anio: formPeriodo.anio ? parseInt(formPeriodo.anio, 10) : null,
    };
    let error;
    if (p.guardado) {
      ({ error } = await db.from("periodos_factura").update(datos).eq("id", p.guardado.id));
    } else {
      ({ error } = await db.from("periodos_factura").insert(datos));
    }
    if (error) { alert("Error al guardar: " + error.message); return; }
    setPeriodoAbierto(null);
    onCambio();
  };

  const exportarExcel = () => {
    const data = periodosConDatos.map((p) => ({
      "Desde": p.desde.toISOString().slice(0, 10), "Hasta": p.hasta.toISOString().slice(0, 10),
      "Etapa": p.etapa === "inicial" ? "Período inicial fijo" : (p.confirmado ? "Ajustado" : "Estimado, no confirmado"), "Índice ICL": p.indice, "Canon teórico": p.canon,
      "N° Factura": p.guardado?.numero_factura || "", "Monto factura": p.guardado?.monto_cargado || "",
      "N° EE": p.guardado?.expediente_pago || "", "N° Devengado": p.guardado?.numero_devengado || "", "Año devengado": p.guardado?.anio || "",
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Períodos");
    XLSX.writeFile(wb, `contrato-${contrato.numero_contrato || contrato.id}.xlsx`.replace(/\s+/g, "_"));
  };

  return (
    <>
      <div onClick={onVolver} style={{ fontSize: 12, color: "#5C5748", marginBottom: 14, cursor: "pointer" }}>← Volver a Contratos</div>

      <header style={{ marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 11.5, color: "#8A8578", fontWeight: 600 }}>{contrato.numero_contrato ? `Contrato N° ${contrato.numero_contrato}` : "Sin número asignado"}</span>
            <Badge tone={estadoTramiteInfo(contrato.estado_tramite).tone}>{estadoTramiteInfo(contrato.estado_tramite).label}</Badge>
            {contrato.tipo_contratacion && <Badge tone="ok">{contrato.tipo_contratacion}</Badge>}
          </div>
          <h1 className="serif" style={{ fontSize: 22, margin: "2px 0 0", fontWeight: 600 }}>{contrato.dependencias?.nombre || "—"}</h1>
          <p style={{ fontSize: 13, color: "#8A8578", margin: "5px 0 0" }}>{contrato.inmueble} · Locador: {contrato.locador}</p>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={exportarExcel} style={{ padding: "8px 14px", borderRadius: 7, border: "1px solid #1B2A4A", background: "#fff", color: "#1B2A4A", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>⬇ Excel</button>
          <button onClick={iniciarEdicion} style={{ padding: "8px 14px", borderRadius: 7, border: "1px solid #E4E1D8", background: "#fff", color: "#5C5748", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Editar</button>
          {confirmandoBorrar ? (
            <>
              <button onClick={eliminarContrato} style={{ padding: "8px 14px", borderRadius: 7, border: "none", background: "#B54B3A", color: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Confirmar</button>
              <button onClick={() => setConfirmandoBorrar(false)} style={{ padding: "8px 14px", borderRadius: 7, border: "1px solid #E4E1D8", background: "#fff", color: "#5C5748", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Cancelar</button>
            </>
          ) : (
            <button onClick={() => setConfirmandoBorrar(true)} style={{ padding: "8px 14px", borderRadius: 7, border: "1px solid #E4B8AF", background: "#fff", color: "#B54B3A", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Eliminar</button>
          )}
        </div>
      </header>

      {editando && (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 20, marginBottom: 20 }}>
          <div className="serif" style={{ fontSize: 15, fontWeight: 600, marginBottom: 12 }}>Editar contrato</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Campo label="N° de contrato"><input value={campo.numero_contrato} onChange={(e) => setCampo({ ...campo, numero_contrato: e.target.value })} style={inputStyle} /></Campo>
            <Campo label="Tipo de contratación">
              <select value={campo.tipo_contratacion} onChange={(e) => setCampo({ ...campo, tipo_contratacion: e.target.value })} style={inputStyle}>
                <option value="">Sin definir</option>
                {TIPOS_CONTRATACION.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </Campo>
            <Campo label="Jurisdicción">
              <select value={campo.jurisdiccion_codigo} onChange={(e) => setCampo({ ...campo, jurisdiccion_codigo: e.target.value, dependencia_id: "" })} style={inputStyle}>
                {jurisdicciones.map((j) => <option key={j.codigo} value={j.codigo}>Jur. {j.codigo} — {j.nombre}</option>)}
              </select>
            </Campo>
            <Campo label="Dependencia">
              <select value={campo.dependencia_id} onChange={(e) => setCampo({ ...campo, dependencia_id: e.target.value })} style={inputStyle}>
                <option value="">Seleccionar…</option>
                {dependenciasFiltradas.map((d) => <option key={d.id} value={d.id}>{d.nombre}</option>)}
              </select>
            </Campo>
            <Campo label="Inmueble"><input value={campo.inmueble} onChange={(e) => setCampo({ ...campo, inmueble: e.target.value })} style={inputStyle} /></Campo>
            <Campo label="Locador (resumen)"><input value={campo.locador} onChange={(e) => setCampo({ ...campo, locador: e.target.value })} style={inputStyle} /></Campo>
            <Campo label="Expediente"><input value={campo.expediente} onChange={(e) => setCampo({ ...campo, expediente: e.target.value })} style={inputStyle} /></Campo>
            <Campo label="Resolución"><input value={campo.resolucion} onChange={(e) => setCampo({ ...campo, resolucion: e.target.value })} style={inputStyle} /></Campo>
            <Campo label="Canon base"><input inputMode="decimal" value={campo.canon_base} onChange={(e) => setCampo({ ...campo, canon_base: e.target.value.replace(/[^\d.]/g, "") })} style={inputStyle} /></Campo>
            <Campo label="Fecha de inicio"><input type="date" value={campo.fecha_inicio} onChange={(e) => setCampo({ ...campo, fecha_inicio: e.target.value })} style={inputStyle} /></Campo>
            <Campo label="Plazo (meses)"><input type="number" value={campo.plazo_meses} onChange={(e) => setCampo({ ...campo, plazo_meses: e.target.value })} style={inputStyle} /></Campo>
            <Campo label="Meses período inicial fijo"><input type="number" value={campo.meses_periodo_inicial} onChange={(e) => setCampo({ ...campo, meses_periodo_inicial: e.target.value })} style={inputStyle} /></Campo>
            <Campo label="Periodicidad de ajuste">
              <select value={campo.periodicidad_ajuste} onChange={(e) => setCampo({ ...campo, periodicidad_ajuste: e.target.value })} style={inputStyle}>
                <option>Mensual</option><option>Bimestral</option><option>Trimestral</option><option>Cuatrimestral</option><option>Semestral</option><option>Anual</option>
              </select>
            </Campo>
            <Campo label="Fecha notificación TCP"><input type="date" value={campo.fecha_notificacion_tcp} onChange={(e) => setCampo({ ...campo, fecha_notificacion_tcp: e.target.value })} style={inputStyle} /></Campo>
            <Campo label="Estado del trámite">
              <select value={campo.estado_tramite} onChange={(e) => setCampo({ ...campo, estado_tramite: e.target.value })} style={inputStyle}>
                <option value="">Sin definir</option>
                {estadosTramite.map((o) => <option key={o.id} value={o.nombre}>{o.nombre}</option>)}
              </select>
            </Campo>
            <div style={{ gridColumn: "1 / -1", background: "#F6F5F2", border: "1px solid #E4E1D8", borderRadius: 8, padding: 12 }}>
              <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                <input type="checkbox" checked={campo.es_renovacion} onChange={(e) => setCampo({ ...campo, es_renovacion: e.target.checked })} />
                ¿Es renovación de un contrato anterior?
              </label>
              {campo.es_renovacion && (
                <div style={{ marginTop: 10 }}>
                  <label style={{ fontSize: 11, fontWeight: 600, color: "#8A8578", textTransform: "uppercase" }}>Contrato anterior</label>
                  <select value={campo.contrato_anterior_id} onChange={(e) => setCampo({ ...campo, contrato_anterior_id: e.target.value })} style={{ ...inputStyle, marginTop: 4 }}>
                    <option value="">No está cargado en el sistema</option>
                    {contratos.filter((c) => c.id !== contrato.id).map((c) => (
                      <option key={c.id} value={c.id}>{c.numero_contrato ? `N° ${c.numero_contrato} — ` : ""}{c.dependencias?.nombre} — {c.inmueble}</option>
                    ))}
                  </select>
                </div>
              )}
            </div>
          </div>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 16 }}>
            <button onClick={() => setEditando(false)} style={{ padding: "9px 16px", borderRadius: 8, border: "1px solid #E4E1D8", background: "#fff", color: "#5C5748", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Cancelar</button>
            <button onClick={guardarEdicion} style={{ padding: "9px 18px", borderRadius: 8, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Guardar cambios</button>
          </div>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 16 }}>
        {[
          { label: "Canon base", value: fmtMoney(contrato.canon_base) },
          { label: "Canon vigente hoy", value: fmtMoney(canonVigente) },
          { label: "Vencimiento", value: fmtDate(fechaVencimiento(contrato)) },
          { label: "Estado", value: null, badge: est },
        ].map((k) => (
          <div key={k.label} style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 9, padding: "12px 14px" }}>
            <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>{k.label}</div>
            {k.badge ? <div style={{ marginTop: 5 }}><Badge tone={k.badge.tone}>{k.badge.label}</Badge></div> : <div style={{ fontSize: 15, fontWeight: 700, marginTop: 4, color: "#1B2A4A" }}>{k.value}</div>}
          </div>
        ))}
      </div>

      <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <div className="serif" style={{ fontSize: 14, fontWeight: 600, marginBottom: 10 }}>Datos completos</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
          <Dato label="Tipo de contratación" value={contrato.tipo_contratacion || "Sin definir"} />
          <Dato label="Expediente" value={contrato.expediente} />
          <Dato label="Resolución" value={contrato.resolucion} />
          <Dato label="Jurisdicción" value={contrato.jurisdiccion_codigo} />
          <Dato label="Fecha de inicio" value={fmtDate(contrato.fecha_inicio)} />
          <Dato label="Plazo" value={contrato.plazo_meses ? `${contrato.plazo_meses} meses` : "—"} />
          <Dato label="Período inicial fijo" value={contrato.meses_periodo_inicial ? `${contrato.meses_periodo_inicial} meses` : "—"} />
          <Dato label="Periodicidad de ajuste" value={contrato.periodicidad_ajuste} />
          <Dato label="Fecha notificación TCP" value={fmtDate(contrato.fecha_notificacion_tcp)} />
        </div>
      </div>

      {/* ---- Estimación presupuestaria con ICL ficticio ---- */}
      <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
          <div className="serif" style={{ fontSize: 14, fontWeight: 600 }}>Estimación presupuestaria (ICL ficticio)</div>
          {!editandoIcl && (
            <button onClick={() => { setEditandoIcl(true); setIclPctTemp(contrato.icl_ficticio_pct != null ? String(contrato.icl_ficticio_pct) : ""); }}
              style={{ padding: "5px 12px", borderRadius: 7, border: "1px solid #E4E1D8", background: "#fff", color: "#5C5748", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
              {contrato.icl_ficticio_pct != null ? "Editar %" : "Definir %"}
            </button>
          )}
        </div>
        <p style={{ fontSize: 12, color: "#8A8578", marginBottom: 10 }}>Proyección independiente del ICL real: aplica un % de incremento hipotético en cada fecha de ajuste hasta el vencimiento, para tener una referencia de presupuesto mientras el trámite está en curso.</p>

        {editandoIcl ? (
          <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10 }}>
            <input autoFocus type="number" step="0.01" placeholder="% por ajuste" value={iclPctTemp} onChange={(e) => setIclPctTemp(e.target.value)} style={{ ...inputStyle, width: 140 }} />
            <button onClick={guardarIclFicticio} style={{ padding: "8px 16px", borderRadius: 7, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Guardar</button>
            <button onClick={() => setEditandoIcl(false)} style={{ padding: "8px 16px", borderRadius: 7, border: "1px solid #E4E1D8", background: "#fff", color: "#5C5748", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Cancelar</button>
          </div>
        ) : contrato.icl_ficticio_pct == null ? (
          <div style={{ fontSize: 12.5, color: "#8A8578" }}>Todavía no definiste un % hipotético para este contrato.</div>
        ) : (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
              <Badge tone="navy">{contrato.icl_ficticio_pct}% por ajuste</Badge>
              <span style={{ fontSize: 12.5, color: "#8A8578" }}>Total estimado del contrato completo:</span>
              <span style={{ fontWeight: 700, fontSize: 14, color: "#1B2A4A" }}>{fmtMoney(totalFicticio)}</span>
            </div>
            {periodosFicticios.length > 0 && (
              <div style={{ border: "1px solid #EDEBE3", borderRadius: 8, overflow: "hidden", maxHeight: 280, overflowY: "auto" }}>
                <table>
                  <thead><tr><th>Período</th><th>Etapa</th><th>Canon estimado</th></tr></thead>
                  <tbody>
                    {periodosFicticios.map((p, i) => (
                      <tr key={i}>
                        <td>{fmtDate(p.desde)} al {fmtDate(p.hasta)}</td>
                        <td>{p.etapa === "inicial" ? <Badge tone="alerta">Inicial</Badge> : <Badge tone="navy">Ajustado (×{p.incrementos})</Badge>}</td>
                        <td style={{ fontWeight: 700 }}><TooltipCalculo periodo={p}>{fmtMoney(p.canon)}</TooltipCalculo></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </>
        )}
      </div>

      {/* ---- Locadores ---- */}
      <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <div className="serif" style={{ fontSize: 14, fontWeight: 600, marginBottom: 4 }}>Locadores y reparto del canon</div>
        <p style={{ fontSize: 12, color: "#8A8578", marginBottom: 10 }}>Canon total vigente: <strong>{fmtMoney(canonVigente)}</strong></p>
        {locadores.length > 0 && (
          <div style={{ marginBottom: 10 }}>
            {locadores.map((l) => (
              <div key={l.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #EDEBE3", fontSize: 13 }}>
                <span>{l.nombre} <span style={{ color: "#8A8578" }}>({l.porcentaje}%)</span></span>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontWeight: 700 }}>{fmtMoney(canonVigente * (l.porcentaje / 100))}</span>
                  <button onClick={() => eliminarLocador(l.id)} style={{ border: "none", background: "none", color: "#B0AB9C", cursor: "pointer", fontSize: 15 }}>×</button>
                </div>
              </div>
            ))}
          </div>
        )}
        <div style={{ display: "flex", gap: 8 }}>
          <input placeholder="Nombre del locador" value={nuevoLocador.nombre} onChange={(e) => setNuevoLocador({ ...nuevoLocador, nombre: e.target.value })} style={{ ...inputStyle, flex: 2 }} />
          <input placeholder="%" inputMode="decimal" value={nuevoLocador.porcentaje} onChange={(e) => setNuevoLocador({ ...nuevoLocador, porcentaje: e.target.value.replace(/[^\d.]/g, "") })} style={{ ...inputStyle, width: 80 }} />
          <button onClick={agregarLocador} style={{ padding: "8px 16px", borderRadius: 7, border: "1px solid #1B2A4A", background: "#fff", color: "#1B2A4A", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>+ Agregar</button>
        </div>
      </div>

      {/* ---- Presupuestos preventivos y saldo ---- */}
      <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <div className="serif" style={{ fontSize: 14, fontWeight: 600, marginBottom: 10 }}>Presupuesto preventivo</div>
        {preventivos.length > 0 && (
          <div style={{ marginBottom: 10 }}>
            {preventivos.map((p) => (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #EDEBE3", fontSize: 13 }}>
                <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  N° {p.numero || "—"}
                  {anioEditId === p.id ? (
                    <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
                      <input autoFocus type="number" placeholder="Año" value={anioEditValor} onChange={(e) => setAnioEditValor(e.target.value)} style={{ ...inputStyle, width: 80, padding: "4px 6px" }} />
                      <button onClick={() => guardarAnioPreventivo(p)} style={{ border: "none", background: "#1B2A4A", color: "#fff", borderRadius: 999, width: 20, height: 20, fontSize: 11, cursor: "pointer" }}>✓</button>
                    </span>
                  ) : p.anio ? (
                    <Badge tone="navy">{p.anio}</Badge>
                  ) : (
                    <button onClick={() => { setAnioEditId(p.id); setAnioEditValor(String(new Date().getFullYear())); }} style={{ border: "1px dashed #E4B8AF", background: "#FBEBE7", color: "#9C3F2E", borderRadius: 999, padding: "2px 10px", fontSize: 11, cursor: "pointer" }}>Asignar año</button>
                  )}
                </span>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontWeight: 700 }}>{fmtMoney(p.monto)}</span>
                  <button onClick={() => eliminarPreventivo(p.id)} style={{ border: "none", background: "none", color: "#B0AB9C", cursor: "pointer", fontSize: 15 }}>×</button>
                </div>
              </div>
            ))}
          </div>
        )}
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <input placeholder="N° de preventivo" value={nuevoPreventivo.numero} onChange={(e) => setNuevoPreventivo({ ...nuevoPreventivo, numero: e.target.value })} style={{ ...inputStyle, flex: 1 }} />
          <input placeholder="Monto $" inputMode="decimal" value={nuevoPreventivo.monto} onChange={(e) => setNuevoPreventivo({ ...nuevoPreventivo, monto: e.target.value.replace(/[^\d.]/g, "") })} style={{ ...inputStyle, width: 140 }} />
          <input placeholder="Año" type="number" value={nuevoPreventivo.anio} onChange={(e) => setNuevoPreventivo({ ...nuevoPreventivo, anio: e.target.value })} style={{ ...inputStyle, width: 90 }} />
          <button onClick={agregarPreventivo} style={{ padding: "8px 16px", borderRadius: 7, border: "1px solid #1B2A4A", background: "#fff", color: "#1B2A4A", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>+ Agregar</button>
        </div>
        {preventivosSinAnio.length > 0 && (
          <div style={{ background: "#FBF1E1", border: "1px solid #EFDDB8", borderRadius: 8, padding: "8px 12px", fontSize: 12, color: "#9A6B1E", marginBottom: 10 }}>
            {preventivosSinAnio.length} preventivo(s) sin año asignado — no entran todavía en el resumen de saldo por año. Usá "Asignar año" arriba.
          </div>
        )}
        {devengadosSinAnio.length > 0 && (
          <div style={{ background: "#FBF1E1", border: "1px solid #EFDDB8", borderRadius: 8, padding: "8px 12px", fontSize: 12, color: "#9A6B1E", marginBottom: 14 }}>
            {devengadosSinAnio.length} devengado(s) sin año asignado — no entran todavía en el resumen de saldo por año. Abrí el período correspondiente más abajo y completá "Año del devengado".
          </div>
        )}
        <div className="serif" style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8, color: "#5C5748" }}>Saldo por año</div>
        {resumenPorAnio.length === 0 ? (
          <div style={{ fontSize: 12.5, color: "#8A8578" }}>Todavía no hay preventivos con año asignado ni devengados cargados.</div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: `repeat(${resumenPorAnio.length}, 1fr)`, gap: 10 }}>
            {resumenPorAnio.map((r) => (
              <div key={r.anio} style={{ background: "#F6F5F2", borderRadius: 8, padding: 12 }}>
                <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>{r.anio}</div>
                <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>Preventivo</div>
                <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 4 }}>{fmtMoney(r.totalPreventivo)}</div>
                <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>Consumido</div>
                <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 4 }}>{fmtMoney(r.consumido)}</div>
                <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>Saldo</div>
                <div style={{ fontWeight: 700, fontSize: 13, color: r.saldo < 0 ? "#B54B3A" : "#4A7856" }}>{fmtMoney(r.saldo)}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* ---- Renovación / historial ---- */}
      {(contrato.es_renovacion || renovadoPor) && (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 16, marginBottom: 16 }}>
          <div className="serif" style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>Historial de renovaciones</div>
          {contrato.es_renovacion && !contratoAnterior && (
            <div style={{ background: "#FBF1E1", border: "1px solid #EFDDB8", borderRadius: 8, padding: "10px 14px", fontSize: 12.5, color: "#9A6B1E", marginBottom: 10 }}>
              Este contrato es una renovación, pero el contrato anterior no está cargado en el sistema — buscarlo en otro lado.
            </div>
          )}
          {historialCompleto.map((h, i) => (
            <div key={h.id} style={{ fontSize: 13, padding: "6px 0", borderBottom: "1px solid #EDEBE3" }}>
              ← {h.numero_contrato ? `N° ${h.numero_contrato} — ` : ""}{h.dependencias?.nombre} — {h.inmueble} ({fmtDate(h.fecha_inicio)} a {fmtDate(fechaVencimiento(h))})
            </div>
          ))}
          {renovadoPor && (
            <div style={{ background: "#EEF3EC", border: "1px solid #D3E3D0", borderRadius: 8, padding: "10px 14px", fontSize: 12.5, color: "#4A7856", marginTop: 10 }}>
              Este contrato fue renovado por: {renovadoPor.numero_contrato ? `N° ${renovadoPor.numero_contrato} — ` : ""}{renovadoPor.dependencias?.nombre} — {renovadoPor.inmueble}
            </div>
          )}
        </div>
      )}

      <h2 className="serif" style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>Períodos y facturación</h2>
      <p style={{ fontSize: 12, color: "#8A8578", marginBottom: 12 }}>Se muestran todos los períodos hasta el vencimiento del contrato. Los marcados en rojo son estimados: todavía no hay un ICL publicado para esa fecha de ajuste, así que se calculan con el último índice conocido. Tocá un período para cargar N° de factura, monto, N° de EE y N° de devengado.</p>
      {periodosConDatos.length === 0 ? (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 24, textAlign: "center", color: "#8A8578", fontSize: 13 }}>
          No se pueden calcular períodos todavía — revisá que haya al menos un índice ICL cargado con fecha anterior o igual al inicio del contrato.
        </div>
      ) : (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, overflow: "hidden" }}>
          <table>
            <thead><tr><th>Período</th><th>Etapa</th><th>Canon teórico</th><th>N° Factura</th><th>Monto</th><th>N° EE</th><th>N° Devengado</th></tr></thead>
            <tbody>
              {periodosConDatos.map((p) => (
                <React.Fragment key={p.key}>
                  <tr onClick={() => (periodoAbierto === p.key ? setPeriodoAbierto(null) : abrirPeriodo(p))} style={{ cursor: "pointer", background: p.confirmado ? undefined : "#FCF3F1" }}>
                    <td style={{ fontWeight: 600, color: p.confirmado ? undefined : "#9C3F2E" }}>{fmtDate(p.desde)} al {fmtDate(p.hasta)}</td>
                    <td>
                      {p.etapa === "inicial" ? <Badge tone="alerta">Inicial</Badge> : p.confirmado ? <Badge tone="ok">Ajustado</Badge> : <Badge tone="critico">Estimado, no confirmado</Badge>}
                    </td>
                    <td style={{ fontWeight: 700, color: p.confirmado ? undefined : "#9C3F2E" }}><TooltipCalculo periodo={p}>{fmtMoney(p.canon)}</TooltipCalculo></td>
                    <td>{p.guardado?.numero_factura || "—"}</td>
                    <td>{p.guardado?.monto_cargado ? fmtMoney(p.guardado.monto_cargado) : "—"}</td>
                    <td>{p.guardado?.expediente_pago || "—"}</td>
                    <td>{p.guardado?.numero_devengado || "—"}{p.guardado?.numero_devengado ? (p.guardado?.anio ? <Badge tone="navy">{p.guardado.anio}</Badge> : <span style={{ marginLeft: 5, fontSize: 10.5, color: "#B54B3A" }}>(sin año)</span>) : null}{p.guardado?.devengado_es_preventivo ? <span style={{ marginLeft: 5, fontSize: 10.5, color: "#8A8578" }}>(prev.)</span> : null}</td>
                  </tr>
                  {periodoAbierto === p.key && (
                    <tr>
                      <td colSpan={7} style={{ background: "#FBFAF7", padding: "16px 18px" }}>
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr 1fr", gap: 12 }}>
                          <Campo label="N° de factura"><input value={formPeriodo.numero_factura} onChange={(e) => setFormPeriodo({ ...formPeriodo, numero_factura: e.target.value })} style={inputStyle} /></Campo>
                          <Campo label="Monto"><input inputMode="decimal" value={formPeriodo.monto_cargado} onChange={(e) => setFormPeriodo({ ...formPeriodo, monto_cargado: e.target.value.replace(/[^\d.]/g, "") })} style={inputStyle} /></Campo>
                          <Campo label="N° de EE"><input value={formPeriodo.expediente_pago} onChange={(e) => setFormPeriodo({ ...formPeriodo, expediente_pago: e.target.value })} style={inputStyle} /></Campo>
                          <Campo label="N° de devengado"><input value={formPeriodo.numero_devengado} onChange={(e) => setFormPeriodo({ ...formPeriodo, numero_devengado: e.target.value })} style={inputStyle} /></Campo>
                          <Campo label="Año del devengado"><input type="number" value={formPeriodo.anio} onChange={(e) => setFormPeriodo({ ...formPeriodo, anio: e.target.value })} style={inputStyle} /></Campo>
                        </div>
                        <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, marginTop: 12, cursor: "pointer", color: "#5C5748" }}>
                          <input type="checkbox" checked={formPeriodo.devengado_es_preventivo} onChange={(e) => setFormPeriodo({ ...formPeriodo, devengado_es_preventivo: e.target.checked })} />
                          Este gasto es preventivo y devengado en el mismo acto (no descuenta saldo de otros preventivos del año)
                        </label>
                        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 14 }}>
                          <button onClick={() => setPeriodoAbierto(null)} style={{ padding: "8px 14px", borderRadius: 7, border: "1px solid #E4E1D8", background: "#fff", color: "#5C5748", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Cancelar</button>
                          <button onClick={() => guardarPeriodo(p)} style={{ padding: "8px 16px", borderRadius: 7, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Guardar</button>
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

// =================================================================
// IMPORTAR (carga manual, con locadores y preventivos múltiples)
// =================================================================
function ImportarView({ jurisdicciones, dependencias, contratos, locadores, perfil, estadosTramite, onCreado, setNav }) {
  const [campos, setCampos] = useState({
    numeroContrato: "", jurisdiccionCodigo: jurisdicciones[0]?.codigo || "", dependenciaId: "", inmueble: "",
    expediente: "", resolucion: "", canon: "", periodicidad: "Trimestral", mesesPeriodoInicial: "",
    inicio: "", meses: "", fechaNotifTcp: "", esRenovacion: false, contratoAnteriorId: "",
    estadoTramite: "", tipoContratacion: "",
  });
  const [locadoresArr, setLocadoresArr] = useState([{ nombre: "", porcentaje: "100" }]);
  const [preventivosArr, setPreventivosArr] = useState([{ numero: "", monto: "", anio: String(new Date().getFullYear()) }]);
  const [guardando, setGuardando] = useState(false);
  const [mensaje, setMensaje] = useState("");
  const dependenciasFiltradas = dependencias.filter((d) => d.jurisdiccion_codigo === campos.jurisdiccionCodigo);

  const [avisoCopia, setAvisoCopia] = useState("");
  const fechaISOLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  // Al elegir el contrato anterior, copia inmueble, fecha de inicio (día siguiente al
  // vencimiento del anterior) y locadores con su %. Todo queda editable después.
  const datosDesdeAnterior = (ant) => {
    const inicio = ant.fecha_inicio && ant.plazo_meses ? fechaISOLocal(addDays(fechaVencimiento(ant), 1)) : null;
    const locAnt = (locadores || []).filter((l) => l.contrato_id === ant.id);
    let locs = null;
    if (locAnt.length > 0) {
      locs = locAnt.map((l) => ({ nombre: l.nombre || "", porcentaje: l.porcentaje != null ? String(l.porcentaje) : "" }));
    } else if (ant.locador) {
      // Contrato viejo sin locadores detallados: se toma el texto resumen, sin %
      const nombres = ant.locador.split(" / ").map((n) => n.trim()).filter(Boolean);
      locs = nombres.map((n) => ({ nombre: n, porcentaje: nombres.length === 1 ? "100" : "" }));
    }
    const ref = ant.numero_contrato ? `N° ${ant.numero_contrato}` : (ant.inmueble || "el contrato anterior");
    return { inmueble: ant.inmueble || "", inicio, locadores: locs, ref, sinPorcentajes: locAnt.length === 0 && !!ant.locador };
  };
  const seleccionarContratoAnterior = (id) => {
    if (!id) { setCampos({ ...campos, contratoAnteriorId: "" }); setAvisoCopia(""); return; }
    const ant = contratos.find((c) => c.id === id);
    if (!ant) return;
    const d = datosDesdeAnterior(ant);
    setCampos({ ...campos, contratoAnteriorId: id, inmueble: d.inmueble || campos.inmueble, inicio: d.inicio || campos.inicio });
    if (d.locadores) setLocadoresArr(d.locadores);
    setAvisoCopia(`Se copiaron inmueble, fecha de inicio y locadores de ${d.ref}. Revisalos antes de guardar.`
      + (d.sinPorcentajes ? " Ese contrato no tenía % cargados: completalos." : ""));
  };

  // ---- Precarga desde PDF ----
  const [pdfCargando, setPdfCargando] = useState(false);
  const [pdfMensaje, setPdfMensaje] = useState({ tipo: "", texto: "" });
  const [propuesta, setPropuesta] = useState(null);

  const leerPDFs = async (fileList) => {
    const files = [...fileList];
    if (!files.length) return;
    setPdfCargando(true); setPdfMensaje({ tipo: "", texto: "" }); setPropuesta(null);
    try {
      if (!window.pdfjsLib) throw new Error("No se pudo cargar el lector de PDF. Revisá la conexión a internet y recargá la página.");
      const docs = [], fallidos = [];
      for (const f of files) {
        try { docs.push(await leerTextoPDF(f)); } catch (e) { fallidos.push(f.name); }
      }
      const prop = analizarDocumentos(docs, { contratos, dependencias, locadoresGuardados: locadores });
      prop.fallidos = fallidos;
      const legibles = prop.documentos.filter((d) => !d.escaneado).length;
      if (legibles === 0) {
        setPdfMensaje({ tipo: "error", texto: "No se pudo leer ningún archivo. " + (prop.escaneados.length ? "Parecen escaneados (imagen, sin texto): cargá los datos a mano." : "Verificá que sean PDF válidos y sin contraseña.") });
      } else {
        setPropuesta(prop);
      }
    } catch (e) {
      setPdfMensaje({ tipo: "error", texto: e.message });
    } finally { setPdfCargando(false); }
  };

  const cambiarCampoProp = (i, valor) => {
    const cs = [...propuesta.campos];
    cs[i] = { ...cs[i], valor, aceptar: String(valor).trim() !== "" };
    setPropuesta({ ...propuesta, campos: cs });
  };
  const tildarCampoProp = (i, aceptar) => {
    const cs = [...propuesta.campos]; cs[i] = { ...cs[i], aceptar }; setPropuesta({ ...propuesta, campos: cs });
  };
  const cambiarLocProp = (i, patch) => {
    const ls = [...propuesta.locadores]; ls[i] = { ...ls[i], ...patch }; setPropuesta({ ...propuesta, locadores: ls });
  };
  const cambiarAnteriorProp = (patch) => setPropuesta({ ...propuesta, anterior: { ...propuesta.anterior, ...patch } });

  const aplicarPropuesta = () => {
    const val = (k) => {
      const c = propuesta.campos.find((x) => x.key === k);
      return c && c.aceptar && String(c.valor).trim() !== "" ? String(c.valor).trim() : null;
    };
    let nc = { ...campos };
    let nl = null;
    const a = propuesta.anterior;
    const ant = a && a.aceptar && a.contratoId ? contratos.find((c) => String(c.id) === String(a.contratoId)) : null;
    if (ant) {
      // primero lo del contrato anterior; después lo leído del PDF lo pisa
      const d = datosDesdeAnterior(ant);
      nc = { ...nc, esRenovacion: true, contratoAnteriorId: ant.id, inmueble: d.inmueble || nc.inmueble, inicio: d.inicio || nc.inicio };
      if (d.locadores) nl = d.locadores;
    } else if (val("esRenovacion")) {
      nc.esRenovacion = true;
    }
    ["expediente", "resolucion", "numeroContrato", "inmueble", "canon", "inicio", "meses", "mesesPeriodoInicial", "periodicidad", "tipoContratacion"].forEach((k) => {
      const v = val(k); if (v) nc[k] = v;
    });
    const depId = val("dependenciaId");
    if (depId) {
      const d = dependencias.find((x) => String(x.id) === depId);
      if (d) { nc.jurisdiccionCodigo = d.jurisdiccion_codigo; nc.dependenciaId = d.id; }
    }
    const locAcept = propuesta.locadores.filter((l) => l.aceptar && l.nombre.trim());
    if (locAcept.length) nl = locAcept.map((l) => ({ nombre: l.nombre.trim(), porcentaje: l.porcentaje }));
    setCampos(nc);
    if (nl) setLocadoresArr(nl);
    setAvisoCopia(ant ? `Vinculado al contrato anterior ${ant.numero_contrato ? "N° " + ant.numero_contrato : ""}.` : "");
    setPropuesta(null);
    setPdfMensaje({ tipo: "ok", texto: "Datos aplicados al formulario. Revisalos y completá lo que falte antes de guardar." });
  };

  const actualizarLocador = (i, campo, valor) => {
    const copia = [...locadoresArr]; copia[i] = { ...copia[i], [campo]: valor }; setLocadoresArr(copia);
  };
  const actualizarPreventivo = (i, campo, valor) => {
    const copia = [...preventivosArr]; copia[i] = { ...copia[i], [campo]: valor }; setPreventivosArr(copia);
  };

  const guardar = async (e) => {
    e.preventDefault();
    setGuardando(true); setMensaje("");
    try {
      const locadoresValidos = locadoresArr.filter((l) => l.nombre.trim());
      const locadorResumen = locadoresValidos.map((l) => l.nombre.trim()).join(" / ");
      const { data: nuevo, error } = await db.from("contratos").insert({
        numero_contrato: campos.numeroContrato || null,
        jurisdiccion_codigo: campos.jurisdiccionCodigo, dependencia_id: campos.dependenciaId || null,
        inmueble: campos.inmueble, locador: locadorResumen, expediente: campos.expediente, resolucion: campos.resolucion,
        canon_base: parseFloat(campos.canon) || 0, periodicidad_ajuste: campos.periodicidad,
        meses_periodo_inicial: campos.mesesPeriodoInicial ? parseInt(campos.mesesPeriodoInicial, 10) : null,
        fecha_inicio: campos.inicio, plazo_meses: parseInt(campos.meses, 10) || 0,
        fecha_notificacion_tcp: campos.fechaNotifTcp || null,
        es_renovacion: campos.esRenovacion, contrato_anterior_id: campos.esRenovacion ? (campos.contratoAnteriorId || null) : null,
        estado_tramite: campos.estadoTramite || null,
        tipo_contratacion: campos.tipoContratacion || null,
        creado_por: perfil?.id,
      }).select().single();
      if (error) throw error;

      if (locadoresValidos.length > 0) {
        await db.from("contrato_locadores").insert(locadoresValidos.map((l) => ({
          contrato_id: nuevo.id, nombre: l.nombre.trim(), porcentaje: parseFloat(l.porcentaje) || 0,
        })));
      }
      const preventivosValidos = preventivosArr.filter((p) => p.numero.trim() || p.monto);
      if (preventivosValidos.length > 0) {
        await db.from("contrato_preventivos").insert(preventivosValidos.map((p) => ({
          contrato_id: nuevo.id, numero: p.numero.trim(), monto: parseFloat(p.monto) || 0,
          anio: p.anio ? parseInt(p.anio, 10) : null,
        })));
      }

      setMensaje("Contrato guardado correctamente.");
      setCampos({ ...campos, inmueble: "", expediente: "", resolucion: "", canon: "", inicio: "", meses: "", mesesPeriodoInicial: "", fechaNotifTcp: "", numeroContrato: "", esRenovacion: false, contratoAnteriorId: "", estadoTramite: "", tipoContratacion: "" });
      setLocadoresArr([{ nombre: "", porcentaje: "100" }]);
      setPreventivosArr([{ numero: "", monto: "", anio: String(new Date().getFullYear()) }]);
      setAvisoCopia("");
      setPdfMensaje({ tipo: "", texto: "" });
      onCreado();
      setTimeout(() => setNav("contratos"), 900);
    } catch (err) { setMensaje("Error al guardar: " + err.message); }
    finally { setGuardando(false); }
  };

  return (
    <>
      <h1 className="serif" style={{ fontSize: 24, margin: "0 0 16px", fontWeight: 600 }}>Importar contrato</h1>
      <form onSubmit={guardar} style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 22, maxWidth: 700 }}>
        <div style={{ border: "1px dashed #B7C1D6", background: "#F4F6FA", borderRadius: 8, padding: 14, marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
            <div>
              <div style={{ fontSize: 13, fontWeight: 700, color: "#1B2A4A" }}>Precargar desde PDF</div>
              <div style={{ fontSize: 12, color: "#5C5748", marginTop: 2 }}>Subí la resolución y/o el modelo de contrato (podés elegir varios a la vez). Vas a poder revisar cada dato antes de pasarlo al formulario.</div>
            </div>
            <label style={{ padding: "8px 14px", borderRadius: 7, background: "#1B2A4A", color: "#fff", fontSize: 12.5, fontWeight: 600, cursor: pdfCargando ? "wait" : "pointer", whiteSpace: "nowrap" }}>
              {pdfCargando ? "Leyendo…" : "Elegir PDF"}
              <input type="file" accept="application/pdf,.pdf" multiple disabled={pdfCargando} style={{ display: "none" }}
                onChange={(e) => { leerPDFs(e.target.files); e.target.value = ""; }} />
            </label>
          </div>
          {pdfMensaje.texto && (
            <div style={{ marginTop: 10, fontSize: 12.5, color: pdfMensaje.tipo === "error" ? "#9C3F2E" : "#4A7856" }}>{pdfMensaje.texto}</div>
          )}
          {propuesta && (
            <div style={{ marginTop: 14, background: "#fff", border: "1px solid #E4E1D8", borderRadius: 8, padding: 12 }}>
              <div style={{ fontSize: 12, color: "#5C5748", marginBottom: 8 }}>
                Leídos: {propuesta.documentos.filter((d) => !d.escaneado).map((d) => `${d.nombre} (${d.tipo})`).join(", ")}
              </div>
              {propuesta.escaneados.length > 0 && (
                <div style={{ background: "#FBF1E1", border: "1px solid #EFDDB8", borderRadius: 6, padding: "6px 10px", fontSize: 12, color: "#9A6B1E", marginBottom: 8 }}>
                  No se pudo leer {propuesta.escaneados.join(", ")}: parece escaneado (imagen, sin texto). Sus datos hay que cargarlos a mano.
                </div>
              )}
              {propuesta.fallidos.length > 0 && (
                <div style={{ background: "#FBEBE7", border: "1px solid #E4B8AF", borderRadius: 6, padding: "6px 10px", fontSize: 12, color: "#9C3F2E", marginBottom: 8 }}>
                  No se pudo abrir {propuesta.fallidos.join(", ")}. Verificá que sea un PDF válido y sin contraseña.
                </div>
              )}
              <table>
                <thead><tr><th style={{ width: 30 }}></th><th>Dato</th><th>Valor encontrado</th><th>Origen</th></tr></thead>
                <tbody>
                  {propuesta.campos.map((c, i) => (
                    <tr key={c.key}>
                      <td><input type="checkbox" checked={c.aceptar} disabled={String(c.valor).trim() === ""} onChange={(e) => tildarCampoProp(i, e.target.checked)} /></td>
                      <td style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap" }}>{c.label}</td>
                      <td>
                        {c.formato === "fecha" ? (
                          <input type="date" value={c.valor} onChange={(e) => cambiarCampoProp(i, e.target.value)} style={inputStyle} />
                        ) : c.formato === "periodicidad" ? (
                          <select value={c.valor} onChange={(e) => cambiarCampoProp(i, e.target.value)} style={inputStyle}>
                            <option value="">No encontrado</option>
                            {PERIODICIDADES.map((p) => <option key={p}>{p}</option>)}
                          </select>
                        ) : c.formato === "dependencia" ? (
                          <select value={c.valor} onChange={(e) => cambiarCampoProp(i, e.target.value)} style={inputStyle}>
                            <option value="">No encontrada</option>
                            {dependencias.map((d) => <option key={d.id} value={String(d.id)}>Jur. {d.jurisdiccion_codigo} · {d.nombre}</option>)}
                          </select>
                        ) : c.formato === "tipo" ? (
                          <select value={c.valor} onChange={(e) => cambiarCampoProp(i, e.target.value)} style={inputStyle}>
                            <option value="">No encontrado</option>
                            {TIPOS_CONTRATACION.map((t) => <option key={t}>{t}</option>)}
                          </select>
                        ) : c.key === "esRenovacion" ? (
                          <span style={{ fontSize: 12.5 }}>{c.valor ? "Sí (el texto habla de renovación o prórroga)" : <span style={{ color: "#B0AB9C" }}>No se menciona</span>}</span>
                        ) : (
                          <div>
                            <input value={c.valor} placeholder="No encontrado" inputMode={c.formato === "monto" ? "decimal" : undefined}
                              onChange={(e) => cambiarCampoProp(i, c.formato === "monto" ? e.target.value.replace(/[^\d.]/g, "") : e.target.value)} style={inputStyle} />
                            {c.formato === "monto" && c.valor && <div style={{ fontSize: 11, color: "#8A8578", marginTop: 2 }}>{fmtMoney(c.valor)}</div>}
                          </div>
                        )}
                      </td>
                      <td style={{ fontSize: 11, color: "#8A8578" }}>{c.origen || "—"}</td>
                    </tr>
                  ))}
                  <tr>
                    <td><input type="checkbox" checked={!!(propuesta.anterior && propuesta.anterior.aceptar)} disabled={!propuesta.anterior || !propuesta.anterior.contratoId} onChange={(e) => cambiarAnteriorProp({ aceptar: e.target.checked })} /></td>
                    <td style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap" }}>Contrato anterior</td>
                    <td>
                      {propuesta.anterior ? (
                        <>
                          <div style={{ fontSize: 11.5, color: "#5C5748", marginBottom: 4 }}>El texto cita el Contrato N° {propuesta.anterior.numero}{propuesta.anterior.contratoId ? "" : " — no está cargado con ese número; elegilo a mano si corresponde"}</div>
                          <select value={propuesta.anterior.contratoId} onChange={(e) => cambiarAnteriorProp({ contratoId: e.target.value, aceptar: !!e.target.value })} style={inputStyle}>
                            <option value="">Sin vincular</option>
                            {contratos.map((c) => <option key={c.id} value={c.id}>{c.numero_contrato ? `N° ${c.numero_contrato} — ` : ""}{c.dependencias?.nombre} — {c.inmueble}</option>)}
                          </select>
                        </>
                      ) : <span style={{ fontSize: 12.5, color: "#B0AB9C" }}>No se menciona</span>}
                    </td>
                    <td style={{ fontSize: 11, color: "#8A8578" }}>{propuesta.anterior?.origen || "—"}</td>
                  </tr>
                </tbody>
              </table>

              <div style={{ fontSize: 12.5, fontWeight: 700, color: "#1B2A4A", margin: "14px 0 6px" }}>Locadores encontrados</div>
              {propuesta.locadores.length === 0 ? (

              </div>
            </div>

        <div style={{ background: "#F6F5F2", border: "1px solid #E4E1D8", borderRadius: 8, padding: 14, marginBottom: 16 }}>
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            <input type="checkbox" checked={campos.esRenovacion} onChange={(e) => { setCampos({ ...campos, esRenovacion: e.target.checked, contratoAnteriorId: e.target.checked ? campos.contratoAnteriorId : "" }); if (!e.target.checked) setAvisoCopia(""); }} />
            ¿Es renovación de un contrato anterior?
          </label>
          {campos.esRenovacion && (
            <div style={{ marginTop: 10 }}>
              <label style={{ fontSize: 11, fontWeight: 600, color: "#8A8578", textTransform: "uppercase" }}>Contrato anterior</label>
              <select value={campos.contratoAnteriorId} onChange={(e) => seleccionarContratoAnterior(e.target.value)} style={{ ...inputStyle, marginTop: 4 }}>
                <option value="">No está cargado en el sistema</option>
                {contratos.map((c) => (
                  <option key={c.id} value={c.id}>{c.numero_contrato ? `N° ${c.numero_contrato} — ` : ""}{c.dependencias?.nombre} — {c.inmueble} (vence {fmtDate(fechaVencimiento(c))})</option>
                ))}
              </select>
              {avisoCopia && <div style={{ marginTop: 10, background: "#EEF3EC", border: "1px solid #D3E3D0", borderRadius: 8, padding: "8px 12px", fontSize: 12.5, color: "#4A7856" }}>{avisoCopia}</div>}

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
          <Campo label="N° de contrato"><input value={campos.numeroContrato} onChange={(e) => setCampos({ ...campos, numeroContrato: e.target.value })} style={inputStyle} /></Campo>
          <Campo label="Tipo de contratación">
            <select value={campos.tipoContratacion} onChange={(e) => setCampos({ ...campos, tipoContratacion: e.target.value })} style={inputStyle}>
              <option value="">Sin definir</option>

            </select>
          </Campo>
          <Campo label="Jurisdicción">
            <select value={campos.jurisdiccionCodigo} onChange={(e) => setCampos({ ...campos, jurisdiccionCodigo: e.target.value, dependenciaId: "" })} style={inputStyle}>
              {jurisdicciones.map((j) => <option key={j.codigo} value={j.codigo}>Jur. {j.codigo} — {j.nombre}</option>)}
            </select>
          </Campo>
          <Campo label="Dependencia">
            <select value={campos.dependenciaId} onChange={(e) => setCampos({ ...campos, dependenciaId: e.target.value })} style={inputStyle}>

            </select>

          <Campo label="Inmueble"><input required value={campos.inmueble} onChange={(e) => setCampos({ ...campos, inmueble: e.target.value })} style={inputStyle} /></Campo>
          <Campo label="Expediente"><input value={campos.expediente} onChange={(e) => setCampos({ ...campos, expediente: e.target.value })} style={inputStyle} /></Campo>
          <Campo label="Resolución"><input value={campos.resolucion} onChange={(e) => setCampos({ ...campos, resolucion: e.target.value })} style={inputStyle} /></Campo>
          <Campo label="Canon mensual base (total)"><input required inputMode="decimal" value={campos.canon} onChange={(e) => setCampos({ ...campos, canon: e.target.value.replace(/[^\d.]/g, "") })} style={inputStyle} /></Campo>
          <Campo label="Fecha de inicio"><input required type="date" value={campos.inicio} onChange={(e) => setCampos({ ...campos, inicio: e.target.value })} style={inputStyle} /></Campo>
          <Campo label="Plazo (meses)"><input required type="number" value={campos.meses} onChange={(e) => setCampos({ ...campos, meses: e.target.value })} style={inputStyle} /></Campo>
          <Campo label="Estado del trámite">
            <select value={campos.estadoTramite} onChange={(e) => setCampos({ ...campos, estadoTramite: e.target.value })} style={inputStyle}>
              <option value="">Sin definir</option>

          <div style={{ gridColumn: "1 / -1", background: "#F6F5F2", border: "1px solid #E4E1D8", borderRadius: 8, padding: 14 }}>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
              <Campo label="Meses de período inicial fijo">
                <input type="number" value={campos.mesesPeriodoInicial} onChange={(e) => setCampos({ ...campos, mesesPeriodoInicial: e.target.value })} placeholder="Igual a la periodicidad si lo dejás vacío" style={inputStyle} />
              </Campo>
              <Campo label="Periodicidad de ajuste posterior">
                <select value={campos.periodicidad} onChange={(e) => setCampos({ ...campos, periodicidad: e.target.value })} style={inputStyle}>
                  <option>Mensual</option><option>Bimestral</option><option>Trimestral</option><option>Cuatrimestral</option><option>Semestral</option><option>Anual</option>
                </select>
              </Campo>
            </div>

          <div style={{ gridColumn: "1 / -1", background: "#F6F5F2", border: "1px solid #E4E1D8", borderRadius: 8, padding: 14 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#1B2A4A", marginBottom: 10 }}>Locadores y reparto del canon</div>
            {locadoresArr.map((l, i) => (
              <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <input placeholder="Nombre" value={l.nombre} onChange={(e) => actualizarLocador(i, "nombre", e.target.value)} style={{ ...inputStyle, flex: 2 }} />
                <input placeholder="%" inputMode="decimal" value={l.porcentaje} onChange={(e) => actualizarLocador(i, "porcentaje", e.target.value.replace(/[^\d.]/g, ""))} style={{ ...inputStyle, width: 80 }} />

            <button type="button" onClick={() => setLocadoresArr([...locadoresArr, { nombre: "", porcentaje: "" }])} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid #1B2A4A", background: "#fff", color: "#1B2A4A", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>+ Agregar locador</button>

          <div style={{ gridColumn: "1 / -1", background: "#F6F5F2", border: "1px solid #E4E1D8", borderRadius: 8, padding: 14 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: "#1B2A4A", marginBottom: 10 }}>Presupuesto preventivo (opcional)</div>
