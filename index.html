              <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <input placeholder="N° de preventivo" value={p.numero} onChange={(e) => actualizarPreventivo(i, "numero", e.target.value)} style={{ ...inputStyle, flex: 1 }} />
                <input placeholder="Monto $" inputMode="decimal" value={p.monto} onChange={(e) => actualizarPreventivo(i, "monto", e.target.value.replace(/[^\d.]/g, ""))} style={{ ...inputStyle, width: 140 }} />
                <input placeholder="Año" type="number" value={p.anio} onChange={(e) => actualizarPreventivo(i, "anio", e.target.value)} style={{ ...inputStyle, width: 90 }} />
                {preventivosArr.length > 1 && <button type="button" onClick={() => setPreventivosArr(preventivosArr.filter((_, x) => x !== i))} style={{ border: "none", background: "none", color: "#B0AB9C", fontSize: 16, cursor: "pointer" }}>×</button>}
              </div>
            ))}
            <button type="button" onClick={() => setPreventivosArr([...preventivosArr, { numero: "", monto: "", anio: String(new Date().getFullYear()) }])} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid #1B2A4A", background: "#fff", color: "#1B2A4A", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>+ Agregar preventivo</button>
          </div>

          <Campo label="Fecha notificación TCP (opcional)"><input type="date" value={campos.fechaNotifTcp} onChange={(e) => setCampos({ ...campos, fechaNotifTcp: e.target.value })} style={inputStyle} /></Campo>

        </div>
        {mensaje && <div style={{ marginTop: 14, fontSize: 13, color: mensaje.startsWith("Error") ? "#B54B3A" : "#4A7856" }}>{mensaje}</div>}
        <button type="submit" disabled={guardando} style={{ marginTop: 18, padding: "10px 22px", borderRadius: 8, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>
          {guardando ? "Guardando…" : "Guardar contrato"}
        </button>
      </form>
    </>
  );
}

// =================================================================
// PENDIENTES — reporte de períodos sin factura/devengado hasta una fecha
// =================================================================
function PendientesView({ contratos, indices, periodosGuardados }) {
  const hoy = new Date();
  const [fecha, setFecha] = useState(`${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}-${String(hoy.getDate()).padStart(2, "0")}`);
  const [expandidos, setExpandidos] = useState({});
  const toggleExpandido = (id) => setExpandidos((e) => ({ ...e, [id]: !e[id] }));

  const pendientes = useMemo(() => {
    const limite = parseDateLocal(fecha);
    const filas = [];
    contratos.forEach((c) => {
      const periodos = calcularPeriodos(c, indices, limite);
      periodos.filter((p) => p.hasta <= limite).forEach((p) => {
        const key = periodoKey(p.desde);
        const guardado = periodosGuardados.find((g) => g.contrato_id === c.id && g.periodo_desde && periodoKey(g.periodo_desde) === key);
        if (!guardado || !guardado.numero_devengado) {
          filas.push({ contrato: c, periodo: p, guardado });
        }
      });
    });
    return filas.sort((a, b) => a.periodo.desde - b.periodo.desde);
  }, [contratos, indices, periodosGuardados, fecha]);

  const porContrato = useMemo(() => {
    const mapa = new Map();
    pendientes.forEach((f) => {
      if (!mapa.has(f.contrato.id)) mapa.set(f.contrato.id, { contrato: f.contrato, items: [], total: 0 });
      const entry = mapa.get(f.contrato.id);
      entry.items.push(f);
      entry.total += f.periodo.canon;
    });
    return [...mapa.values()].sort((a, b) => b.total - a.total);
  }, [pendientes]);

  const totalGeneral = porContrato.reduce((s, c) => s + c.total, 0);

  const exportarExcel = () => {
    const data = [];
    porContrato.forEach((g) => {
      g.items.forEach((f) => {
        data.push({
          "N° contrato": f.contrato.numero_contrato || "", "Dependencia": f.contrato.dependencias?.nombre || "",
          "Inmueble": f.contrato.inmueble, "Locador": f.contrato.locador || "", "Resolución": f.contrato.resolucion || "", "Período": `${f.periodo.desde.toISOString().slice(0,10)} al ${f.periodo.hasta.toISOString().slice(0,10)}`,
          "Monto teórico": f.periodo.canon, "N° Factura cargado": f.guardado?.numero_factura || "", "Monto cargado": f.guardado?.monto_cargado || "",
        });
      });
      data.push({ "N° contrato": g.contrato.numero_contrato || "", "Dependencia": g.contrato.dependencias?.nombre || "", "Período": "Subtotal contrato", "Monto teórico": g.total });
      data.push({});
    });
    data.push({ "N° contrato": "TOTAL GENERAL", "Monto teórico": totalGeneral });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Pendientes");
    XLSX.writeFile(wb, `pendientes-al-${fecha}.xlsx`);
  };

  return (
    <>
      <header style={{ marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 10 }}>
        <div>
          <h1 className="serif" style={{ fontSize: 24, margin: 0, fontWeight: 600 }}>Períodos pendientes</h1>
          <p style={{ fontSize: 13, color: "#8A8578", margin: "5px 0 0" }}>Agrupado por contrato — tocá uno para ver los períodos pendientes individuales</p>
        </div>
        <button onClick={exportarExcel} style={{ padding: "9px 16px", borderRadius: 8, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>⬇ Descargar Excel</button>
      </header>
      <div style={{ marginBottom: 16 }}>
        <label style={{ fontSize: 12, fontWeight: 600, color: "#5C5748", marginRight: 8 }}>Hasta la fecha:</label>
        <input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} style={{ ...inputStyle, width: "auto", display: "inline-block" }} />
      </div>

      {porContrato.length > 0 && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12, marginBottom: 18 }}>
          <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 9, padding: "13px 15px" }}>
            <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>Contratos con pendientes</div>
            <div style={{ fontSize: 18, fontWeight: 700, marginTop: 4 }}>{porContrato.length}</div>
          </div>
          <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 9, padding: "13px 15px" }}>
            <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>Total pendiente</div>
            <div style={{ fontSize: 18, fontWeight: 700, marginTop: 4, color: "#1B2A4A" }}>{fmtMoney(totalGeneral)}</div>
          </div>
        </div>
      )}

      {porContrato.length === 0 ? (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 30, textAlign: "center", color: "#8A8578" }}>No hay períodos pendientes hasta esa fecha.</div>
      ) : (
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, overflow: "hidden" }}>
          <table>
            <thead><tr><th>N°</th><th>Dependencia / inmueble</th><th>Locador</th><th>Resolución</th><th>Períodos pendientes</th><th>Total pendiente</th><th></th></tr></thead>
            <tbody>
              {porContrato.map((g) => (
                <React.Fragment key={g.contrato.id}>
                  <tr onClick={() => toggleExpandido(g.contrato.id)} style={{ cursor: "pointer" }}>
                    <td style={{ color: "#8A8578" }}>{g.contrato.numero_contrato || "—"}</td>
                    <td><div style={{ fontWeight: 600 }}>{g.contrato.dependencias?.nombre}</div><div style={{ fontSize: 12, color: "#8A8578" }}>{g.contrato.inmueble}</div></td>
                    <td>{g.contrato.locador || "—"}</td>
                    <td>{g.contrato.resolucion || "—"}</td>
                    <td>{g.items.length}</td>
                    <td style={{ fontWeight: 700 }}>{fmtMoney(g.total)}</td>
                    <td style={{ color: "#8A8578", fontSize: 11 }}>{expandidos[g.contrato.id] ? "▲ ocultar" : "▼ ver detalle"}</td>
                  </tr>
                  {expandidos[g.contrato.id] && (
                    <tr>
                      <td colSpan={7} style={{ background: "#FBFAF7", padding: "12px 16px" }}>
                        <table>
                          <thead><tr><th>Período</th><th>Monto teórico</th><th>N° Factura cargado</th><th>Monto cargado</th></tr></thead>
                          <tbody>
                            {g.items.map((f, i) => (
                              <tr key={i}>
                                <td>{fmtDate(f.periodo.desde)} al {fmtDate(f.periodo.hasta)}</td>
                                <td style={{ fontWeight: 700 }}>{fmtMoney(f.periodo.canon)}</td>
                                <td>{f.guardado?.numero_factura || "—"}</td>
                                <td>{f.guardado?.monto_cargado ? fmtMoney(f.guardado.monto_cargado) : "—"}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

// =================================================================
// PROYECCIÓN — estimado de canon por rango de meses (usa último índice conocido para el futuro)
// =================================================================
function ProyeccionView({ contratos, indices, jurisdicciones }) {
  const MESES_NOMBRE = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
  const hoy = new Date();
  const [desdeMes, setDesdeMes] = useState(hoy.getMonth());
  const [desdeAnio, setDesdeAnio] = useState(hoy.getFullYear());
  const [hastaMes, setHastaMes] = useState(() => (hoy.getMonth() + 5) % 12);
  const [hastaAnio, setHastaAnio] = useState(() => hoy.getFullYear() + Math.floor((hoy.getMonth() + 5) / 12));
  const [fJur, setFJur] = useState("Todas");
  const [expandidos, setExpandidos] = useState({});
  const toggleExpandido = (id) => setExpandidos((e) => ({ ...e, [id]: !e[id] }));

  const AÑOS = [hoy.getFullYear() - 1, hoy.getFullYear(), hoy.getFullYear() + 1, hoy.getFullYear() + 2, hoy.getFullYear() + 3];
  const desde = new Date(desdeAnio, desdeMes, 1);
  const hasta = new Date(hastaAnio, hastaMes + 1, 0);

  const filas = useMemo(() => {
    return contratos.filter((c) => fJur === "Todas" || c.jurisdiccion_codigo === fJur).map((c) => {
      const periodos = calcularPeriodos(c, indices, hasta);
      const enRango = periodos.filter((p) => p.hasta >= desde && p.desde <= hasta);
      const total = enRango.reduce((s, p) => s + p.canon, 0);
      return { contrato: c, meses: enRango.length, total, periodos: enRango };
    }).filter((f) => f.meses > 0);
  }, [contratos, indices, desde, hasta, fJur]);

  const totalGeneral = filas.reduce((s, f) => s + f.total, 0);

  const exportarExcel = () => {
    const data = [];
    filas.forEach((f) => {
      f.periodos.forEach((p) => {
        data.push({
          "N° contrato": f.contrato.numero_contrato || "", "Dependencia": f.contrato.dependencias?.nombre || "",
          "Inmueble": f.contrato.inmueble, "Locador": f.contrato.locador || "", "Resolución": f.contrato.resolucion || "", "Desde": p.desde.toISOString().slice(0, 10), "Hasta": p.hasta.toISOString().slice(0, 10),
          "Etapa": p.etapa === "inicial" ? "Período inicial fijo" : (p.confirmado ? "Ajustado" : "Estimado, no confirmado"),
          "Índice ICL": p.indice, "Canon del período": p.canon,
        });
      });
      data.push({ "N° contrato": f.contrato.numero_contrato || "", "Dependencia": f.contrato.dependencias?.nombre || "", "Etapa": "Subtotal contrato", "Canon del período": f.total });
      data.push({});
    });
    data.push({ "N° contrato": "TOTAL GENERAL", "Canon del período": totalGeneral });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Proyección");
    XLSX.writeFile(wb, `proyeccion-${desdeAnio}${String(desdeMes+1).padStart(2,"0")}-a-${hastaAnio}${String(hastaMes+1).padStart(2,"0")}.xlsx`);
  };

  const selectStyle = { ...inputStyle, width: "auto" };

  return (
    <>
      <header style={{ marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 10 }}>
        <div>
          <h1 className="serif" style={{ fontSize: 24, margin: 0, fontWeight: 600 }}>Proyección de canon</h1>
          <p style={{ fontSize: 13, color: "#8A8578", margin: "5px 0 0" }}>Usa el índice ICL conocido; para meses futuros sin índice, toma el último publicado</p>
        </div>
        <button onClick={exportarExcel} style={{ padding: "9px 16px", borderRadius: 8, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>⬇ Descargar Excel</button>
      </header>

      <div style={{ display: "flex", gap: 10, marginBottom: 18, flexWrap: "wrap", alignItems: "center" }}>
        <label style={{ fontSize: 12.5, fontWeight: 600, color: "#5C5748" }}>Desde</label>
        <select value={desdeMes} onChange={(e) => setDesdeMes(Number(e.target.value))} style={selectStyle}>{MESES_NOMBRE.map((m, i) => <option key={m} value={i}>{m}</option>)}</select>
        <select value={desdeAnio} onChange={(e) => setDesdeAnio(Number(e.target.value))} style={selectStyle}>{AÑOS.map((a) => <option key={a} value={a}>{a}</option>)}</select>
        <label style={{ fontSize: 12.5, fontWeight: 600, color: "#5C5748" }}>Hasta</label>

        </div>
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 9, padding: "13px 15px" }}>
          <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>Total proyectado</div>

                    <td style={{ fontWeight: 700 }}>{fmtMoney(f.total)}</td>

}

// =================================================================
// ÍNDICES ICL (pegar tabla completa)
// =================================================================
function IndicesView({ indices, onCambio }) {
  const [texto, setTexto] = useState("");
  const [mensaje, setMensaje] = useState("");
  const [guardando, setGuardando] = useState(false);

  const importar = async () => {
    setGuardando(true); setMensaje("");
    try {
      const filas = texto.trim().split("\n").map((linea) => {
        const partes = linea.split(/\t|;/).map((s) => s.trim());
        if (partes.length < 2) return null;
        let [fecha, valor] = partes;
        if (fecha.includes("/")) {
          const [d, m, y] = fecha.split("/");
          fecha = `${y.length === 2 ? "20" + y : y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
        }
        valor = parseFloat(valor.replace(",", "."));
        if (!fecha || isNaN(valor)) return null;
        return { fecha, valor };
      }).filter(Boolean);

      if (filas.length === 0) { setMensaje("No se pudo interpretar ninguna fila. Formato esperado: fecha [tab/coma] valor, una por línea."); setGuardando(false); return; }

      const { error } = await db.from("indices_icl").insert(filas);
      if (error) throw error;
      setMensaje(`Se cargaron ${filas.length} valores correctamente.`);
      setTexto("");
      onCambio();
    } catch (e) { setMensaje("Error: " + e.message); }
    finally { setGuardando(false); }
  };

  return (
    <>
      <h1 className="serif" style={{ fontSize: 24, margin: "0 0 6px", fontWeight: 600 }}>Índices ICL</h1>
      <p style={{ fontSize: 13, color: "#8A8578", margin: "0 0 18px" }}>Pegá una tabla completa (fecha y valor, una fila por línea) copiada desde tu Excel, o cargá un valor a la vez.</p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 380px", gap: 20 }}>
        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 18 }}>
          <label style={{ fontSize: 11, fontWeight: 600, color: "#8A8578", textTransform: "uppercase" }}>Pegar tabla (fecha [tab o coma] valor, una por línea)</label>
          <textarea value={texto} onChange={(e) => setTexto(e.target.value)} rows={8} placeholder={"2026-04-20\t185.12\n2026-05-20\t188.43"}
            style={{ width: "100%", marginTop: 6, padding: 10, borderRadius: 7, border: "1px solid #E4E1D8", fontSize: 13, fontFamily: "monospace", boxSizing: "border-box" }} />
          {mensaje && <div style={{ marginTop: 10, fontSize: 12.5, color: mensaje.startsWith("Error") ? "#B54B3A" : "#4A7856" }}>{mensaje}</div>}
          <button onClick={importar} disabled={guardando || !texto.trim()} style={{ marginTop: 12, padding: "9px 18px", borderRadius: 7, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            {guardando ? "Cargando…" : "Importar tabla"}
          </button>
        </div>

        <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, overflow: "hidden", maxHeight: 340, overflowY: "auto" }}>
          <table>
            <thead><tr><th>Fecha</th><th>Índice</th></tr></thead>
            <tbody>
              {[...indices].reverse().map((i) => (
                <tr key={i.fecha}><td>{fmtDate(i.fecha)}</td><td style={{ fontWeight: 600 }}>{Number(i.valor).toFixed(4)}</td></tr>
              ))}
              {indices.length === 0 && <tr><td colSpan={2} style={{ textAlign: "center", color: "#8A8578" }}>Sin valores cargados todavía</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

// DEPENDENCIAS
// =================================================================
function DependenciasView({ jurisdicciones, dependencias, contratos: contratosAlq, ocGestiones = [], estadosTramite, onCambio }) {
  const contratos = [...contratosAlq, ...ocGestiones];
  const [nueva, setNueva] = useState({});
  const [nuevoEstado, setNuevoEstado] = useState("");
  const [guardandoEstado, setGuardandoEstado] = useState(false);
  const [depEditId, setDepEditId] = useState(null);
  const [depEditValor, setDepEditValor] = useState("");
  const [estEditId, setEstEditId] = useState(null);
  const [estEditValor, setEstEditValor] = useState("");

  const agregar = async (codigo) => {
    const nombre = (nueva[codigo] || "").trim();
    if (!nombre) return;
    const { error } = await db.from("dependencias").insert({ nombre, jurisdiccion_codigo: codigo });
    if (error) { alert("Error: " + error.message); return; }
    setNueva((n) => ({ ...n, [codigo]: "" }));
    onCambio();
  };
  const guardarDep = async (d) => {
    const nombre = depEditValor.trim();
    if (!nombre) return;
    const { error } = await db.from("dependencias").update({ nombre }).eq("id", d.id);
    if (error) { alert("Error: " + error.message); return; }
    setDepEditId(null);
    onCambio();
  };
  const eliminarDep = async (d) => {
    const count = contratos.filter((c) => c.dependencia_id === d.id).length;
    if (count > 0) { alert(`No se puede eliminar "${d.nombre}": tiene ${count} contrato(s) o gestión(es) asociado(s). Reasignalos a otra dependencia primero.`); return; }
    if (!confirm(`¿Eliminar la dependencia "${d.nombre}"?`)) return;
    const { error } = await db.from("dependencias").delete().eq("id", d.id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };

  const agregarEstado = async () => {
    const nombre = nuevoEstado.trim();
    if (!nombre) return;
    setGuardandoEstado(true);
    const { error } = await db.from("estados_tramite").insert({ nombre });
    setGuardandoEstado(false);
    if (error) { alert("Error: " + error.message); return; }
    setNuevoEstado("");
    onCambio();
  };
  const guardarEstado = async (e) => {
    const nombreNuevo = estEditValor.trim();
    if (!nombreNuevo) return;
    if (nombreNuevo === e.nombre) { setEstEditId(null); return; }
    const { error } = await db.from("estados_tramite").update({ nombre: nombreNuevo }).eq("id", e.id);
    if (error) { alert("Error: " + error.message); return; }
    if (ocGestiones.some((g) => g.estado_tramite === e.nombre)) {
      const { error: e3 } = await db.from("oc_gestiones").update({ estado_tramite: nombreNuevo }).eq("estado_tramite", e.nombre);
      if (e3) { alert("Hubo un error actualizando las otras contrataciones que usaban ese estado: " + e3.message); }
    }
    const afectados = contratosAlq.filter((c) => c.estado_tramite === e.nombre);
    if (afectados.length > 0) {
      const { error: e2 } = await db.from("contratos").update({ estado_tramite: nombreNuevo }).eq("estado_tramite", e.nombre);
      if (e2) { alert("El estado se renombró, pero hubo un error actualizando los contratos que lo usaban: " + e2.message); }
    }
    setEstEditId(null);
    onCambio();
  };
  const eliminarEstado = async (e) => {
    const count = contratos.filter((c) => c.estado_tramite === e.nombre).length;
    const aviso = count > 0 ? `\n\n${count} contrato(s) tienen este estado cargado — van a conservar el texto "${e.nombre}", pero ya no vas a poder elegirlo de la lista.` : "";
    if (!confirm(`¿Eliminar el estado de trámite "${e.nombre}"?${aviso}`)) return;
    const { error } = await db.from("estados_tramite").delete().eq("id", e.id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };

  return (
    <>
      <h1 className="serif" style={{ fontSize: 24, margin: "0 0 18px", fontWeight: 600 }}>Jurisdicciones, dependencias y trámite</h1>

      <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 18, marginBottom: 20 }}>
        <div className="serif" style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>Estados de trámite</div>
        <p style={{ fontSize: 12, color: "#8A8578", marginBottom: 10 }}>Las etapas que podés asignar a un contrato mientras se gestiona (ej. "Solicitud enviada", "Dictamen legal", "Resolución en firma"). Se van agregando sobre la marcha.</p>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
          {estadosTramite.map((e) => {
            const count = contratos.filter((c) => c.estado_tramite === e.nombre).length;
            if (estEditId === e.id) {
              return (
                <span key={e.id} style={{ display: "flex", alignItems: "center", gap: 5, padding: "4px 6px 4px 10px", borderRadius: 999, background: "#fff", border: "1px solid #1B2A4A" }}>
                  <input autoFocus value={estEditValor} onChange={(ev) => setEstEditValor(ev.target.value)} style={{ border: "none", outline: "none", fontSize: 12.5, width: 140 }} />
                  <button onClick={() => guardarEstado(e)} style={{ border: "none", background: "#1B2A4A", color: "#fff", borderRadius: 999, width: 20, height: 20, fontSize: 11, cursor: "pointer" }}>✓</button>
                  <button onClick={() => setEstEditId(null)} style={{ border: "none", background: "none", color: "#B0AB9C", fontSize: 14, cursor: "pointer" }}>×</button>
                </span>
              );
            }
            return (
              <span key={e.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 8px 6px 12px", borderRadius: 999, background: "#F6F5F2", border: "1px solid #E4E1D8", fontSize: 12.5 }}>
                {e.nombre} <span style={{ color: "#8A8578" }}>({count})</span>
                <button onClick={() => { setEstEditId(e.id); setEstEditValor(e.nombre); }} title="Editar" style={{ border: "none", background: "none", color: "#8A8578", cursor: "pointer", fontSize: 12, padding: "0 2px" }}>✎</button>
                <button onClick={() => eliminarEstado(e)} title="Eliminar" style={{ border: "none", background: "none", color: "#B0AB9C", cursor: "pointer", fontSize: 14, padding: "0 2px" }}>×</button>
              </span>
            );
          })}
          {estadosTramite.length === 0 && <span style={{ fontSize: 12.5, color: "#8A8578" }}>Todavía no cargaste ningún estado.</span>}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <input placeholder="Agregar nuevo estado de trámite…" value={nuevoEstado} onChange={(e) => setNuevoEstado(e.target.value)} style={{ ...inputStyle, maxWidth: 280 }} />
          <button onClick={agregarEstado} disabled={guardandoEstado} style={{ padding: "8px 16px", borderRadius: 7, border: "1px solid #1B2A4A", background: "#fff", color: "#1B2A4A", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>+ Agregar</button>
        </div>
      </div>

      {jurisdicciones.map((j) => {
        const deps = dependencias.filter((d) => d.jurisdiccion_codigo === j.codigo);
        return (
          <div key={j.codigo} style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 18, marginBottom: 14 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
              <span style={{ fontSize: 12, fontWeight: 700, background: "#1B2A4A", color: "#fff", padding: "3px 10px", borderRadius: 6 }}>Jur. {j.codigo}</span>
              <span className="serif" style={{ fontSize: 15, fontWeight: 600 }}>{j.nombre}</span>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
              {deps.map((d) => {
                const count = contratos.filter((c) => c.dependencia_id === d.id).length;
                if (depEditId === d.id) {
                  return (
                    <span key={d.id} style={{ display: "flex", alignItems: "center", gap: 5, padding: "4px 6px 4px 10px", borderRadius: 999, background: "#fff", border: "1px solid #1B2A4A" }}>
                      <input autoFocus value={depEditValor} onChange={(ev) => setDepEditValor(ev.target.value)} style={{ border: "none", outline: "none", fontSize: 12.5, width: 160 }} />
                      <button onClick={() => guardarDep(d)} style={{ border: "none", background: "#1B2A4A", color: "#fff", borderRadius: 999, width: 20, height: 20, fontSize: 11, cursor: "pointer" }}>✓</button>
                      <button onClick={() => setDepEditId(null)} style={{ border: "none", background: "none", color: "#B0AB9C", fontSize: 14, cursor: "pointer" }}>×</button>
                    </span>
                  );
                }
                return (
                  <span key={d.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 8px 6px 12px", borderRadius: 999, background: "#F6F5F2", border: "1px solid #E4E1D8", fontSize: 12.5 }}>
                    {d.nombre} <span style={{ color: "#8A8578" }}>({count})</span>
                    <button onClick={() => { setDepEditId(d.id); setDepEditValor(d.nombre); }} title="Editar" style={{ border: "none", background: "none", color: "#8A8578", cursor: "pointer", fontSize: 12, padding: "0 2px" }}>✎</button>
                    <button onClick={() => eliminarDep(d)} title="Eliminar" style={{ border: "none", background: "none", color: "#B0AB9C", cursor: "pointer", fontSize: 14, padding: "0 2px" }}>×</button>
                  </span>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <input placeholder="Agregar nueva dependencia…" value={nueva[j.codigo] || ""} onChange={(e) => setNueva((n) => ({ ...n, [j.codigo]: e.target.value }))} style={{ ...inputStyle, maxWidth: 280 }} />
              <button onClick={() => agregar(j.codigo)} style={{ padding: "8px 16px", borderRadius: 7, border: "1px solid #1B2A4A", background: "#fff", color: "#1B2A4A", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>+ Agregar</button>
            </div>
          </div>
        );
      })}
    </>
  );
}

// =================================================================
// OTRAS CONTRATACIONES — constantes, utilidades y cálculos
// =================================================================
const OC_TIPOS_CONTRATACION = ["Licitación pública", "Licitación privada", "Concurso de precios", "Contratación directa", "Convenio marco", "Legítimo abono", "Art. 140"];
const OC_MODALIDADES = { mensual: "Mensual", cantidad: "Por cantidad", hitos: "Por hitos" };
const OC_REGLAS_TC = { dia_anterior: "BNA día anterior a la factura", dia_factura: "BNA día de la factura" };
const OC_TIPOS_DOC = { norma: "Norma legal", contrato: "Contrato", otro: "Otro" };
let ocKeySeq = 0;
const ocKey = () => "k" + (++ocKeySeq);
const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
// Interpreta montos escritos a la argentina ("16.206.000,50") o con punto decimal ("1385.5").
function ocNum(v) {
  if (v === null || v === undefined) return 0;
  if (typeof v === "number") return isNaN(v) ? 0 : v;
  let s = String(v).trim().replace(/U\$S|USD|\$|\s/gi, "");
  if (!s) return 0;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, "");
  else if (/^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace(".", "");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
const fmtNum = (n, dec = 2) => Number(n || 0).toLocaleString("es-AR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
const fmtCant = (n) => Number(n || 0).toLocaleString("es-AR", { maximumFractionDigits: 2 });
const fmtMon = (n, moneda) => (moneda === "USD" ? "U$S " + fmtNum(n) : fmtMoney(n));
const aInput = (n) => (n === null || n === undefined || n === "") ? "" : String(n).replace(".", ",");
const isoLocal = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hoyISO = () => isoLocal(new Date());

function ocRangos(nums) {
  const s = [...nums].sort((a, b) => a - b);
  const out = [];
  let i = 0;
  while (i < s.length) {
    let j = i;
    while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;
    out.push(i === j ? `${s[i]}` : `${s[i]}–${s[j]}`);
    i = j + 1;
  }
  return out.join(", ");
}
function ocMesRango(g, n) {
  if (!g.fecha_inicio) return null;
  return { desde: addMonthsClamp(g.fecha_inicio, n - 1), hasta: addDays(addMonthsClamp(g.fecha_inicio, n), -1) };
}
function ocFin(g) {
  return g.fecha_inicio && g.plazo_meses ? addDays(addMonthsClamp(g.fecha_inicio, Number(g.plazo_meses)), -1) : null;
}
function ocValorMes(tramos, mes) {
  const t = tramos.find((x) => mes >= x.desde_mes && mes <= x.hasta_mes);
  return t ? Number(t.valor_mensual || 0) : 0;
}
function ocMesesItem(tramos) {
  return tramos.reduce((m, t) => Math.max(m, Number(t.hasta_mes || 0)), 0);
}
// Períodos de facturación de un ítem mensual.
// Sin proporcional: un período por mes de contrato (del día de inicio al día anterior del mes siguiente), a valor completo.
// Proporcional por días reales: un período por mes calendario. Cada parte vale (valor mensual / días reales del mes) × días
// de prestación, contando el primero y el último. Si un mes tiene cambio de valor, se suman las dos partes.
// Nunca se paga más que el total adjudicado: si la suma lo superara, el último período se ajusta.
function ocPeriodosItem(g, it) {
  const tramos = [...(it.tramos || [])].sort((a, b) => a.desde_mes - b.desde_mes);
  const M = ocMesesItem(tramos);
  const nominal = round2(tramos.reduce((s, t) => s + (t.hasta_mes - t.desde_mes + 1) * Number(t.valor_mensual || 0), 0));
  if (!it.proporcional) {
    const periodos = [];
    for (let m = 1; m <= M; m++) {
      const rg = g.fecha_inicio ? ocMesRango(g, m) : null;
      periodos.push({ n: m, desde: rg ? rg.desde : null, hasta: rg ? rg.hasta : null, monto: ocValorMes(tramos, m), partes: null });
    }
    return { periodos, total: nominal, nominal, requiereInicio: false };
  }
  if (!g.fecha_inicio || M === 0) return { periodos: [], total: nominal, nominal, requiereInicio: !g.fecha_inicio };
  const segs = tramos.map((t) => ({
    desde: addMonthsClamp(g.fecha_inicio, t.desde_mes - 1), hasta: addDays(addMonthsClamp(g.fecha_inicio, t.hasta_mes), -1), valor: Number(t.valor_mensual || 0),
  }));
  const ini = parseDateLocal(g.fecha_inicio);
  const fin = addDays(addMonthsClamp(g.fecha_inicio, M), -1);
  const periodos = [];
  let y = ini.getFullYear(), mo = ini.getMonth(), n = 0;
  while (new Date(y, mo, 1) <= fin) {
    const dm = new Date(y, mo + 1, 0).getDate();
    const mIni = new Date(y, mo, 1), mFin = new Date(y, mo, dm);
    const partes = [];
    segs.forEach((sg) => {
      const d = sg.desde > mIni ? sg.desde : mIni;
      const h = sg.hasta < mFin ? sg.hasta : mFin;
      if (d <= h) {
        const dias = Math.round((h - d) / 86400000) + 1;
        partes.push({ desde: d, hasta: h, dias, diasMes: dm, valor: sg.valor, monto: round2(sg.valor / dm * dias) });
      }
    });
    if (partes.length) {
      n++;
      periodos.push({
        n, desde: partes[0].desde, hasta: partes[partes.length - 1].hasta, partes,
        monto: round2(partes.reduce((s, p) => s + p.monto, 0)), completo: partes.length === 1 && partes[0].dias === dm,
      });
    }
    mo++; if (mo > 11) { mo = 0; y++; }
  }
  let total = round2(periodos.reduce((s, p) => s + p.monto, 0));
  if (total > nominal + 0.001 && periodos.length) {
    const exceso = round2(total - nominal);
    const ult = periodos[periodos.length - 1];
    ult.monto = round2(ult.monto - exceso); ult.ajuste = exceso;
    total = nominal;
  }
  return { periodos, total, nominal, requiereInicio: false };
}
function ocDetallePeriodo(p, moneda) {
  if (!p.partes) return "Mes completo";
  if (p.completo) return "Mes completo";
  const txt = p.partes.map((x) => `${x.desde.getDate()} al ${x.hasta.getDate()}: ${x.dias}/${x.diasMes} de ${fmtMon(x.valor, moneda)}`).join(" + ");
  return p.ajuste ? `${txt} (ajustado −${fmtNum(p.ajuste)} para no superar el adjudicado)` : txt;
}
// Regla general: TC vendedor BNA del día anterior a la factura. Si ese día no hubo cotización
// (fin de semana o feriado), se toma el último día anterior que sí tenga valor cargado.
function ocBuscarTC(tcs, fecha, regla) {
  if (!fecha) return null;
  const cands = tcs.filter((t) => (regla === "dia_factura" ? t.fecha <= fecha : t.fecha < fecha));
  return cands.length ? cands[cands.length - 1] : null;
}
// Trae todas las filas de una tabla en tandas de 1000 (límite de Supabase por consulta).
async function ocSelectTodo(tabla, orden) {
  let desde = 0, todo = [];
  while (true) {
    const { data, error } = await db.from(tabla).select("*").order(orden, { ascending: true }).range(desde, desde + 999);
    if (error) throw error;
    todo = todo.concat(data || []);
    if (!data || data.length < 1000) break;
    desde += 1000;
  }
  return todo;
}
async function ocSubirDocumento(gestionId, file, tipo) {
  const limpio = file.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9._-]/g, "_");
  const ruta = `gestion_${gestionId}/${Date.now()}_${limpio}`;
  const { error } = await db.storage.from("documentos").upload(ruta, file, { contentType: file.type || "application/pdf" });
  if (error) throw error;
  const { error: e2 } = await db.from("oc_documentos").insert({ gestion_id: gestionId, tipo, nombre: file.name, ruta });
  if (e2) throw e2;
}

// Resumen completo de una gestión: ítems con avance, facturas, preventivos, saldos y estado.
function ocResumen(g, data) {
  const items = data.items.filter((i) => i.gestion_id === g.id).sort((a, b) => (a.orden || 0) - (b.orden || 0) || a.id - b.id);
  const facturas = data.facturas.filter((f) => f.gestion_id === g.id);
  const facIds = new Set(facturas.map((f) => f.id));
  const lineas = data.lineas.filter((l) => facIds.has(l.factura_id));
  const imps = data.imputaciones.filter((i) => facIds.has(i.factura_id));

  const itemsRes = items.map((it) => {
    const tramos = data.tramos.filter((t) => t.item_id === it.id).sort((a, b) => a.desde_mes - b.desde_mes);
    const hitos = data.hitos.filter((h) => h.item_id === it.id).sort((a, b) => (a.numero || 0) - (b.numero || 0) || a.id - b.id);
    const ls = lineas.filter((l) => l.item_id === it.id);
    const per = it.modalidad === "mensual" ? ocPeriodosItem(g, { ...it, tramos }) : null;
    const nominal = per ? per.nominal : round2(Number(it.cantidad || 0) * Number(it.precio_unitario || 0));
    const total = per ? per.total : nominal;
    const devengado = round2(ls.reduce((s, l) => s + Number(l.monto_moneda || 0), 0));
    let avance;
    if (it.modalidad === "mensual") {
      if (per.requiereInicio) {
        avance = { hechos: 0, total: 0, pendientes: [], sinInicio: true, texto: "Falta la fecha de inicio para armar los períodos" };
      } else {
        const meses = per.periodos.length;
        const cub = new Set();
        ls.forEach((l) => { if (l.mes_desde) for (let m = l.mes_desde; m <= (l.mes_hasta || l.mes_desde); m++) cub.add(m); });
        const pendientes = [];
        for (let m = 1; m <= meses; m++) if (!cub.has(m)) pendientes.push(m);
        avance = { hechos: meses - pendientes.length, total: meses, pendientes, texto: `${meses - pendientes.length} de ${meses} ${it.proporcional ? "períodos" : "meses"}` };
      }
    } else if (it.modalidad === "cantidad") {
      const hechos = ls.reduce((s, l) => s + Number(l.cantidad || 0), 0);
      const tot = Number(it.cantidad || 0);
      avance = { hechos, total: tot, pendienteCant: Math.max(0, tot - hechos), texto: `${fmtCant(hechos)} de ${fmtCant(tot)} ${it.unidad || ""}`.trim() };
    } else {
      const usados = new Set(ls.map((l) => l.hito_id).filter(Boolean));
      const pend = hitos.filter((h) => !usados.has(h.id));
      avance = { hechos: hitos.length - pend.length, total: hitos.length, pendientesHitos: pend, texto: `${hitos.length - pend.length} de ${hitos.length} hitos` };
    }
    const pct = avance.total > 0 ? Math.min(1, avance.hechos / avance.total) : 0;
    return { ...it, tramos, hitos, lineas: ls, total, nominal, periodos: per ? per.periodos : [], devengado, saldo: round2(total - devengado), avance, pct };
  });

  const facturasRes = facturas.map((f) => {
    const fl = lineas.filter((l) => l.factura_id === f.id);
    const fi = imps.filter((i) => i.factura_id === f.id);
    const totalMoneda = round2(fl.reduce((s, l) => s + Number(l.monto_moneda || 0), 0));
    const totalPesos = g.moneda === "USD" ? round2(totalMoneda * Number(f.tc || 0)) : totalMoneda;
    const imputado = round2(fi.reduce((s, i) => s + Number(i.monto_pesos || 0), 0));
    return { ...f, lineas: fl, imputaciones: fi, totalMoneda, totalPesos, imputado, descuadre: Math.abs(imputado - totalPesos) > 0.01 };
  }).sort((a, b) => (b.fecha_factura || "").localeCompare(a.fecha_factura || "") || b.id - a.id);

  const prevRes = data.preventivos.filter((p) => p.gestion_id === g.id).map((p) => {
    const dev = round2(imps.filter((i) => i.preventivo_id === p.id).reduce((s, i) => s + Number(i.monto_pesos || 0), 0));
    return { ...p, devengado: dev, saldo: round2(Number(p.monto || 0) - dev) };
  }).sort((a, b) => (a.anio || 0) - (b.anio || 0) || String(a.fuente || "").localeCompare(String(b.fuente || "")) || a.id - b.id);

  const contratado = round2(itemsRes.reduce((s, i) => s + i.total, 0));
  const adjudicado = round2(itemsRes.reduce((s, i) => s + i.nominal, 0));
  const devengado = round2(itemsRes.reduce((s, i) => s + i.devengado, 0));
  const saldo = round2(contratado - devengado);
  const devengadoPesos = round2(facturasRes.reduce((s, f) => s + f.totalPesos, 0));
  const totalPreventivos = round2(prevRes.reduce((s, p) => s + Number(p.monto || 0), 0));
  const saldoPreventivos = round2(prevRes.reduce((s, p) => s + p.saldo, 0));
  const ultimoTC = data.tc.length ? data.tc[data.tc.length - 1] : null;
  const pendientePesosEst = g.moneda === "USD" ? (ultimoTC ? round2(saldo * Number(ultimoTC.vendedor)) : null) : saldo;
  const insuficiente = saldo > 0.01 && pendientePesosEst !== null && pendientePesosEst > saldoPreventivos + 0.01;
  const fin = ocFin(g);
  const hoy = new Date();
  let estado;
  if (contratado === 0) estado = { label: "Sin ítems", tone: "navy" };
  else if (saldo > 0.01 && fin && fin < hoy) estado = { label: "Vencida con saldo", tone: "critico" };
  else if (facturas.length === 0) estado = { label: "Sin iniciar", tone: "navy" };
  else if (saldo > 0.01) estado = { label: "En ejecución", tone: "alerta" };
  else if (facturasRes.some((f) => !f.fecha_pago)) estado = { label: "Devengada · pendiente de pago", tone: "alerta" };
  else estado = { label: "Completa", tone: "ok" };

  return {
    g, items: itemsRes, facturas: facturasRes, preventivos: prevRes, contratado, adjudicado, devengado, saldo,
    pct: contratado > 0 ? Math.min(1, devengado / contratado) : 0, devengadoPesos, totalPreventivos, saldoPreventivos,
    ultimoTC, pendientePesosEst, insuficiente, fin, estado,
    documentos: data.documentos.filter((d) => d.gestion_id === g.id),
  };
}

const OC_RUBRO_CLAVES = [
  { claves: ["vigilancia", "seguridad"], buscar: ["seguridad", "vigilancia"] },
  { claves: ["limpieza"], buscar: ["limpieza"] },
  { claves: ["comunicaciones", "tetra", "radio", "telefon"], buscar: ["comunicacion"] },
  { claves: ["servicios profesionales", "h/h", "horas hombre", "consultoria"], buscar: ["servicios profesionales", "profesional"] },
  { claves: ["almacenamiento", "storage", "software", "licencia", "servidor", "informatic", "equipamiento"], buscar: ["tecnologia", "informatica"] },
  { claves: ["mantenimiento"], buscar: ["mantenimiento"] },
];
function ocFormatoCUIT(s) {
  const d = soloDigitos(s);
  return d.length === 11 ? `${d.slice(0, 2)}-${d.slice(2, 10)}-${d.slice(10)}` : s;
}
function ocLimpiarNombre(s) {
  return s.replace(/[“"][^”"]*(?:AÑO|Año|año)[^”"]*[”"]/g, " ").replace(/[“”"]/g, "").replace(/\s+/g, " ").replace(/^[\s,;:-]+|[\s,;:-]+$/g, "").trim();
}
function ocAMayusculaInicial(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function ocAnalizarPDF(docsCrudos, { dependencias, rubros }) {
  const docs = docsCrudos.map(prepararDocumento);
  const legibles = docs.filter((d) => !d.escaneado);
  const escaneados = docs.filter((d) => d.escaneado).map((d) => d.nombre);
  const campos = [];
  const add = (key, label, r, mostrar) => campos.push({ key, label, valor: r ? r.valor : "", mostrar: r ? (mostrar ? mostrar(r.valor) : String(r.valor)) : "", origen: r ? r.origen : "", aceptar: !!r });
  const enUtil = (fn) => primero(legibles, (d) => fn(d.util, d));
  const enTodo = (fn) => primero(legibles, (d) => fn(d.plano, d));
  // la parte del artículo 1° (hasta el artículo 2°), donde están adjudicación, montos y renglones
  const art1 = (d) => { const u = d.util; const i = u.search(/ART[IÍ]CULO\s*2/i); return i > 0 ? u.slice(0, i) : u.slice(0, 6000); };

  // Norma: del nombre del archivo GDE (el número no siempre viene en el texto) o del texto
  add("norma_legal", "Norma legal", primero(legibles, (d) => {
    const m = d.nombre.match(/\b(DEC|RES|RESCONJ|RESOL|DISPO)-\d{4}-\d{5,8}-APPSF-PE/i);
    if (m) return m[0].toUpperCase();
    const t = d.plano.slice(0, 800).match(/\b(?:DEC|RES|RESCONJ|DISPO)-\d{4}-\d{5,8}-APPSF-PE/);
    if (t) return t[0];
    const v = d.plano.slice(0, 400).match(/DECRETO\s*N\s*[º°o]?\s*\.?\s*(\d{2,5})/i);
    if (v) { const a = d.plano.slice(0, 400).match(/\b(20\d{2})\b/); return `Decreto N° ${v[1]}${a ? "/" + a[1] : ""}`; }
    return null;
  }));
  // Expediente
  add("expediente", "Expediente", enTodo((t) => {
    const ee = t.match(/EE-\d{4}-\d{5,8}-APPSF-PE/);
    if (ee) return ee[0];
    const ex = t.match(/Expediente\s+N\s*[º°o]?\s*\.?\s*(\d{5}-\d{6,8}-\d)/i) || t.match(/Referencia:\s*(\d{5}-\d{6,8}-\d)/i);
    return ex ? ex[1] : null;
  }));
  // Tipo de contratación (primero en la parte dispositiva)
  const tipo = (t) => {
    if (/convenio\s+marco/i.test(t)) return "Convenio marco";
    if (/licitaci[oó]n\s+p[uú]blica/i.test(t)) return "Licitación pública";
    if (/licitaci[oó]n\s+privada/i.test(t)) return "Licitación privada";
    if (/concurso\s+de\s+precios/i.test(t)) return "Concurso de precios";
    if (/\bCD-\d{4}|contrataci[oó]n\s+directa/i.test(t)) return "Contratación directa";
    if (/leg[ií]timo\s+abono/i.test(t)) return "Legítimo abono";
    return null;
  };
  // "Convenio marco" se busca en todo el texto (a veces solo aparece en los vistos); el resto, primero en el artículo 1°
  add("tipo_contratacion", "Tipo de contratación", enTodo((t) => (/convenio\s+marco/i.test(t) ? "Convenio marco" : null)) || enUtil((u, d) => tipo(art1(d))) || enTodo(tipo));
  // Proveedor y CUIT
  const prov = enUtil((u, d) => {
    const a = art1(d);
    const m = a.match(/a\s+favor\s+de\s+la\s+firma\s+(.{2,220}?)\s*,?\s*C\.?\s*U\.?\s*I\.?\s*T\.?\s*N?\s*[º°]?\s*:?\s*(\d{2}-?\d{8}-?\d)/i)
      || a.match(/adjud[ií]case\s+a\s+(?:la\s+firma\s+)?(.{2,220}?)\s*,?\s*C\.?\s*U\.?\s*I\.?\s*T\.?\s*N?\s*[º°]?\s*:?\s*(\d{2}-?\d{8}-?\d)/i);
    return m ? { nombre: ocLimpiarNombre(m[1]), cuit: ocFormatoCUIT(m[2]) } : null;
  });
  add("proveedor", "Proveedor", prov ? { valor: prov.valor.nombre, origen: prov.origen } : null);
  add("cuit", "CUIT", prov ? { valor: prov.valor.cuit, origen: prov.origen } : null);
  // Objeto: de los vistos (suelen describirlo limpio) o del artículo 1°
  const objeto = enTodo((t) => {
    const re = /(?:promueve|tramita|gestiona)\s+(?:la\s+)?(?:urgente\s+)?(?:gesti[oó]n\s+para\s+la\s+)?((?:contrataci[oó]n|adquisici[oó]n|provisi[oó]n|prestaci[oó]n)\b.{10,260}?)(?=,?\s+(?:con\s+destino|bajo\s+la\s+modalidad|para\s+distintas|para\s+las?\s|compuesto|a\s+favor|por\s+un|por\s+el|;|,\s*provisi))/i;
    const m = t.match(re);
    return m ? ocAMayusculaInicial(m[1].trim().replace(/[,;]$/, "")) : null;
  }) || enUtil((u, d) => {
    const m = art1(d).match(/por\s+la\s+(prestaci[oó]n\s+de\s+.{10,250}?)(?=,\s*por\s+el\s+t[eé]rmino|,\s*con\s+un\s+costo|,\s*por\s+la\s+suma)/i);
    return m ? ocAMayusculaInicial(m[1]) : null;
  });
  add("objeto", "Objeto", objeto);
  // Moneda y regla de tipo de cambio
  const moneda = enUtil((u, d) => (/U\$S|U\$D|USD|D[ÓO]LARES/i.test(art1(d)) ? "USD" : "ARS"));
  add("moneda", "Moneda", moneda, (v) => (v === "USD" ? "USD (dólares)" : "$ (pesos)"));
  if (moneda && moneda.valor === "USD") {
    add("regla_tc", "Tipo de cambio", enTodo((t) => {
      if (/d[ií]a\s+anterior/i.test(t) && /Naci[oó]n/i.test(t)) return "dia_anterior";
      if (/(?:al|del)\s+d[ií]a\s+de\s+(?:la\s+)?(?:emisi[oó]n\s+de\s+la\s+)?factura/i.test(t)) return "dia_factura";
      return null;
    }), (v) => OC_REGLAS_TC[v]);
  }
  // Monto total: "suma/costo total de ... ($ x)" o, si no, el mayor importe del artículo 1°
  add("monto_norma", "Monto de la norma", enUtil((u, d) => {
    const a = art1(d);
    const m = a.match(/(?:suma|costo|monto)\s+total\s+de\s+[^()]{0,260}?\(\s*(?:U\$S|U\$D|USD|\$)\s*([\d.]+,\d{2})\s*\)/i);
    if (m) return ocNum(m[1]);
    const montos = (a.match(/\d{1,3}(?:\.\d{3})+,\d{2}|\d{1,3},\d{2}/g) || []).map(ocNum);
    return montos.length ? Math.max(...montos) : null;
  }), (v) => fmtNum(v));
  // Plazo
  add("plazo_meses", "Plazo (meses)", enUtil((u, d) => {
    const a = art1(d);
    const m = a.match(/t[eé]rmino\s+(?:de\s+)?(?:[a-záéíóú]+\s+)?\(?(\d{1,3})\)?\s+meses/i) || a.match(/plazo\s+de\s+(?:[a-záéíóú]+\s+)?\(?(\d{1,3})\)?\s+meses/i);
    return m ? m[1] : null;
  }));
  // Dependencia: el nombre de dependencia cargada más largo que aparezca en el texto
  const todo = normTxt(legibles.map((d) => d.plano).join(" "));
  const dep = [...dependencias].filter((d) => normTxt(d.nombre).length >= 4 && todo.includes(normTxt(d.nombre))).sort((a, b) => b.nombre.length - a.nombre.length)[0];
  add("dependencia_id", "Dependencia", dep ? { valor: String(dep.id), origen: "texto de los documentos", jur: dep.jurisdiccion_codigo } : null, () => dep.nombre);
  // Rubro sugerido por palabras clave del objeto (o del artículo 1°)
  // primero con el objeto solo; si no alcanza, con el artículo 1°
  const buscarRubro = (texto) => {
    const base = normTxt(texto);
    for (const r of OC_RUBRO_CLAVES) {
      if (r.claves.some((k) => base.includes(k))) {
        const enc = rubros.find((x) => r.buscar.some((b) => normTxt(x.nombre).includes(b)));
        if (enc) return enc.nombre;
      }
    }
    return null;
  };
  const rubroTxt = (objeto && buscarRubro(objeto.valor)) || (legibles[0] && buscarRubro(art1(legibles[0]).slice(0, 1500)));
  const rubro = rubroTxt ? { valor: rubroTxt, origen: "palabras clave del objeto" } : null;
  add("rubro", "Rubro (sugerido)", rubro);
  // Fuente de financiamiento (para sugerir el preventivo)
  add("fuente", "Fuente de financiamiento", enTodo((t) => { const m = t.match(/Fuente(?:\s+de\s+Financiamiento)?\s*:?\s*(\d{3})\b/i); return m ? m[1] : null; }),
    (v) => `${v} (agrega un preventivo sin monto)`);

  // Renglones
  const renglones = [];
  legibles.forEach((d) => {
    const a = art1(d);
    // a) Por cantidad: "1-1 15 Tester, según ... 1920 h/h 45,00 USD 86.400,00 USD"
    const reCant = /(\d+-\d+|\b\d{1,3})\s+(\d{1,3})\s+([A-ZÁÉÍÓÚ][^$]{2,200}?)\s+(\d[\d.]*)\s+(h\/h|hs\.?|horas|unidades|u\.|módulos|modulos|meses)\s+([\d.]+,\d{2})\s*(?:USD|U\$S|\$)?\s+([\d.]+,\d{2})/gi;
    let m;
    while ((m = reCant.exec(a))) {
      const cant = ocNum(m[4]), pu = ocNum(m[6]), tot = ocNum(m[7]);
      if (!(cant > 0 && pu > 0) || Math.abs(cant * pu - tot) > Math.max(1, tot * 0.001)) continue;
      renglones.push({ key: ocKey(), modalidad: "cantidad", renglon: m[2], item: m[1], descripcion: m[3].split(/,\s*seg[uú]n/i)[0].trim(), cantidad: cant, unidad: m[5].toLowerCase(), precio_unitario: pu, total: tot, aceptar: true, origen: d.nombre });
    }
    // b) Mensual: "Servicio ... por los primeros seis (6) meses ... $ 16.206.000,00 x ... $ 97.236.000,00"
    const reMes = /([A-ZÁÉÍÓÚ][^$]{10,400}?)\s*\$\s*([\d.]+,\d{2})(?:\s*x[^$]{0,25}?)?\s*\$\s*([\d.]+,\d{2})/g;
    const mensuales = [];
    while ((m = reMes.exec(a))) {
      let desc = m[1];
      if (!/mes/i.test(desc)) continue;
      const v = ocNum(m[2]), t = ocNum(m[3]);
      const n = v > 0 ? Math.round(t / v) : 0;
      if (!(n >= 1 && n <= 120) || Math.abs(n * v - t) > 1) continue;
      const romanos = [...desc.matchAll(/(?:^|\s)((?:[IVX]{1,4}\s+)+)(?=[A-ZÁÉÍÓÚ][a-záéíóú])/g)];
      let item = "";
      if (romanos.length) { const r = romanos[romanos.length - 1]; item = r[1].trim().split(/\s+/).pop(); desc = desc.slice(r.index + r[0].length); }
      const base = desc.replace(/,?\s*por\s+los?\s+(?:primeros|segundos|terceros|[uú]ltimos|siguientes)?\s*(?:[a-záéíóú]+\s+)?\(?\d*\)?\s*meses.*$/i, "").replace(/,?\s*s\/\s*Anexo.*$/i, "").trim();
      mensuales.push({ item, descripcion: base, meses: n, valor: v, origen: d.nombre });
    }
    mensuales.forEach((x) => {
      const ult = renglones[renglones.length - 1];
      if (ult && ult.modalidad === "mensual" && normTxt(ult.descripcion) === normTxt(x.descripcion)) {
        const desde = ult.tramos[ult.tramos.length - 1].hasta + 1;
        ult.tramos.push({ desde, hasta: desde + x.meses - 1, valor: x.valor });
        ult.total = round2(ult.total + x.meses * x.valor);
      } else {
        renglones.push({ key: ocKey(), modalidad: "mensual", renglon: "", item: x.item, descripcion: x.descripcion, tramos: [{ desde: 1, hasta: x.meses, valor: x.valor }], total: round2(x.meses * x.valor), aceptar: true, origen: x.origen });
      }
    });
  });
  return { campos, renglones, escaneados, documentos: docs.map((d) => ({ nombre: d.nombre, escaneado: d.escaneado })) };
}

// =================================================================
// TABLERO DE CONTROL — alquileres y otras contrataciones juntos
// =================================================================
function TableroView({ contratos, ocResumenes, rubros, jurisdicciones, dependencias, estadosTramite, onAbrirOC, onAbrirAlq, onNueva, onCambio }) {
  const [fTipo, setFTipo] = useState("todos");
  const [fRubro, setFRubro] = useState("Todos");
  const [fDep, setFDep] = useState("Todas");
  const [fEstado, setFEstado] = useState("Todos");
  const [fVence, setFVence] = useState("");
  const [fTexto, setFTexto] = useState("");
  const [fRapido, setFRapido] = useState(null);
  const [orden, setOrden] = useState({ col: "vence", asc: true });
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const diasHasta = (d) => (d ? Math.round((d - hoy) / 86400000) : null);
  const depNom = (id) => dependencias.find((d) => d.id === id)?.nombre || "—";

  const filas = [
    ...contratos.map((c) => {
      const v = fechaVencimiento(c);
      const est = estadoContrato(c);
      return {
        key: "a" + c.id, tipo: "alq", id: c.id, rubro: "Alquiler de inmueble", objeto: c.inmueble || "Locación de inmueble", proveedor: c.locador || "",
        dep: c.dependencias?.nombre || depNom(c.dependencia_id), depId: c.dependencia_id, jur: c.jurisdiccion_codigo,
        inicio: c.fecha_inicio ? parseDateLocal(c.fecha_inicio) : null, vence: v, dias: diasHasta(v), pct: null, saldo: null, moneda: "ARS",
        estado: est, tramite: c.estado_tramite || "", activa: est.label !== "Vencido", porVencer: est.label === "En plazo de preaviso", vencida: est.label === "Vencido",
        insuficiente: false, sinPagar: 0, texto: [c.inmueble, c.locador, c.expediente, c.resolucion, c.numero_contrato].join(" "),
      };
    }),
    ...ocResumenes.map((r) => {
      const d = diasHasta(r.fin);
      const completa = r.estado.label === "Completa";
      return {
        key: "o" + r.g.id, tipo: "oc", id: r.g.id, rubro: r.g.rubro || "", objeto: r.g.objeto || "—", proveedor: r.g.proveedor || "",
        dep: depNom(r.g.dependencia_id), depId: r.g.dependencia_id, jur: r.g.jurisdiccion_codigo,
        inicio: r.g.fecha_inicio ? parseDateLocal(r.g.fecha_inicio) : null, vence: r.fin, dias: d, pct: r.pct, saldo: r.saldo, moneda: r.g.moneda,
        estado: r.estado, tramite: r.g.estado_tramite || "", activa: !completa && r.estado.label !== "Vencida con saldo",
        porVencer: !completa && d !== null && d >= 0 && d <= 120, vencida: r.estado.label === "Vencida con saldo",
        insuficiente: r.insuficiente, sinPagar: r.facturas.filter((f) => !f.fecha_pago).length,
        texto: [r.g.objeto, r.g.proveedor, r.g.expediente, r.g.norma_legal, r.g.numero_interno, r.g.cuit].join(" "),
      };
    }),
  ];

  const kpi = {
    activas: filas.filter((f) => f.activa).length,
    porVencer: filas.filter((f) => f.porVencer).length,
    vencidas: filas.filter((f) => f.vencida).length,
    insuf: filas.filter((f) => f.insuficiente).length,
    sinPagar: filas.reduce((s, f) => s + f.sinPagar, 0),
    devARS: round2(ocResumenes.filter((r) => r.g.moneda !== "USD").reduce((s, r) => s + r.saldo, 0)),
    devUSD: round2(ocResumenes.filter((r) => r.g.moneda === "USD").reduce((s, r) => s + r.saldo, 0)),
  };

  const rubrosLista = [...new Set(filas.map((f) => f.rubro || "Sin rubro"))].sort();
  const estadosLista = [...new Set(filas.map((f) => f.estado.label))].sort();
  const filtradas = filas.filter((f) => {
    if (fTipo !== "todos" && f.tipo !== fTipo) return false;
    if (fRubro !== "Todos" && (f.rubro || "Sin rubro") !== fRubro) return false;
    if (fDep !== "Todas" && String(f.depId) !== fDep) return false;
    if (fEstado !== "Todos" && f.estado.label !== fEstado) return false;
    if (fVence === "vencidas" && !f.vencida) return false;
    if ((fVence === "30" || fVence === "120") && !(f.dias !== null && f.dias >= 0 && f.dias <= Number(fVence) && f.estado.label !== "Completa")) return false;
    if (fRapido === "activas" && !f.activa) return false;
    if (fRapido === "porVencer" && !f.porVencer) return false;
    if (fRapido === "vencidas" && !f.vencida) return false;
    if (fRapido === "insuf" && !f.insuficiente) return false;
    if (fRapido === "sinPagar" && !f.sinPagar) return false;
    if (fRapido === "aDevengar" && !(f.tipo === "oc" && f.saldo > 0.01)) return false;
    if (fTexto.trim() && !normTxt(f.texto + " " + f.dep).includes(normTxt(fTexto))) return false;
    return true;
  });
  const valorOrden = (f, col) => ({
    tipo: f.tipo, rubro: f.rubro || "zzz", objeto: normTxt(f.objeto), inicio: f.inicio ? f.inicio.getTime() : null,
    vence: f.vence ? f.vence.getTime() : null, pct: f.pct, saldo: f.saldo, estado: f.estado.label, dep: normTxt(f.dep),
  }[col]);
  const ordenadas = [...filtradas].sort((a, b) => {
    const va = valorOrden(a, orden.col), vb = valorOrden(b, orden.col);
    if (va === null || va === undefined) return 1;
    if (vb === null || vb === undefined) return -1;
    const r = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb));
    return orden.asc ? r : -r;
  });
  const th = (col, label, alinear) => (
    <th onClick={() => setOrden((o) => ({ col, asc: o.col === col ? !o.asc : true }))} style={{ cursor: "pointer", whiteSpace: "nowrap", textAlign: alinear || "left" }}>
      {label} {orden.col === col ? (orden.asc ? "▲" : "▼") : "↕"}
    </th>
  );
  const badgeVence = (f) => {
    if (!f.vence) return null;
    if (f.tipo === "oc" && f.estado.label === "Completa") return <Badge tone="ok">Completa</Badge>;
    if (f.dias < 0) return <Badge tone="critico">Vencida</Badge>;
    return <Badge tone={f.dias <= 120 ? "alerta" : "ok"}>{f.dias} días</Badge>;
  };
  const abrir = (f) => (f.tipo === "alq" ? onAbrirAlq(f.id) : onAbrirOC(f.id));
  const cambiarTramite = async (f, valor) => {
    const { error } = await db.from(f.tipo === "alq" ? "contratos" : "oc_gestiones").update({ estado_tramite: valor || null }).eq("id", f.id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };
  const cambiarRubro = async (f, valor) => {
    const { error } = await db.from("oc_gestiones").update({ rubro: valor || null }).eq("id", f.id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };
  const exportarExcel = () => {
    const datos = ordenadas.map((f) => ({
      "Tipo": f.tipo === "alq" ? "Alquiler" : "Otra contratación", "Rubro": f.rubro, "Objeto / inmueble": f.objeto, "Proveedor / locador": f.proveedor,
      "Jurisdicción": f.jur ?? "", "Dependencia": f.dep, "Inicio": f.inicio ? fmtDate(f.inicio) : "", "Vencimiento": f.vence ? fmtDate(f.vence) : "",
      "Días al vencimiento": f.dias ?? "", "Ejecución %": f.pct !== null ? Math.round(f.pct * 100) : "", "Moneda": f.tipo === "oc" ? f.moneda : "",
      "Saldo a devengar": f.saldo ?? "", "Estado": f.estado.label, "Trámite": f.tramite, "Preventivo insuficiente": f.insuficiente ? "Sí" : "",
    }));
    const ws = XLSX.utils.json_to_sheet(datos);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Tablero");
    XLSX.writeFile(wb, `tablero-contratos-${hoyISO()}.xlsx`);
  };
  const kpiBox = (clave, label, valor, color, sub) => (
    <button onClick={() => setFRapido(fRapido === clave ? null : clave)} style={{ textAlign: "left", background: fRapido === clave ? "#E6EAF2" : "#fff", border: `1px solid ${fRapido === clave ? "#1B2A4A" : "#EDEBE3"}`, borderRadius: 10, padding: "10px 12px", cursor: "pointer", fontFamily: "Inter, sans-serif" }}>
      <div style={{ fontSize: 10.5, color: "#8A8578", fontWeight: 600, textTransform: "uppercase" }}>{label}</div>
      <div style={{ fontSize: 20, fontWeight: 600, color: color || "#1B2A4A", marginTop: 2 }}>{valor}</div>
      {sub && <div style={{ fontSize: 11.5, color: "#1B2A4A", fontWeight: 600 }}>{sub}</div>}
    </button>
  );
  const proximos = filas.filter((f) => f.vence && f.estado.label !== "Completa" && f.dias <= 120 && f.dias >= -365).sort((a, b) => a.dias - b.dias).slice(0, 8);
  const porRubro = Object.values(ocResumenes.reduce((acc, r) => {
    const k = r.g.rubro || "Sin rubro";
    acc[k] = acc[k] || { rubro: k, n: 0, suma: 0 };
    acc[k].n++; acc[k].suma += r.pct;
    return acc;
  }, {})).map((x) => ({ ...x, pct: x.n ? x.suma / x.n : 0 })).sort((a, b) => a.rubro.localeCompare(b.rubro));
  const depsFiltro = dependencias;

  return (
    <>
      <header style={{ marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 10 }}>
        <div>
          <h1 className="serif" style={{ fontSize: 24, margin: 0, fontWeight: 600 }}>Tablero de control</h1>
          <p style={{ fontSize: 13, color: "#8A8578", margin: "5px 0 0" }}>{contratos.length} alquileres · {ocResumenes.length} otras contrataciones</p>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={exportarExcel} style={ocBtn2}>⬇ Descargar Excel</button>
          {onNueva && <button onClick={onNueva} style={ocBtn}>+ Nueva gestión</button>}
        </div>
      </header>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 8, marginBottom: 14 }}>
        {kpiBox("activas", "Activas", kpi.activas)}
        {kpiBox("porVencer", "Vencen en 120 días", kpi.porVencer, "#9A6B1E")}
        {kpiBox("vencidas", "Vencidas", kpi.vencidas, "#9C3F2E")}
        {kpiBox("insuf", "Preventivo insuficiente", kpi.insuf, "#9C3F2E")}
        {kpiBox("sinPagar", "Facturas sin pagar", kpi.sinPagar)}
        {kpiBox("aDevengar", "A devengar", null, null, <>{fmtMoney(kpi.devARS)}{kpi.devUSD > 0 && <div>U$S {fmtNum(kpi.devUSD)}</div>}</>)}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 12, marginBottom: 14 }}>
        <div style={{ ...ocCard, marginBottom: 0 }}>
          <div style={ocH2}>Próximos vencimientos</div>
          {proximos.length === 0 && <div style={{ fontSize: 13, color: "#8A8578" }}>Nada vence en los próximos 120 días.</div>}
          {proximos.map((f) => (
            <div key={f.key} onClick={() => abrir(f)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, padding: "5px 0", borderBottom: "1px solid #F1EFE9", cursor: "pointer", fontSize: 13 }}>
              <span>{f.objeto} <span style={{ color: "#8A8578", fontSize: 12 }}>· {f.tipo === "alq" ? "Alquiler" : f.rubro || "Sin rubro"} · {fmtDate(f.vence)}</span></span>
              {badgeVence(f)}
            </div>
          ))}
        </div>
        <div style={{ ...ocCard, marginBottom: 0 }}>
          <div style={ocH2}>Ejecución promedio por rubro (otras contrataciones)</div>
          {porRubro.length === 0 && <div style={{ fontSize: 13, color: "#8A8578" }}>Sin gestiones cargadas.</div>}
          {porRubro.map((x) => (
            <div key={x.rubro} onClick={() => setFRubro(fRubro === x.rubro ? "Todos" : x.rubro)} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0", cursor: "pointer", fontSize: 13 }}>
              <span style={{ width: 160, fontWeight: fRubro === x.rubro ? 700 : 400 }}>{x.rubro} <span style={{ color: "#8A8578", fontSize: 11.5 }}>({x.n})</span></span>
              <div style={{ flex: 1 }}>{ocBarra(x.pct)}</div>
              <span style={{ fontSize: 12, color: "#8A8578", width: 36, textAlign: "right" }}>{Math.round(x.pct * 100)}%</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap", alignItems: "center" }}>
        <select value={fTipo} onChange={(e) => setFTipo(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
          <option value="todos">Alquileres y otras</option><option value="alq">Solo alquileres</option><option value="oc">Solo otras contrataciones</option>
        </select>
        <select value={fRubro} onChange={(e) => setFRubro(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
          <option value="Todos">Todo rubro</option>
          {rubrosLista.map((r) => <option key={r} value={r}>{r}</option>)}
        </select>
        <select value={fDep} onChange={(e) => setFDep(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
          <option value="Todas">Toda dependencia</option>
          {depsFiltro.map((d) => <option key={d.id} value={String(d.id)}>{d.nombre}</option>)}
        </select>
        <select value={fEstado} onChange={(e) => setFEstado(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
          <option value="Todos">Todo estado</option>
          {estadosLista.map((e) => <option key={e} value={e}>{e}</option>)}
        </select>
        <select value={fVence} onChange={(e) => setFVence(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
          <option value="">Vence: cualquier fecha</option><option value="30">Próximos 30 días</option><option value="120">Próximos 120 días</option><option value="vencidas">Vencidas</option>
        </select>
        <input placeholder="Buscar…" value={fTexto} onChange={(e) => setFTexto(e.target.value)} style={{ ...inputStyle, width: 180 }} />
        {fRapido && <button onClick={() => setFRapido(null)} style={{ ...ocBtn2, fontSize: 12 }}>Quitar filtro del indicador ×</button>}
        <span style={{ fontSize: 12, color: "#8A8578", marginLeft: "auto" }}>{ordenadas.length} de {filas.length}</span>
      </div>

      <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, overflowX: "auto" }}>
        <table>
          <thead><tr>{th("rubro", "Rubro")}{th("objeto", "Objeto / proveedor")}{th("dep", "Dependencia")}{th("inicio", "Inicio")}{th("vence", "Vence")}{th("pct", "Ejecución")}{th("saldo", "Saldo", "right")}{th("estado", "Estado")}<th>Trámite</th></tr></thead>
          <tbody>
            {ordenadas.map((f) => (
              <tr key={f.key} onClick={() => abrir(f)} style={{ cursor: "pointer" }}>
                <td onClick={(e) => f.tipo === "oc" && e.stopPropagation()} style={{ minWidth: 130 }}>
                  {f.tipo === "alq" ? <span style={{ fontSize: 12.5 }}>Alquiler</span> : (
                    <select value={f.rubro} onChange={(e) => cambiarRubro(f, e.target.value)} style={{ ...inputStyle, padding: "4px 6px", fontSize: 12 }}>
                      <option value="">Sin rubro</option>
                      {rubros.map((r) => <option key={r.id} value={r.nombre}>{r.nombre}</option>)}
                      {f.rubro && !rubros.some((r) => r.nombre === f.rubro) && <option value={f.rubro}>{f.rubro}</option>}
                    </select>
                  )}
                </td>
                <td>
                  <div style={{ fontWeight: 600 }}>{f.objeto}</div>
                  <div style={{ fontSize: 12, color: "#8A8578" }}>{f.proveedor}</div>
                </td>
                <td style={{ fontSize: 12.5 }}>{f.dep}<div style={{ fontSize: 11, color: "#B0AB9C" }}>Jur. {f.jur ?? "—"}</div></td>
                <td style={{ whiteSpace: "nowrap", fontSize: 12.5 }}>{f.inicio ? fmtDate(f.inicio) : "A definir"}</td>
                <td style={{ whiteSpace: "nowrap", fontSize: 12.5 }}>{f.vence ? fmtDate(f.vence) : "—"}<div style={{ marginTop: 3 }}>{badgeVence(f)}</div></td>
                <td style={{ minWidth: 90 }}>{f.pct !== null ? <>{ocBarra(f.pct)}<div style={ocMini}>{Math.round(f.pct * 100)}%</div></> : <span style={ocMini}>—</span>}</td>
                <td style={{ textAlign: "right", whiteSpace: "nowrap", fontSize: 12.5 }}>{f.saldo !== null ? fmtMon(f.saldo, f.moneda) : "—"}</td>
                <td>
                  <Badge tone={f.estado.tone}>{f.estado.label}</Badge>
                  {f.insuficiente && <div style={{ marginTop: 4 }}><Badge tone="critico">Preventivo insuficiente</Badge></div>}
                </td>
                <td onClick={(e) => e.stopPropagation()} style={{ minWidth: 140 }}>
                  <select value={f.tramite} onChange={(e) => cambiarTramite(f, e.target.value)} style={{ ...inputStyle, padding: "4px 6px", fontSize: 12 }}>
                    <option value="">Sin definir</option>
                    {estadosTramite.map((e) => <option key={e.id} value={e.nombre}>{e.nombre}</option>)}
                    {f.tramite && !estadosTramite.some((e) => e.nombre === f.tramite) && <option value={f.tramite}>{f.tramite}</option>}
                  </select>
                </td>
              </tr>
            ))}
            {ordenadas.length === 0 && <tr><td colSpan={9} style={{ textAlign: "center", color: "#8A8578", padding: 30 }}>{filas.length === 0 ? "Todavía no hay contratos cargados." : "Ningún contrato coincide con estos filtros."}</td></tr>}
          </tbody>
        </table>
      </div>
    </>
  );
}

// =================================================================
// CONFIG — rubros de otras contrataciones
// =================================================================
function OCRubrosCard({ rubros, ocGestiones, onCambio }) {
  const [nuevo, setNuevo] = useState("");
  const [editId, setEditId] = useState(null);
  const [editValor, setEditValor] = useState("");
  const agregar = async () => {
    const nombre = nuevo.trim();
    if (!nombre) return;
    const { error } = await db.from("oc_rubros").insert({ nombre });
    if (error) { alert("Error: " + error.message); return; }
    setNuevo(""); onCambio();
  };
  const guardar = async (r) => {
    const nombre = editValor.trim();
    if (!nombre || nombre === r.nombre) { setEditId(null); return; }
    const { error } = await db.from("oc_rubros").update({ nombre }).eq("id", r.id);
    if (error) { alert("Error: " + error.message); return; }
    if (ocGestiones.some((g) => g.rubro === r.nombre)) {
      const { error: e2 } = await db.from("oc_gestiones").update({ rubro: nombre }).eq("rubro", r.nombre);
      if (e2) alert("El rubro se renombró, pero hubo un error actualizando las gestiones que lo usaban: " + e2.message);
    }
    setEditId(null); onCambio();
  };
  const eliminar = async (r) => {
    const n = ocGestiones.filter((g) => g.rubro === r.nombre).length;
    if (!confirm(`¿Eliminar el rubro "${r.nombre}"?${n ? `\n\n${n} gestión(es) lo tienen cargado: van a conservar el texto, pero ya no vas a poder elegirlo de la lista.` : ""}`)) return;
    const { error } = await db.from("oc_rubros").delete().eq("id", r.id);
    if (error) { alert("Error: " + error.message); return; }
    onCambio();
  };
  return (
    <div style={{ background: "#fff", border: "1px solid #EDEBE3", borderRadius: 10, padding: 18, marginBottom: 20 }}>
      <div className="serif" style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>Rubros de otras contrataciones</div>
      <p style={{ fontSize: 12, color: "#8A8578", marginBottom: 10 }}>Para clasificar las gestiones (limpieza, seguridad, mantenimiento…). Si renombrás uno, se actualiza en todas las gestiones que lo usan.</p>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
        {rubros.map((r) => {
          const n = ocGestiones.filter((g) => g.rubro === r.nombre).length;
          if (editId === r.id) return (
            <span key={r.id} style={{ display: "flex", alignItems: "center", gap: 5, padding: "4px 6px 4px 10px", borderRadius: 999, background: "#fff", border: "1px solid #1B2A4A" }}>
              <input autoFocus value={editValor} onChange={(e) => setEditValor(e.target.value)} style={{ border: "none", outline: "none", fontSize: 12.5, width: 160 }} />
              <button onClick={() => guardar(r)} style={{ border: "none", background: "#1B2A4A", color: "#fff", borderRadius: 999, width: 20, height: 20, fontSize: 11, cursor: "pointer" }}>✓</button>
              <button onClick={() => setEditId(null)} style={{ border: "none", background: "none", color: "#B0AB9C", fontSize: 14, cursor: "pointer" }}>×</button>
            </span>
          );
          return (
            <span key={r.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 8px 6px 12px", borderRadius: 999, background: "#F6F5F2", border: "1px solid #E4E1D8", fontSize: 12.5 }}>
              {r.nombre} <span style={{ color: "#8A8578" }}>({n})</span>
              <button onClick={() => { setEditId(r.id); setEditValor(r.nombre); }} title="Editar" style={{ border: "none", background: "none", color: "#8A8578", cursor: "pointer", fontSize: 12, padding: "0 2px" }}>✎</button>
              <button onClick={() => eliminar(r)} title="Eliminar" style={{ border: "none", background: "none", color: "#B0AB9C", cursor: "pointer", fontSize: 14, padding: "0 2px" }}>×</button>
            </span>
          );
        })}
        {rubros.length === 0 && <span style={{ fontSize: 12.5, color: "#8A8578" }}>Todavía no hay rubros. ¿Ejecutaste el script de base de datos?</span>}
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <input placeholder="Agregar nuevo rubro…" value={nuevo} onChange={(e) => setNuevo(e.target.value)} style={{ ...inputStyle, maxWidth: 280 }} />
        <button onClick={agregar} style={{ padding: "8px 16px", borderRadius: 7, border: "1px solid #1B2A4A", background: "#fff", color: "#1B2A4A", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>+ Agregar</button>
      </div>
    </div>
  );
}

// =================================================================
// OTRAS CONTRATACIONES — alta y edición de gestión
// =================================================================
function OCFormView({ gestion, data, jurisdicciones, dependencias, estadosTramite, rubros = [], onGuardado, onCancelar }) {
  const esEdicion = !!gestion;
  const [c, setC] = useState(() => ({
    gestion_anterior_id: gestion?.gestion_anterior_id ? String(gestion.gestion_anterior_id) : "",
    numero_interno: gestion?.numero_interno || "", expediente: gestion?.expediente || "", norma_legal: gestion?.norma_legal || "",
    tipo_contratacion: gestion?.tipo_contratacion || "",
    jurisdiccion_codigo: gestion?.jurisdiccion_codigo != null ? String(gestion.jurisdiccion_codigo) : "",
    dependencia_id: gestion?.dependencia_id != null ? String(gestion.dependencia_id) : "",
    proveedor: gestion?.proveedor || "", cuit: gestion?.cuit || "", objeto: gestion?.objeto || "",
    moneda: gestion?.moneda || "ARS", regla_tc: gestion?.regla_tc || "dia_anterior",
    fecha_inicio: gestion?.fecha_inicio || "", plazo_meses: gestion?.plazo_meses != null ? String(gestion.plazo_meses) : "",
    monto_norma: aInput(gestion?.monto_norma), estado_tramite: gestion?.estado_tramite || (estadosTramite[0]?.nombre || ""),
    observaciones: gestion?.observaciones || "", rubro: gestion?.rubro || "",
  }));
  const [items, setItems] = useState(() => {
    if (!gestion) return [];
    return data.items.filter((i) => i.gestion_id === gestion.id).sort((a, b) => (a.orden || 0) - (b.orden || 0) || a.id - b.id).map((it) => ({
      key: ocKey(), id: it.id, renglon: it.renglon || "", item: it.item || "", descripcion: it.descripcion || "", modalidad: it.modalidad, proporcional: !!it.proporcional,
      cantidad: aInput(it.cantidad), unidad: it.unidad || "", precio_unitario: aInput(it.precio_unitario),
      total: it.modalidad === "hitos" ? aInput(round2(Number(it.cantidad || 0) * Number(it.precio_unitario || 0))) : "",
      tramos: data.tramos.filter((t) => t.item_id === it.id).sort((a, b) => a.desde_mes - b.desde_mes)
        .map((t) => ({ key: ocKey(), desde: String(t.desde_mes), hasta: String(t.hasta_mes), valor: aInput(t.valor_mensual) })),
      hitos: data.hitos.filter((h) => h.item_id === it.id).sort((a, b) => (a.numero || 0) - (b.numero || 0) || a.id - b.id)
        .map((h) => ({ key: ocKey(), id: h.id, descripcion: h.descripcion || "", porcentaje: aInput(h.porcentaje), monto: aInput(h.monto) })),
    }));
  });
  const [prevs, setPrevs] = useState([]);
  const [docs, setDocs] = useState([]);
  const [docTipo, setDocTipo] = useState("norma");
  const [aviso, setAviso] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [pdfProp, setPdfProp] = useState(null);
  const [pdfArchivos, setPdfArchivos] = useState([]);
  const [pdfLeyendo, setPdfLeyendo] = useState(false);
  const [pdfMsg, setPdfMsg] = useState("");
  const [pdfAdjuntar, setPdfAdjuntar] = useState(true);
  const [verPeriodos, setVerPeriodos] = useState({});

  const set = (campo, valor) => setC((x) => ({ ...x, [campo]: valor }));

  // ---- Precarga desde PDF ----
  const leerPDFs = async (files) => {
    if (!files.length) return;
    setPdfLeyendo(true); setPdfMsg(""); setPdfProp(null);
    try {
      const leidos = [];
      for (const f of files) { try { leidos.push(await leerTextoPDF(f)); } catch (e) { /* PDF ilegible: se informa abajo */ } }
      if (!leidos.length) { setPdfMsg("No se pudo leer ningún archivo. Verificá que sean PDF válidos y sin contraseña."); return; }
      const prop = ocAnalizarPDF(leidos, { dependencias, rubros });
      if (prop.escaneados.length === leidos.length) { setPdfMsg("Los PDF parecen escaneados (imagen, sin texto): cargá los datos a mano. Igual se pueden adjuntar a la gestión."); }
      setPdfArchivos(files);
      setPdfProp(prop);
    } finally { setPdfLeyendo(false); }
  };
  const togglePdfCampo = (key) => setPdfProp((p) => ({ ...p, campos: p.campos.map((x) => (x.key === key ? { ...x, aceptar: !x.aceptar } : x)) }));
  const togglePdfRenglon = (key) => setPdfProp((p) => ({ ...p, renglones: p.renglones.map((x) => (x.key === key ? { ...x, aceptar: !x.aceptar } : x)) }));
  const aplicarPDF = () => {
    const ok = pdfProp.campos.filter((x) => x.aceptar && x.valor !== "" && x.valor !== null);
    const val = (k) => ok.find((x) => x.key === k);
    setC((x) => {
      const n = { ...x };
      ["norma_legal", "expediente", "tipo_contratacion", "proveedor", "cuit", "objeto", "moneda", "regla_tc", "plazo_meses", "rubro"].forEach((k) => { if (val(k)) n[k] = String(val(k).valor); });
      if (val("monto_norma")) n.monto_norma = aInput(val("monto_norma").valor);
      const dep = val("dependencia_id");
      if (dep) {
        const d = dependencias.find((z) => String(z.id) === dep.valor);
        if (d) { n.dependencia_id = String(d.id); n.jurisdiccion_codigo = String(d.jurisdiccion_codigo); }
      }
      return n;
    });
    const nuevos = pdfProp.renglones.filter((r) => r.aceptar).map((r) => ({
      key: ocKey(), id: null, renglon: r.renglon || "", item: r.item || "", descripcion: r.descripcion, modalidad: r.modalidad, proporcional: false,
      cantidad: r.modalidad === "cantidad" ? aInput(r.cantidad) : "", unidad: r.modalidad === "cantidad" ? r.unidad : "",
      precio_unitario: r.modalidad === "cantidad" ? aInput(r.precio_unitario) : "", total: "",
      tramos: r.modalidad === "mensual" ? r.tramos.map((t) => ({ key: ocKey(), desde: String(t.desde), hasta: String(t.hasta), valor: aInput(t.valor) })) : [],
      hitos: [],
    }));
    if (nuevos.length) setItems((xs) => [...xs, ...nuevos]);
    const fuente = val("fuente");
    if (fuente) setPrevs((ps) => (ps.some((p) => p.fuente === fuente.valor) ? ps : [...ps, { key: ocKey(), anio: String(new Date().getFullYear()), fuente: fuente.valor, numero: "", monto: "" }]));
    if (pdfAdjuntar) setDocs((ds) => [...ds, ...pdfArchivos.filter((f) => !ds.some((d) => d.file === f)).map((f) => ({ key: ocKey(), tipo: "norma", file: f }))]);
    setPdfProp(null);
    setAviso(`Se precargaron los datos${nuevos.length ? ` y ${nuevos.length} ítem(s)` : ""}. Revisalos antes de guardar.`);
  };
  const setItem = (key, patch) => setItems((xs) => xs.map((i) => (i.key === key ? { ...i, ...patch } : i)));
  const otras = data.gestiones.filter((g) => !gestion || g.id !== gestion.id);
  const depsJur = dependencias.filter((d) => !c.jurisdiccion_codigo || String(d.jurisdiccion_codigo) === c.jurisdiccion_codigo);

  const elegirAnterior = (val) => {
    const ant = data.gestiones.find((g) => String(g.id) === val);
    if (!ant || esEdicion) { set("gestion_anterior_id", val); return; }
    setC((x) => ({
      ...x, gestion_anterior_id: val, proveedor: ant.proveedor || "", cuit: ant.cuit || "", objeto: ant.objeto || "",
      jurisdiccion_codigo: ant.jurisdiccion_codigo != null ? String(ant.jurisdiccion_codigo) : "",
