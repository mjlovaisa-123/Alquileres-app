function parseDateLocal(input) {
  if (input instanceof Date) return new Date(input.getTime());
  if (typeof input === "string" && /^\d{4}-\d{2}-\d{2}/.test(input)) {
    const [y, m, d] = input.slice(0, 10).split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  return new Date(input);
}
function mesesPorPeriodicidad(p) {
  return { Mensual: 1, Bimestral: 2, Trimestral: 3, Cuatrimestral: 4, Semestral: 6, Anual: 12 }[p] || 3;
}
function addMonthsClamp(date, n) {
  const d = parseDateLocal(date);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return d;
}
function addDays(date, n) {
  const d = parseDateLocal(date);
  d.setDate(d.getDate() + n);
  return d;
}
function monthsBetween(a, b) {
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
}
function fechaVencimiento(contrato) {
  return addDays(addMonthsClamp(contrato.fecha_inicio, contrato.plazo_meses), -1);
}
function indiceAplicable(indices, fecha) {
  let aplicable = null;
  for (const i of indices) {
    if (parseDateLocal(i.fecha) <= fecha) aplicable = i;
    else break;
  }
  return aplicable;
}
// Genera todos los períodos de un contrato, con el canon histórico correcto.
// hastaMax (opcional): límite superior para el cálculo — por defecto hoy (para la ficha),
// pero se puede pasar una fecha futura para la Proyección.
function calcularPeriodos(contrato, indices, hastaMax) {
  if (!contrato.fecha_inicio || !contrato.plazo_meses || indices.length === 0) return [];
  const inicio = parseDateLocal(contrato.fecha_inicio);
  const vencimiento = fechaVencimiento(contrato);
  const tope = hastaMax || new Date();
  const limite = tope < vencimiento ? tope : vencimiento;
  const mesesIniciales = contrato.meses_periodo_inicial || mesesPorPeriodicidad(contrato.periodicidad_ajuste);
  const pasoPeriodicidad = mesesPorPeriodicidad(contrato.periodicidad_ajuste);
  const fechaPrimerAjuste = addMonthsClamp(inicio, mesesIniciales);
  const indiceBase = indiceAplicable(indices, inicio);
  if (!indiceBase) return [];
  const maxFechaIndice = parseDateLocal(indices[indices.length - 1].fecha);

  const periodos = [];
  let n = 0;
  while (true) {
    const desde = addMonthsClamp(inicio, n);
    if (desde > limite) break;
    const hasta = addDays(addMonthsClamp(inicio, n + 1), -1);
    let fechaAjusteAplicable, etapa;
    if (desde < fechaPrimerAjuste) {
      fechaAjusteAplicable = inicio;
      etapa = "inicial";
    } else {
      const pasos = Math.floor(monthsBetween(fechaPrimerAjuste, desde) / pasoPeriodicidad);
      fechaAjusteAplicable = addMonthsClamp(fechaPrimerAjuste, pasos * pasoPeriodicidad);
      etapa = "ajustado";
    }
    const idx = indiceAplicable(indices, fechaAjusteAplicable) || indiceBase;
    const canon = Math.round(contrato.canon_base * (idx.valor / indiceBase.valor) * 100) / 100;
    // confirmado: el período inicial siempre lo está (usa el ICL vigente al inicio del contrato);
    // uno ajustado lo está si su fecha de ajuste ya quedó cubierta por el último ICL cargado —
    // si no, se está calculando con el último índice conocido como estimación, no confirmado.
    const confirmado = etapa === "inicial" || fechaAjusteAplicable <= maxFechaIndice;
    periodos.push({
      desde, hasta, indice: idx.valor, canon, etapa, confirmado,
      // datos para mostrar el cálculo (tooltip)
      calc: {
        canonBase: Number(contrato.canon_base), fechaAjuste: fechaAjusteAplicable,
        indiceInicio: Number(indiceBase.valor), fechaIndiceInicio: indiceBase.fecha,
        indiceAjuste: Number(idx.valor), fechaIndiceAjuste: idx.fecha,
      },
    });
    n++;
  }
  return periodos;
}
// Proyección con ICL ficticio: independiente de los índices reales. Aplica un % de
// incremento hipotético (definido por el usuario) en cada fecha de ajuste hasta el
// vencimiento del contrato, para tener una estimación de presupuesto antes de que
// existan los índices reales (útil al iniciar un trámite nuevo o una renovación).
function calcularPeriodosFicticios(contrato, pct) {
  if (!contrato.fecha_inicio || !contrato.plazo_meses || pct === null || pct === undefined || pct === "") return [];
  const inicio = parseDateLocal(contrato.fecha_inicio);
  const vencimiento = fechaVencimiento(contrato);
  const mesesIniciales = contrato.meses_periodo_inicial || mesesPorPeriodicidad(contrato.periodicidad_ajuste);
  const pasoPeriodicidad = mesesPorPeriodicidad(contrato.periodicidad_ajuste);
  const fechaPrimerAjuste = addMonthsClamp(inicio, mesesIniciales);
  const factor = 1 + Number(pct) / 100;

  const periodos = [];
  let n = 0;
  while (true) {
    const desde = addMonthsClamp(inicio, n);
    if (desde > vencimiento) break;
    const hasta = addDays(addMonthsClamp(inicio, n + 1), -1);
    let etapa, incrementos;
    if (desde < fechaPrimerAjuste) {
      etapa = "inicial"; incrementos = 0;
    } else {
      etapa = "ajustado";
      incrementos = Math.floor(monthsBetween(fechaPrimerAjuste, desde) / pasoPeriodicidad) + 1;
    }
    const canon = Math.round(contrato.canon_base * Math.pow(factor, incrementos) * 100) / 100;
    periodos.push({ desde, hasta, canon, etapa, incrementos, calc: { ficticio: true, canonBase: Number(contrato.canon_base), pct: Number(pct), factor, incrementos } });
    n++;
  }
  return periodos;
}
function estadoContrato(contrato) {
  const venc = fechaVencimiento(contrato);

const MESES_TXT = { enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8, septiembre: 9, setiembre: 9, octubre: 10, noviembre: 11, diciembre: 12 };
const NUM_TXT = { un: 1, uno: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, dieciocho: 18, veinticuatro: 24, treinta: 30, "treinta y seis": 36 };
const PERIODICIDADES = ["Mensual", "Bimestral", "Trimestral", "Cuatrimestral", "Semestral", "Anual"];

function normTxt(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
}
function soloDigitos(s) { return (s || "").replace(/\D/g, ""); }
function numContrato(s) { return soloDigitos(s).replace(/^0+/, ""); }
function parseMonto(s) {
  if (!s) return null;
  const limpio = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(limpio);
  return isNaN(n) ? null : n;
}
function tituloSiMayus(s) {
  const t = s.replace(/\s+/g, " ").trim();
  if (t !== t.toUpperCase()) return t;
  return t.toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase());
}

// Lee el texto de un PDF con PDF.js. Devuelve { nombre, texto, paginas }.
async function leerTextoPDF(file) {
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  let texto = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const pagina = await pdf.getPage(i);
    const contenido = await pagina.getTextContent();
    texto += contenido.items.map((it) => it.str + (it.hasEOL ? "\n" : " ")).join("") + "\n";
  }
  return { nombre: file.name, texto, paginas: pdf.numPages };
}

// Prepara un documento: texto en una sola línea, tipo (resolución / contrato) y
// la "parte útil": en una resolución, solo lo que viene después de RESUELVE/DECRETA/DISPONE,
// porque los considerandos suelen citar los datos del contrato ANTERIOR.
function prepararDocumento(doc) {
  let plano = doc.texto.replace(/\s+/g, " ").replace(/(\d)\s*-\s+(\d)/g, "$1-$2").trim();
  const caracteres = plano.replace(/\s/g, "").length;
  const reDispositiva = /R\s?E\s?S\s?U\s?E\s?L\s?V\s?E\s?N?\s?:|D\s?E\s?C\s?R\s?E\s?T\s?A\s?:|D\s?I\s?S\s?P\s?O\s?N\s?E\s?N?\s?:/;
  const m = plano.match(reDispositiva);
  const esResolucion = !!m;
  const esContrato = !esResolucion && /PRIMERA\s*:/i.test(plano) && /LOCADOR/i.test(plano);
  return {
    ...doc, plano, caracteres,
    escaneado: caracteres < 150,
    tipo: esResolucion ? "resolución" : esContrato ? "contrato" : "documento",
    util: esResolucion ? plano.slice(m.index) : plano,
  };
}

// Busca el primer valor que devuelva `fn` recorriendo los documentos en orden de prioridad.
function primero(docs, fn) {
  for (const d of docs) {
    const v = fn(d);
    if (v !== null && v !== undefined && v !== "") return { valor: v, origen: d.nombre };
  }
  return null;
}

function extraerCanon(texto) {
  const reClave = /canon|precio de la locaci[oó]n|alquiler mensual|importe mensual/gi;
  let m;
  while ((m = reClave.exec(texto))) {
    const tramo = texto.slice(m.index, m.index + 450);
    const p = tramo.match(/\(\s*\$\s*([\d.]+(?:,\d{1,2})?)/) || tramo.match(/\$\s*([\d.]{5,}(?:,\d{1,2})?)/);
    if (p) { const n = parseMonto(p[1]); if (n) return n; }
  }
  return null;
}
function extraerPlazo(texto) {
  const i = texto.search(/plazo/i);
  if (i < 0) return null;
  const tramo = texto.slice(i, i + 250);
  const m = tramo.match(/\((\d{1,3})\)\s*meses/i) || tramo.match(/(\d{1,3})\s*meses/i);
  if (m) return parseInt(m[1], 10);
  const w = normTxt(tramo).match(/(treinta y seis|veinticuatro|dieciocho|doce|seis)\s+meses/);
  return w ? NUM_TXT[w[1]] : null;
}
function extraerInicio(texto) {
  let m = texto.match(/(?:a partir del?|contados? desde el|desde el)\s+(\d{1,2})\s*[º°]?\s+de\s+([a-záéíóú]+)\s+(?:de|del)\s+(\d{4})/i);
  if (m) {
    const mes = MESES_TXT[normTxt(m[2])];
    if (mes) return `${m[3]}-${String(mes).padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  }
  m = texto.match(/(?:a partir del?|contados? desde el|desde el)\s+(\d{1,2})\/(\d{1,2})\/(\d{2,4})/i);
  if (m) {
    const y = m[3].length === 2 ? "20" + m[3] : m[3];
    return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  }
  return null;
}
function extraerPeriodoInicial(texto) {
  const n = normTxt(texto);
  let m = n.match(/por (?:los|el) (?:([a-z]+) )?(?:\((\d{1,2})\) )?primeros (?:\((\d{1,2})\) )?meses/);
  if (m) {
    const v = m[2] || m[3] ? parseInt(m[2] || m[3], 10) : NUM_TXT[m[1]];
    if (v) return v;
  }
  m = n.match(/primer (bimestre|trimestre|cuatrimestre|semestre|ano)/);
  if (m) return { bimestre: 2, trimestre: 3, cuatrimestre: 4, semestre: 6, ano: 12 }[m[1]];
  return null;
}
function extraerPeriodicidad(texto) {
  const n = normTxt(texto);
  const m = n.match(/(?:actualizaci[a-z]*|ajuste[a-z]*|actualizable)\s+(?:[a-z]+\s+){0,2}?(mensual|bimestral|trimestral|cuatrimestral|semestral|anual)/)
    || n.match(/(mensual|bimestral|trimestral|cuatrimestral|semestral|anual)(?:mente)?\s+(?:actualizable|ajustable)/);
  if (!m) return null;
  return PERIODICIDADES.find((p) => normTxt(p) === m[1]) || null;
}
function extraerInmueble(texto) {
  const m = texto.match(/inmueble\s+(?:ubicado|sito|situado)\s+en\s+(?:la\s+)?(.{4,120}?)\s*,?\s*de la (ciudad|localidad) de ([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ ]{2,40}?)(?=\s*[,.;]|\s+(?:Dpto|Departamento|Partida|Provincia|afectado|con destino))/i);
  if (m) return `${m[1].replace(/^calle\s+/i, "").trim()}, ${m[3].trim()}`;
  const m2 = texto.match(/inmueble\s+(?:ubicado|sito|situado)\s+en\s+(?:la\s+)?(.{4,90}?)(?=\s*[,;]|\s+(?:Dpto|Partida|afectado|con destino))/i);
  return m2 ? m2[1].replace(/^calle\s+/i, "").trim() : null;
}
function extraerLocadores(texto) {
  const res = [];
  const reDni = /D\s*\.?\s*N\s*\.?\s*I\s*\.?\s*(?:N\s*\.?\s*[º°o]?\s*\.?)?\s*:?\s*([\d.]{7,11})/;
  const rePersona = new RegExp(String.raw`(?:\bSr\.?|\bSra\.?|\bSeñor(?:a)?|\bSRA?\.)\s+([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ'.\s]{3,70}?)\s*,?\s*` + reDni.source, "g");
  const reCuit = /CUI[TL]\s*N?\s*\.?\s*[º°o]?\s*\.?\s*:?\s*(\d{2}\s*-?\s*\d{7,8}\s*-?\s*\d)/i;
  let m;
  while ((m = rePersona.exec(texto))) {
    // descarta a quien firma en representación del Estado (Síndica, Ministro, etc.)
    const antes = normTxt(texto.slice(Math.max(0, m.index - 70), m.index));
    if (/representad|en representacion|\bsindica\b|\bministr[oa]\b|\bdirector(a)?\b|\bsecretari[oa]\b|\bescriban[oa]\b/.test(antes)) continue;
    const despues = texto.slice(m.index + m[0].length, m.index + m[0].length + 60);
    const c = despues.match(reCuit);
    res.push({ nombre: tituloSiMayus(m[1].replace(/\s*(?:,|D\.?N\.?I).*$/i, "")), dni: m[2].replace(/\.$/, ""), cuit: c ? c[1].replace(/\s/g, "") : "" });
  }
  // Personas jurídicas (S.A., S.R.L., S.A.S.) seguidas de CUIT
  const reEmpresa = /([A-ZÁÉÍÓÚÑ0-9][A-ZÁÉÍÓÚÑ0-9 .&]{2,60}?\s(?:S\.?\s?A\.?\s?S\.?|S\.?\s?R\.?\s?L\.?|S\.?\s?A\.?))\s*,?\s*CUIT\s*N?\s*\.?\s*[º°o]?\s*\.?\s*:?\s*(\d{2}-?\d{8}-?\d)/g;
  while ((m = reEmpresa.exec(texto))) res.push({ nombre: m[1].trim(), dni: "", cuit: m[2] });
  return res;
}

// Tipo de contratación según el texto. Es una sugerencia: siempre la confirma el usuario.
function extraerTipoContratacion(texto) {
  const n = normTxt(texto);
  if (/legitimo abono/.test(n)) return "Legítimo abono";
  if (/\bart(?:iculo|\.)?\s*(?:n\s*\.?\s*[º°o]?\s*)?140\b/.test(n)) return "Art. 140";
  if (/contratacion directa/.test(n)) return "Contratación directa";
  return null;
}

// Analiza todos los documentos y arma la propuesta de precarga.
function analizarDocumentos(docsCrudos, { contratos, dependencias, locadoresGuardados }) {
  const docs = docsCrudos.map(prepararDocumento);
  const legibles = docs.filter((d) => !d.escaneado);
  const escaneados = docs.filter((d) => d.escaneado).map((d) => d.nombre);
  // Prioridad: contrato (cláusulas limpias), luego parte dispositiva de la resolución, luego el resto.
  const orden = [...legibles].sort((a, b) => ({ contrato: 0, "resolución": 1, documento: 2 }[a.tipo] - { contrato: 0, "resolución": 1, documento: 2 }[b.tipo]));
  const util = (fn) => primero(orden, (d) => fn(d.util));

  const campos = [];
  const add = (key, label, r, formato) => campos.push({ key, label, valor: r ? r.valor : "", origen: r ? r.origen : "", aceptar: !!r, formato });

  // Expediente: el código EE más repetido entre todos los documentos
  const cuenta = {};
  legibles.forEach((d) => (d.plano.match(/EE-\d{4}-\d{5,8}-[A-Z]+-[A-Z]+/g) || []).forEach((e) => { cuenta[e] = (cuenta[e] || 0) + 1; }));
  const exp = Object.keys(cuenta).sort((a, b) => cuenta[b] - cuenta[a] || b.length - a.length)[0];
  add("expediente", "Expediente", exp ? { valor: exp, origen: legibles.filter((d) => d.plano.includes(exp)).map((d) => d.nombre).join(", ") } : null);

  add("resolucion", "Resolución", primero(legibles, (d) => { const m = d.plano.match(/\b(?:RESCONJ|RESOL|DECRE|DISPO)-\d{4}-\d+-[A-Z]+-[A-Z]+(?:#\w+)?/); return m ? m[0] : null; }));
  add("numeroContrato", "N° de contrato", primero(legibles.filter((d) => d.tipo === "contrato"), (d) => { const m = d.plano.slice(0, 500).match(/CONTRATO\s+(?:P[ÚU]BLICO\s+)?N\s*\.?\s*[º°o]?\s*\.?\s*:?\s*(\d[\d.\/-]*)/i); return m ? m[1] : null; }));

  // Dependencia: el nombre de dependencia cargada más largo que aparezca en el texto
  const todo = normTxt(legibles.map((d) => d.plano).join(" "));
  const dep = [...dependencias].filter((d) => normTxt(d.nombre).length >= 4 && todo.includes(normTxt(d.nombre))).sort((a, b) => b.nombre.length - a.nombre.length)[0];
  add("dependenciaId", "Dependencia", dep ? { valor: dep.id, origen: "texto de los documentos" } : null, "dependencia");

  add("inmueble", "Inmueble", util(extraerInmueble));
  const canon = util(extraerCanon);
  add("canon", "Canon mensual base", canon ? { ...canon, valor: String(canon.valor) } : null, "monto");
  add("inicio", "Fecha de inicio", util(extraerInicio), "fecha");
  const plazo = util(extraerPlazo);
  add("meses", "Plazo (meses)", plazo ? { ...plazo, valor: String(plazo.valor) } : null);
  const ini = util(extraerPeriodoInicial);
  add("mesesPeriodoInicial", "Meses período inicial fijo", ini ? { ...ini, valor: String(ini.valor) } : null);
  add("periodicidad", "Periodicidad de ajuste", util(extraerPeriodicidad), "periodicidad");
  // el tipo se busca en todo el texto (suele estar en los considerandos)
  add("tipoContratacion", "Tipo de contratación", primero(orden, (d) => extraerTipoContratacion(d.plano)), "tipo");

  // Renovación y contrato anterior (se buscan en todo el texto: suelen estar en los considerandos)
  const renov = primero(legibles, (d) => (/renovaci[oó]n|pr[oó]rroga\b/i.test(d.plano) ? "Sí" : null));
  add("esRenovacion", "Es renovación", renov);
  const antTxt = primero(legibles, (d) => { const m = d.plano.match(/Contrato\s+P[úu]blico\s+N\s*\.?\s*[º°o]?\s*\.?\s*:?\s*(\d[\d.\/-]*)/i); return m ? m[1] : null; });
  let anterior = null;
  if (antTxt) {
    const encontrado = contratos.find((c) => c.numero_contrato && numContrato(c.numero_contrato) === numContrato(antTxt.valor));
    anterior = { numero: antTxt.valor, origen: antTxt.origen, contratoId: encontrado ? encontrado.id : "", aceptar: !!encontrado };
  }

  // Locadores: de la parte útil de cada documento, sin repetir DNI/CUIT
  const vistos = new Set();
  const locadores = [];
  orden.forEach((d) => extraerLocadores(d.util).forEach((l) => {
    const clave = soloDigitos(l.dni) || soloDigitos(l.cuit).slice(2, 10) || normTxt(l.nombre);
    if (vistos.has(clave)) return;
    vistos.add(clave);
    locadores.push({ ...l, origen: d.nombre, aceptar: true, porcentaje: "" });
  }));
  // % por defecto: si el contrato anterior está cargado, el % de cada locador coincidente; si no, partes iguales.
  const locAnt = anterior && anterior.contratoId ? (locadoresGuardados || []).filter((l) => l.contrato_id === anterior.contratoId) : [];
  const apellidos = (n) => normTxt(n).split(" ").filter((x) => x.length > 2);
  locadores.forEach((l) => {
    const par = locAnt.find((a) => { const A = apellidos(a.nombre); return apellidos(l.nombre).filter((x) => A.includes(x)).length >= 2; });
    l.porcentaje = par && par.porcentaje != null ? String(par.porcentaje) : String(Math.round(10000 / locadores.length) / 100);
    l.porcentajeDe = par ? "contrato anterior" : "partes iguales";
  });

  return { campos, locadores, anterior, escaneados, documentos: docs.map((d) => ({ nombre: d.nombre, tipo: d.tipo, escaneado: d.escaneado, paginas: d.paginas })) };
}

function Login() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);
  const ingresar = async (e) => {
    e.preventDefault();
    setError(""); setCargando(true);
    const { error } = await db.auth.signInWithPassword({ email, password });
    setCargando(false);
    if (error) setError("Usuario o contraseña incorrectos.");
  };
  return (
    <div style={{ fontFamily: "Inter, sans-serif", minHeight: "100vh", background: "#1B2A4A", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <form onSubmit={ingresar} style={{ background: "#fff", borderRadius: 14, padding: "40px 36px", width: 360, maxWidth: "90vw" }}>
        <div style={{ fontFamily: "'Source Serif 4', serif", fontSize: 20, fontWeight: 700, color: "#1B2A4A", marginBottom: 4 }}>Gestión de Contratos</div>
        <div style={{ fontSize: 12, color: "#8A8578", marginBottom: 28 }}>PROVINCIA DE SANTA FE</div>
        <Campo label="Usuario (email)"><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required style={inputStyle} /></Campo>
        <div style={{ height: 12 }} />
        <Campo label="Contraseña"><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required style={inputStyle} /></Campo>
        {error && <div style={{ color: "#B54B3A", fontSize: 12.5, margin: "14px 0" }}>{error}</div>}
        <button type="submit" disabled={cargando} style={{ width: "100%", marginTop: 20, padding: "11px", borderRadius: 8, border: "none", background: "#1B2A4A", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
          {cargando ? "Ingresando…" : "Ingresar"}
        </button>
      </form>
    </div>
  );
}

function Dashboard() {
  const [perfil, setPerfil] = useState(null);
  const [nav, setNav] = useState("contratos");
  const [contratos, setContratos] = useState([]);
  const [locadores, setLocadores] = useState([]);
  const [preventivos, setPreventivos] = useState([]);
  const [periodosGuardados, setPeriodosGuardados] = useState([]);
  const [indices, setIndices] = useState([]);
  const [jurisdicciones, setJurisdicciones] = useState([]);
  const [dependencias, setDependencias] = useState([]);
  const [estadosTramite, setEstadosTramite] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [error, setError] = useState("");
  const [contratoSelId, setContratoSelId] = useState(null);
  const [editando, setEditando] = useState(false);
  const [modulo, setModulo] = useState(null); // null = pantalla de inicio | "alq" | "oc"
  const [ocData, setOcData] = useState(OC_VACIO);
  const [ocError, setOcError] = useState("");
  const [ocSelId, setOcSelId] = useState(null);
  const [ocEditId, setOcEditId] = useState(null);
  const ocResumenes = useMemo(() => ocData.gestiones.map((g) => ocResumen(g, ocData)), [ocData]);

  const cargarOC = async () => {
    try {
      const [gestiones, items, tramos, hitos, preventivos, facturas, lineas, imputaciones, documentos, tc] = await Promise.all([
        ocSelectTodo("oc_gestiones", "id"), ocSelectTodo("oc_items", "id"), ocSelectTodo("oc_item_tramos", "id"), ocSelectTodo("oc_item_hitos", "id"),
        ocSelectTodo("oc_preventivos", "id"), ocSelectTodo("oc_facturas", "id"), ocSelectTodo("oc_factura_lineas", "id"),
        ocSelectTodo("oc_imputaciones", "id"), ocSelectTodo("oc_documentos", "id"), ocSelectTodo("tc_bna", "fecha"),
      ]);
      gestiones.sort((a, b) => b.id - a.id);
      // los rubros se cargan aparte: si la tabla todavía no existe, el resto del módulo funciona igual
      let rubros = [];
      try { rubros = (await ocSelectTodo("oc_rubros", "id")).sort((a, b) => a.nombre.localeCompare(b.nombre)); } catch (e) { rubros = []; }
      setOcData({ rubros, gestiones, items, tramos, hitos, preventivos, facturas, lineas, imputaciones, documentos, tc });
      setOcError("");
    } catch (e) {
      setOcError("No se pudieron cargar las otras contrataciones: " + (e.message || e));
    }
  };
  const elegirModulo = (m) => {
    setModulo(m); setContratoSelId(null); setOcSelId(null); setOcEditId(null);
    setNav(m === "oc" ? "tablero" : "contratos");
  };
  const abrirOCDesdeTablero = (id) => { setModulo("oc"); setOcEditId(null); setOcSelId(id); };
  const abrirAlqDesdeTablero = (id) => { setModulo("alq"); setNav("contratos"); setOcSelId(null); setContratoSelId(id); };

  const cargarTodo = async () => {
    setCargando(true); setError("");
    try {
      const { data: { user } } = await db.auth.getUser();
      const { data: p } = await db.from("perfiles").select("id, nombre, rol").eq("id", user.id).single();
      const [
        { data: c, error: ec }, { data: idx, error: ei }, { data: j, error: ej }, { data: d, error: ed },
        { data: loc, error: el }, { data: prev, error: ep }, { data: per, error: epe },
        { data: et, error: eet },
      ] = await Promise.all([
        db.from("contratos").select("*, dependencias(nombre, jurisdiccion_codigo)").order("created_at", { ascending: false }),
        db.from("indices_icl").select("fecha, valor").order("fecha"),
        db.from("jurisdicciones").select("codigo, nombre").order("codigo"),
        db.from("dependencias").select("id, nombre, jurisdiccion_codigo").order("nombre"),
        db.from("contrato_locadores").select("*"),
        db.from("contrato_preventivos").select("*"),
        db.from("periodos_factura").select("*"),
        db.from("estados_tramite").select("*").order("nombre"),
      ]);
      if (ec) throw ec; if (ei) throw ei; if (ej) throw ej; if (ed) throw ed;
      if (el) throw el; if (ep) throw ep; if (epe) throw epe; if (eet) throw eet;
      setPerfil(p); setContratos(c || []); setIndices(idx || []); setJurisdicciones(j || []); setDependencias(d || []);
      setLocadores(loc || []); setPreventivos(prev || []); setPeriodosGuardados(per || []); setEstadosTramite(et || []);
    } catch (e) {
      setError(e.message || "Error al cargar los datos.");
    } finally { setCargando(false); }
  };
  useEffect(() => { cargarTodo(); cargarOC(); }, []);
  const cerrarSesion = () => db.auth.signOut();

  const irAFicha = (c) => { setContratoSelId(c.id); setEditando(false); };
  // El contrato de la ficha se relee siempre desde `contratos` (por id), nunca desde una copia
  // guardada al abrir la ficha — así, después de guardar un cambio, la ficha muestra el dato fresco.
  const contratoSel = contratoSelId ? contratos.find((c) => c.id === contratoSelId) || null : null;

  // ---- Backup completo (JSON) ----
  const exportarBackup = async () => {
    const backup = {
      exportado_en: new Date().toISOString(),
      contratos, contrato_locadores: locadores, contrato_preventivos: preventivos,
      periodos_factura: periodosGuardados, indices_icl: indices, jurisdicciones, dependencias, estados_tramite: estadosTramite,
      oc_gestiones: ocData.gestiones, oc_items: ocData.items, oc_item_tramos: ocData.tramos, oc_item_hitos: ocData.hitos,
      oc_preventivos: ocData.preventivos, oc_facturas: ocData.facturas, oc_factura_lineas: ocData.lineas,
      oc_imputaciones: ocData.imputaciones, oc_documentos: ocData.documentos, tc_bna: ocData.tc,
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `backup-contratos-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const restaurarBackup = async (file) => {
    if (!confirm("Esto va a AGREGAR los datos del archivo a lo que ya está cargado (no borra nada existente). ¿Continuar?")) return;
    try {
      const texto = await file.text();
      const backup = JSON.parse(texto);
      const limpiar = (filas, campos) => (filas || []).map((f) => {
        const nuevo = {};
        campos.forEach((c) => { if (f[c] !== undefined) nuevo[c] = f[c]; });
        return nuevo;
      });
      if (backup.jurisdicciones?.length) await db.from("jurisdicciones").insert(limpiar(backup.jurisdicciones, ["codigo", "nombre"]));
      if (backup.dependencias?.length) await db.from("dependencias").insert(limpiar(backup.dependencias, ["nombre", "jurisdiccion_codigo"]));
      if (backup.estados_tramite?.length) await db.from("estados_tramite").insert(limpiar(backup.estados_tramite, ["nombre"]));
      if (backup.indices_icl?.length) await db.from("indices_icl").insert(limpiar(backup.indices_icl, ["fecha", "valor"]));
      if (backup.contratos?.length) {
        const camposContrato = ["jurisdiccion_codigo","dependencia_id","inmueble","locador","expediente","resolucion","canon_base","periodicidad_ajuste","meses_periodo_inicial","fecha_inicio","plazo_meses","presupuesto_preventivo","fecha_notificacion_tcp","numero_contrato","es_renovacion","contrato_anterior_id","creado_por","tipo_contratacion","estado_tramite","icl_ficticio_pct"];
        await db.from("contratos").insert(limpiar(backup.contratos, camposContrato));
      }
      alert("Restauración completada. Recargando datos…");
      onCambio && onCambio();
      cargarTodo();
    } catch (e) {
      alert("Error al restaurar: " + e.message);
    }
  };

  if (cargando) return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", fontFamily: "Inter, sans-serif", color: "#8A8578" }}>Cargando…</div>;

  const navActual = modulo === "oc" ? NAV_OC : modulo === "alq" ? NAV_ITEMS : [];
  const tituloModulo = modulo === "oc" ? "Otras contrataciones" : modulo === "alq" ? "Gestión de Locaciones" : "Gestión de Contratos";
  const renderOC = () => {
    if (ocError) return (
      <div style={{ background: "#FBEBE7", border: "1px solid #E4B8AF", color: "#9C3F2E", padding: "14px 16px", borderRadius: 8, fontSize: 13 }}>
        {ocError}
        <div style={{ marginTop: 10 }}><button onClick={cargarOC} style={ocBtn2}>Reintentar</button></div>
      </div>
    );
    if (ocEditId) {
      const g = ocData.gestiones.find((x) => x.id === ocEditId);
      return <OCFormView key={"edit" + ocEditId} gestion={g} data={ocData} jurisdicciones={jurisdicciones} dependencias={dependencias} estadosTramite={estadosTramite} rubros={ocData.rubros}
        onGuardado={async (id) => { await cargarOC(); setOcEditId(null); setOcSelId(id); }} onCancelar={() => setOcEditId(null)} />;
    }
    const sel = ocSelId ? ocResumenes.find((r) => r.g.id === ocSelId) : null;
    if (sel) return <OCDetalleView key={sel.g.id} resumen={sel} data={ocData} jurisdicciones={jurisdicciones} dependencias={dependencias}
      onVolver={() => setOcSelId(null)} onEditar={() => setOcEditId(sel.g.id)} onAbrirOtra={(id) => setOcSelId(id)} onCambio={cargarOC} />;
    if (nav === "oc_nueva") return <OCFormView key="nueva" gestion={null} data={ocData} jurisdicciones={jurisdicciones} dependencias={dependencias} estadosTramite={estadosTramite} rubros={ocData.rubros}
      onGuardado={async (id) => { await cargarOC(); setNav("tablero"); setOcSelId(id); }} onCancelar={() => setNav("tablero")} />;
    if (nav === "oc_pendientes") return <OCPendientesView resumenes={ocResumenes} onAbrir={(id) => setOcSelId(id)} />;
    if (nav === "oc_tc") return <TCView tcs={ocData.tc} onCambio={cargarOC} />;
    if (nav === "dependencias") return (
      <>
        <OCRubrosCard rubros={ocData.rubros} ocGestiones={ocData.gestiones} onCambio={cargarOC} />
        <DependenciasView jurisdicciones={jurisdicciones} dependencias={dependencias} contratos={contratos} ocGestiones={ocData.gestiones} estadosTramite={estadosTramite} onCambio={() => { cargarTodo(); cargarOC(); }} />
      </>
    );
    return renderTablero(() => setNav("oc_nueva"));
  };
  const renderTablero = (onNueva) => (
    <TableroView contratos={contratos} ocResumenes={ocResumenes} rubros={ocData.rubros} jurisdicciones={jurisdicciones} dependencias={dependencias} estadosTramite={estadosTramite}
      onAbrirOC={abrirOCDesdeTablero} onAbrirAlq={abrirAlqDesdeTablero} onNueva={onNueva} onCambio={() => { cargarTodo(); cargarOC(); }} />
  );

  return (
    <div style={{ fontFamily: "Inter, sans-serif", background: "#F6F5F2", minHeight: "100vh" }}>
      <style>{`
        * { box-sizing: border-box; }
        .serif { font-family: 'Source Serif 4', serif; }
        table { border-collapse: collapse; width: 100%; }
        th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #8A8578; font-weight: 600; padding: 10px 14px; border-bottom: 1px solid #E4E1D8; }
        td { padding: 12px 14px; border-bottom: 1px solid #EDEBE3; font-size: 13.5px; vertical-align: middle; }
        tr:hover td { background: #FBFAF7; }
      `}</style>
      <header style={{ background: "#1B2A4A", color: "#D7DCE6", padding: "0 24px", minHeight: 60, display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 24, flexWrap: "wrap" }}>
          <div className="serif" onClick={() => setModulo(null)} title="Volver al inicio" style={{ fontSize: 15, fontWeight: 700, color: "#fff", cursor: "pointer" }}>{tituloModulo}</div>
          <nav style={{ display: "flex", gap: 3, flexWrap: "wrap" }}>
            {navActual.map((item) => (
              <button key={item.key} onClick={() => { setNav(item.key); setContratoSelId(null); setOcSelId(null); setOcEditId(null); }}
                style={{ padding: "6px 10px", borderRadius: 7, border: "none", cursor: "pointer",

                  color: (nav === item.key) ? "#fff" : "#B7C1D6", fontSize: 12.5, fontWeight: 500 }}>

          <button onClick={exportarBackup} title="Descargar copia de seguridad completa" style={{ padding: "6px 10px", borderRadius: 7, border: "1px solid #3E5580", background: "transparent", color: "#D7DCE6", fontSize: 11.5, cursor: "pointer" }}>⬇ Backup</button>
          <label style={{ padding: "6px 10px", borderRadius: 7, border: "1px solid #3E5580", background: "transparent", color: "#D7DCE6", fontSize: 11.5, cursor: "pointer" }}>

            <input type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => e.target.files[0] && restaurarBackup(e.target.files[0])} />

          <div style={{ fontSize: 12, color: "#B7C1D6" }}>{perfil?.nombre}</div>
          <button onClick={cerrarSesion} style={{ padding: "6px 10px", borderRadius: 7, border: "1px solid #3E5580", background: "transparent", color: "#D7DCE6", fontSize: 12, cursor: "pointer" }}>Salir</button>

      <main style={{ padding: "24px 24px 60px", maxWidth: 1150, margin: "0 auto" }}>
